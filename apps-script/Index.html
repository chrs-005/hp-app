/**
 * Ticks and line editing inside any list of lines. A tap updates its row in place (the list
 * does not move under your finger) and calls onTick(); rerender() redraws after an edit.
 */
function wireLines(el, rerender, onTick) {
  el.addEventListener('click', (e) => {
    const tick = e.target.closest('[data-tick]');
    if (tick) {
      const row = tick.closest('[data-line]');
      toggleLine(row.dataset.line, tick.dataset.tick, row);
      if (onTick) onTick();
      return;
    }
    const ed = e.target.closest('[data-ledit]');
    if (ed) flushMoney().then(() => editLine(money().lines.find(l => l.id === ed.dataset.ledit), rerender));
  });
}

function updateLineRow(row, l) {
  const st = lineState(l);
  row.className = 'mline st-' + st;
  $$('[data-tick]', row).forEach(b => b.setAttribute('aria-pressed', String(!!l[b.dataset.tick])));
  const label = $('.st', row);
  if (label) {
    label.className = 'st ' + LINE_STATES[st].tone;
    label.textContent = st !== 'open' ? ' · ' + LINE_STATES[st].label : '';
  }
}

// ---- Given / Paid taps are saved in batches: the screen changes at once, Google gets one
// request for all the taps of the last half second, and answers never undo newer taps.
const moneyPending = new Map();   // line id -> { id, given?, paid? }
let moneyTimer = null;
let moneyInflight = null;          // the request on its way
let moneyError = null;

function toggleLine(id, field, row) {
  const l = money().lines.find(x => x.id === id);
  if (!l) return;
  l[field] = !l[field];
  l[field + 'At'] = l[field] ? new Date().toISOString() : '';
  const c = moneyPending.get(id) || { id: id };
  c[field] = l[field];
  moneyPending.set(id, c);
  if (row) updateLineRow(row, l);
  clearTimeout(moneyTimer);
  moneyTimer = setTimeout(flushMoney, 500);
  showSaveState();
}

/** Sends the waiting taps now; resolves once they are saved (or queued again after a failure). */
async function flushMoney() {
  clearTimeout(moneyTimer);
  while (moneyInflight) await moneyInflight;
  if (!moneyPending.size) return;
  const batch = Array.from(moneyPending.values());
  moneyPending.clear();
  let retry = false;
  const send = () => call('tickLines', { changes: batch }).catch(async (e) => {
    if (!/Unknown action/.test(e.message)) throw e;
    // Server code not updated yet: save the taps one by one the old way.
    for (const c of batch) {
      const p = { id: c.id };
      if (c.given !== undefined) p.given = c.given;
      if (c.paid !== undefined) p.paid = c.paid;
      await call('updateLine', p);
    }
  });
  moneyInflight = send().then(() => { moneyError = null; }, (e) => {
    if (e.message === 'AUTH') { logout(); return; }
    if (e.server) {   // refused (not a network problem): show it and reload the real data
      moneyError = null;
      toast(e.message, 'bad');
      setTimeout(() => refresh(true), 0);
      return;
    }
    batch.forEach(c => moneyPending.set(c.id, Object.assign({}, c, moneyPending.get(c.id) || {})));
    moneyError = e.message;
    retry = true;
  });
  showSaveState();
  await moneyInflight;
  moneyInflight = null;
  showSaveState();
  if (moneyPending.size) moneyTimer = setTimeout(flushMoney, retry ? 5000 : 300);
}

/** Server data replaces the local copy, then the taps not saved yet are put back on top. */
function setMoney(m) {
  S.data.money = { catalog: m.catalog || [], orders: m.orders || [], lines: m.lines || [] };
  applyPendingTicks();
}
function applyPendingTicks() {
  if (!S.data || !S.data.money || !moneyPending.size) return;
  S.data.money.lines.forEach(l => {
    const c = moneyPending.get(l.id);
    if (!c) return;
    if (c.given !== undefined) l.given = c.given;
    if (c.paid !== undefined) l.paid = c.paid;
  });
}

function renderOrder(v, M) {
  const o = money().orders.find(x => x.id === M.orderId);
  const ls = orderLines(o.id);
  const s = moneySums(ls);
  const troupe = o.kind === 'troupe';
  const FILTERS = [['all', 'All'], ['owes', 'Owes money'], ['give', 'To give'], ['notgiven', 'Not given'], ['notpaid', 'Not paid'], ['done', 'Done']];
  const match = (l) => (M.filter === 'all' || (M.filter === 'notgiven' ? !l.given : M.filter === 'notpaid' ? !l.paid : lineState(l) === M.filter)) &&
    (M.patrol === 'all' || memberOf(l.memberId).patrol === M.patrol);
  const shown = ls.filter(match).sort((a, b) => {
    const ma = memberOf(a.memberId), mb = memberOf(b.memberId);
    return (patrolRank(ma.patrol) - patrolRank(mb.patrol)) || ((ma.order || 0) - (mb.order || 0)) || ma.name.localeCompare(mb.name);
  });
  const sub = troupe ? fmtMoney(o.price) + ' each · ' + plural(s.n, 'scout') : 'Single order · ' + memberOf((ls[0] || {}).memberId).patrol;
  const patrolsIn = S.data.patrols.filter(p => ls.some(l => memberOf(l.memberId).patrol === p));

  let html =
    '<button class="btn ghost sm" id="mBack" style="padding-left:0">' + icon('back', 'sm') + 'All orders</button>' +
    '<div class="row" style="justify-content:space-between;align-items:flex-end"><div><h1>' + esc(orderTitle(o)) + '</h1><p class="sub">' + esc(sub) + '</p>' +
      (o.note ? '<p class="small muted" style="margin-top:4px">' + esc(o.note) + '</p>' : '') + '</div>' +
      '<div class="row"><button class="btn sm" id="oEdit">Edit</button><button class="btn sm" id="oCsv">' + icon('download', 'sm') + 'CSV</button><button class="btn sm danger" id="oDel">Delete</button></div></div>' +
    '<div class="sum-pills" id="oSum">' + orderSumHtml(ls) + '</div>';
  if (troupe) {
    html += '<div class="chips">' + FILTERS.map(f => '<button class="chip" data-mfilter="' + f[0] + '" aria-pressed="' + (M.filter === f[0]) + '">' + f[1] + '</button>').join('') + '</div>' +
      (patrolsIn.length > 1 ? '<div class="chips">' + ['all'].concat(patrolsIn).map(p =>
        '<button class="chip" data-mpatrol="' + esc(p) + '" aria-pressed="' + (M.patrol === p) + '" style="--pc:' + (p === 'all' ? 'var(--none)' : patrolColor(p)) + '">' +
        (p === 'all' ? 'All patrols' : '<span class="pdot"></span>' + esc(p)) + '</button>').join('') + '</div>' : '') +
      '<div class="row"><button class="btn sm" id="bulkGiven"></button><button class="btn sm" id="bulkPaid"></button>' +
        '<button class="btn sm" id="addScouts">' + icon('plus', 'sm') + 'Add scouts</button></div>';
  }
  html += '<section class="card" id="oLines">' + (shown.length
    ? shown.map(l => troupe
      ? lineRowHtml(l, memberOf(l.memberId).name, (l.variant ? 'Size ' + l.variant + ' · ' : '') + (lineTotal(l) !== o.price ? fmtMoney(lineTotal(l)) + ' · ' : '') + memberOf(l.memberId).patrol)
      : lineRowHtml(l, lineLabel(l), (l.qty > 1 ? l.qty + ' × ' + fmtMoney(l.price) + ' = ' : '') + fmtMoney(lineTotal(l)))).join('')
    : '<p class="empty">Nobody here.</p>') + '</section>' +
    (troupe ? '' : '<button class="btn" id="addItem">' + icon('plus', 'sm') + 'Add an item</button>');
  v.innerHTML = html;

  const again = () => { const y = window.scrollY; renderOrder(v, M); window.scrollTo(0, y); };
  $('#mBack', v).onclick = () => { M.orderId = null; renderMoney(v); };
  $('#oEdit', v).onclick = () => editOrder(o);
  $('#oDel', v).onclick = async () => {
    if (!await confirmBox('Delete "' + orderTitle(o) + '"?', 'All its lines (who got it, who paid) are deleted too.', 'Delete', true)) return;
    try { await flushMoney(); setMoney(await call('deleteOrder', { id: o.id })); M.orderId = null; renderMoney(v); toast('Order deleted'); } catch (e) { toast(e.message, 'bad'); }
  };
  $('#oCsv', v).onclick = () => {
    const q = (x) => '"' + String(x == null ? '' : x).replace(/"/g, '""') + '"';
    downloadCsv([['Scout', 'Patrol', 'Item', 'Size', 'Qty', 'Price', 'Total', 'Given', 'Paid'].map(q).join(',')].concat(ls.map(l => {
      const m = memberOf(l.memberId);
      return [m.name, m.patrol, l.item, l.variant, l.qty, l.price, lineTotal(l), l.given ? 'yes' : '', l.paid ? 'yes' : ''].map(q).join(',');
    })), 'order-' + nameKey(orderTitle(o)) + '.csv');
  };
  $$('[data-mfilter]', v).forEach(b => { b.onclick = () => { M.filter = b.dataset.mfilter; again(); }; });
  $$('[data-mpatrol]', v).forEach(b => { b.onclick = () => { M.patrol = b.dataset.mpatrol; again(); }; });
  const bulk = async (field) => {
    const ids = shown.filter(l => !l[field]).map(l => l.id);
    if (!ids.length) return;
    if (!await confirmBox('Mark ' + ids.length + ' as ' + field + '?', 'Only the scouts shown in the list now.', 'Mark ' + ids.length)) return;
    try { await flushMoney(); setMoney(await call('setLines', { ids: ids, [field]: true })); again(); } catch (e) { toast(e.message, 'bad'); }
  };
  const counts = () => {
    $('#oSum', v).innerHTML = orderSumHtml(ls);
    [['#bulkGiven', 'given'], ['#bulkPaid', 'paid']].forEach(([sel, field]) => {

      const n = shown.filter(l => !l[field]).length;

      b.disabled = !n;
    });
  };
  counts();
  if ($('#bulkGiven', v)) $('#bulkGiven', v).onclick = () => bulk('given');
  if ($('#bulkPaid', v)) $('#bulkPaid', v).onclick = () => bulk('paid');
  if ($('#addScouts', v)) $('#addScouts', v).onclick = () => addScoutsToOrder(o, again);
  if ($('#addItem', v)) $('#addItem', v).onclick = () => addItemsToOrder(o, again);
  wireLines($('#oLines', v), again, counts);
}

function orderSumHtml(ls) {
  const s = moneySums(ls);
  return '<span class="pill">Given <b>' + s.givenN + '/' + s.n + '</b></span><span class="pill">Paid <b>' + s.paidN + '/' + s.n + '</b></span>' +
    '<span class="pill good">Collected ' + esc(fmtMoney(s.paid)) + ' / ' + esc(fmtMoney(s.total)) + '</span>' +
    (s.owed ? '<span class="pill bad">Owes ' + esc(fmtMoney(s.owed)) + '</span>' : '') + (s.toGiveN ? '<span class="pill warn">To give ' + s.toGiveN + '</span>' : '');
}

const catalog = () => money().catalog || [];
const findCat = (name) => catalog().find(c => nameKey(c.name) === nameKey(name));
/** Items that can be ordered that way: kind 'single' (one scout) or 'troupe' (whole troupe). */
const catalogFor = (kind) => catalog().filter(c => c.scope === 'both' || c.scope === kind);
const OTHER = '__other';
const sizeOptions = (sizes, selected) => '<option value="">Size…</option>' + sizes.map(z => '<option' + (z === selected ? ' selected' : '') + '>' + esc(z) + '</option>').join('');

function itemDatalist() {
  return '<datalist id="itemNames">' + itemNames().map(n => '<option value="' + esc(n) + '">').join('') + '</datalist>';
}

/**
 * One item row: item chosen from the list (or "Other…" typed by hand), its size from the
 * item's sizes, quantity and price (filled from the list). lock = the item cannot change.
 */
function itemRowHtml(it, kind, lock) {
  it = it || {};
  const list = catalogFor(kind || 'single');
  const known = it.item ? findCat(it.item) : null;
  const sel = it.item ? (known ? known.name : OTHER) : '';
  const options = lock
    ? '<option>' + esc(it.item) + '</option>'
    : '<option value="">Choose…</option>' + list.map(c => '<option value="' + esc(c.name) + '"' + (c.name === sel ? ' selected' : '') + '>' + esc(c.name) + '</option>').join('') +
      (known && list.indexOf(known) < 0 ? '<option selected>' + esc(known.name) + '</option>' : '') +
      '<option value="' + OTHER + '"' + (sel === OTHER ? ' selected' : '') + '>Other…</option>';
  return '<div class="irow">' +
    '<label>Item<select class="input" name="itemSel"' + (lock ? ' disabled' : '') + '>' + options + '</select>' +
      '<input class="input' + (sel === OTHER ? '' : ' hidden') + '" name="item" list="itemNames" maxlength="60" placeholder="Item name" value="' + esc(sel === OTHER ? it.item : '') + '"></label>' +
    '<label>Size<select class="input" name="sizeSel"></select>' +
      '<input class="input hidden" name="variant" maxlength="30" placeholder="Size" value="' + esc(it.variant || '') + '"></label>' +
    '<label>Qty<input class="input" name="qty" type="number" inputmode="numeric" min="1" value="' + esc(it.qty || 1) + '"></label>' +
    '<label>Price<input class="input" name="price" type="number" inputmode="decimal" min="0" step="0.01" value="' + esc(it.price != null ? it.price : '') + '"></label>' +
    (lock ? '<span></span>' : '<button type="button" class="icon-btn" data-rmrow aria-label="Remove">' + icon('x', 'sm') + '</button>') + '</div>';
}

/** Shows the right size control for the chosen item; fillPrice puts the list price in. */
function syncItemRow(row, fillPrice) {
  const sel = $('[name=itemSel]', row).value;
  const c = sel && sel !== OTHER ? findCat(sel) : null;
  const sizeSel = $('[name=sizeSel]', row);
  const sizeIn = $('[name=variant]', row);
  $('[name=item]', row).classList.toggle('hidden', sel !== OTHER);
  if (sel === OTHER) {
    sizeSel.classList.add('hidden');
    sizeIn.classList.remove('hidden');
  } else {
    sizeIn.classList.add('hidden');
    sizeSel.classList.remove('hidden');
    const sizes = c ? c.sizes : [];
    const current = sizeIn.value;
    sizeSel.innerHTML = sizes.length ? sizeOptions(sizes.concat(current && sizes.indexOf(current) < 0 ? [current] : []), current) : '<option value="">—</option>';
    sizeSel.disabled = !sizes.length;
  }
  if (fillPrice && c && c.price != null) $('[name=price]', row).value = c.price;
}

function readItemRows(root) {
  return $$('.irow', root).map(r => {
    const sel = $('[name=itemSel]', r).value;
    const other = sel === OTHER;
    const c = sel && !other ? findCat(sel) : null;
    return {
      item: other ? $('[name=item]', r).value : sel,
      variant: other ? $('[name=variant]', r).value : (c && c.sizes.length ? $('[name=sizeSel]', r).value : ''),
      qty: $('[name=qty]', r).value,
      price: $('[name=price]', r).value,
    };
  }).filter(it => String(it.item).trim() || it.price !== '');
}

function wireItemRows(root) {
  $$('.irow', root).forEach(r => syncItemRow(r, false));
  root.addEventListener('click', (e) => {
    const rm = e.target.closest('[data-rmrow]');
    if (rm && $$('.irow', root).length > 1) rm.closest('.irow').remove();
  });
  root.addEventListener('change', (e) => {
    const row = e.target.closest('.irow');
    if (!row) return;
    if (e.target.name === 'itemSel') syncItemRow(row, true);
    if (e.target.name === 'sizeSel') $('[name=variant]', row).value = e.target.value;
  });
}
function addItemRow(root, kind) {
  root.insertAdjacentHTML('beforeend', itemRowHtml(null, kind));
  syncItemRow(root.lastElementChild, false);
}

function memberSelectHtml(selected) {
  return '<select class="input" name="memberId" required><option value="">Choose a scout…</option>' + S.data.patrols.map(p =>
    '<optgroup label="' + esc(p) + '">' + activeMembers([p]).map(m => '<option value="' + esc(m.id) + '"' + (m.id === selected ? ' selected' : '') + '>' + esc(m.name) + '</option>').join('') + '</optgroup>').join('') + '</select>';
}

/** New / edit order. o = { kind } for a new one, or an existing order. */
function editOrder(o, presetMember) {
  const isNew = !o.id;
  const troupe = o.kind === 'troupe';
  let body;
  if (troupe) {
    const list = catalogFor('troupe');
    const known = o.title ? findCat(o.title) : null;
    const sel = o.title ? (known ? known.name : OTHER) : '';
    body = '<label class="field">Item<select class="input" name="titleSel" required><option value="">Choose…</option>' +
        list.map(c => '<option value="' + esc(c.name) + '"' + (c.name === sel ? ' selected' : '') + '>' + esc(c.name) + '</option>').join('') +
        '<option value="' + OTHER + '"' + (sel === OTHER ? ' selected' : '') + '>Other…</option></select>' +
        '<input class="input' + (sel === OTHER ? '' : ' hidden') + '" name="title" list="itemNames" maxlength="60" placeholder="Item name" value="' + esc(sel === OTHER ? o.title : '') + '"></label>' +
      '<label class="field">Price for each scout<input class="input" name="price" type="number" inputmode="decimal" min="0" step="0.01" required value="' + esc(o.price != null ? o.price : '') + '"></label>' +
      (isNew ? '<div class="field" style="margin-top:12px;font-size:13px;font-weight:600;color:var(--text-2)">For which patrols? (you can add or remove scouts later)</div>' +
        '<div class="check-grid">' + S.data.patrols.map(p => '<label class="check"><input type="checkbox" name="patrols" value="' + esc(p) + '" checked><span class="pdot" style="--pc:' + patrolColor(p) + '"></span>' + esc(p) + '</label>').join('') + '</div>'
        : '<p class="muted small" style="margin-top:6px">Changing the price updates every scout who still had the old price.</p>');
  } else {
    body = (isNew ? '<label class="field">Scout' + memberSelectHtml(presetMember) + '</label>' +
      '<div class="field" style="margin-top:12px;font-size:13px;font-weight:600;color:var(--text-2)">Items</div><div id="iRows">' + itemRowHtml(null, 'single') + '</div>' +
      '<button type="button" class="btn sm" id="moreRow" style="margin-top:8px">' + icon('plus', 'sm') + 'Another item</button>' : '');
  }

    '<form id="oForm" style="margin-top:14px">' + body + itemDatalist() + '<p class="err" id="oErr"></p>' +

    onMount: (m, close) => {

      if ($('#iRows', m)) {
        wireItemRows($('#iRows', m));
        $('#moreRow', m).onclick = () => addItemRow($('#iRows', m), 'single');
      }

        f.elements.titleSel.onchange = () => {
          const v = f.elements.titleSel.value;
          f.elements.title.classList.toggle('hidden', v !== OTHER);
          const c = v && v !== OTHER ? findCat(v) : null;
          if (c && c.price != null) f.elements.price.value = c.price;

        };
      }
      f.onsubmit = async (e) => {
        e.preventDefault();
        const payload = { id: o.id, kind: o.kind, note: f.elements.note.value };
        if (troupe) {
          payload.title = f.elements.titleSel.value === OTHER ? f.elements.title.value : f.elements.titleSel.value;
          payload.price = f.elements.price.value;
          if (isNew) {
            const pats = $$('input[name=patrols]:checked', f).map(x => x.value);
            payload.memberIds = activeMembers(pats).map(x => x.id);
          }
        } else if (isNew) {
          payload.memberId = f.elements.memberId.value;
          payload.items = readItemRows(m);
        }

          const res = await call('saveOrder', payload);

          close();
          toast(isNew ? 'Order created' : 'Saved');

          go('money');

const YEAR_TINTS = ['--p8', '--p1', '--p6', '--p4', '--p7', '--p2', '--p3', '--p5'];

function renderOverview(v) {
  const O = S.overview || (S.overview = { patrol: 'all' });

  const tint = (y) => (years.indexOf(y) < 0 ? 'transparent' : 'color-mix(in srgb, var(' + YEAR_TINTS[years.indexOf(y) % YEAR_TINTS.length] + ') 16%, var(--surface))');

  // Cells with an answer open a small box with the reason (hover with a mouse, tap on a phone).
  const cell = (key, m) => {
    const r = rec(key, m.id) || {};
    const data = ' data-k="' + esc(key) + '" data-m="' + esc(m.id) + '"';

      return '<td class="gc ' + r.satStatus + (noShow ? ' noshow' : '') + '"' + data + '>' + (noShow ? '⚠ ' : '') + esc(s.short) + '</td>';
    }
    if (r.wedStatus) {
      const w = statusMeta('wed', r.wedStatus);
      return '<td class="gc said"' + data + '>said ' + esc(w.short.toLowerCase()) + '</td>';
    }
    return '<td class="gc"></td>';
  };

  v.innerHTML =
    '<div class="row" style="justify-content:space-between;align-items:flex-end"><div><h1>Overview</h1>' +
      '<p class="sub">Every scout, every camp and réunion. Tap a name for details.</p></div>' +
      '<button class="btn sm" id="gridCsv">' + icon('download', 'sm') + 'Export CSV</button></div>' +
    (patrols.length > 1 ? '<div class="chips">' + ['all'].concat(patrols).map(p =>
      '<button class="chip" data-gpatrol="' + esc(p) + '" aria-pressed="' + (O.patrol === p) + '" style="--pc:' + (p === 'all' ? 'var(--none)' : patrolColor(p)) + '">' +
      (p === 'all' ? 'All patrols' : '<span class="pdot"></span>' + esc(p)) + '</button>').join('') + '</div>' : '') +
    '<div class="sum-pills"><span class="pill">Present</span><span class="pill warn">Late</span><span class="pill bad">Absent</span>' +
      '<span class="pill noshow-pill">⚠ Absent after saying he would come</span><span class="pill muted">said … = answer before, not filled after</span></div>' +
    '<p class="muted small">' + (matchMedia('(hover: hover)').matches ? 'Hover' : 'Tap') + ' a cell to see the reason.</p>' +
    (members.length ? '<div class="grid-wrap card"><table class="gtable"><thead><tr>' +
      '<th class="gname">Name</th><th>Patrol</th><th>Year</th><th title="Réunions attended">%</th>' +
      cols.map(c => '<th class="' + (c.event ? 'gev' : '') + '"><div>' + esc(c.title) + '</div><small>' + esc(c.sub) + '</small></th>').join('') +
      '</tr></thead><tbody>' +
      members.map(m => {
        const st = stats.byId.get(m.id);
        const pctCls = st && st.pctLevel === 'low' ? 'pct-low' : st && st.pctLevel === 'warn' ? 'pct-warn' : '';
        return '<tr style="--rt:' + tint(m.birthYear) + '">' +
          '<th class="gname" scope="row"><button data-member="' + esc(m.id) + '">' + esc(m.name) + (m.leader ? ' <span class="muted small">' + (m.leader === 'red' ? 'SP' : 'CP') + '</span>' : '') + '</button></th>' +
          '<td class="gmeta">' + esc(m.patrol) + '</td><td class="gmeta">' + esc(m.birthYear) + '</td>' +
          '<td class="gmeta ' + pctCls + (st && st.streakAlert ? ' glow-text' : '') + '">' + pctText(st ? st.pct : null) + '</td>' +
          cols.map(c => cell(c.key, m)).join('') + '</tr>';
      }).join('') +
      '</tbody></table></div>' : '<div class="card empty">No scouts to show.</div>');

  $$('[data-gpatrol]', v).forEach(b => { b.onclick = () => { O.patrol = b.dataset.gpatrol; renderOverview(v); }; });
  wireGridTips(v, cols);
  $$('[data-member]', v).forEach(b => { b.onclick = () => openMemberHistory(b.dataset.member); });

        })).map(q).join(',');
      }));
    downloadCsv(lines, 'overview-' + todayIso() + '.csv');
  };
}

/** The reason box of the Overview grid: hover (mouse) or tap (phone); tap elsewhere / scroll closes it. */
function wireGridTips(v, cols) {
  const wrap = $('.grid-wrap', v);
  if (!wrap) return;
  let tip = $('#gtip');
  if (!tip) {
    tip = document.createElement('div');
    tip.id = 'gtip';
    tip.className = 'gtip hidden';
    document.body.appendChild(tip);
  }
  let pinned = null;
  const titleOf = (key) => { const c = cols.find(x => x.key === key); return c ? c.title + (c.sub ? ' · ' + c.sub : '') : ''; };
  const show = (td) => {
    const r = rec(td.dataset.k, td.dataset.m) || {};
    const m = S.data.members.find(x => x.id === td.dataset.m);
    const s = r.satStatus ? statusMeta('sat', r.satStatus) : null;
    const w = r.wedStatus ? statusMeta('wed', r.wedStatus) : null;
    const noShow = r.satStatus === 'absent' && w && (r.wedStatus === 'coming' || r.wedStatus === 'late');
    let html = '<b>' + esc(m ? m.name : '') + '</b><div class="gtip-when">' + esc(titleOf(td.dataset.k)) + '</div>';
    if (s) {
      html += '<div class="gtip-row"><span class="pill ' + s.tone + '">' + esc(s.label) + '</span></div>';
      if (s.reason) html += '<div class="gtip-reason">' + (r.satReason ? esc(r.satReason) : '<i>No reason given</i>') + '</div>';
    }
    if (w) {
      html += '<div class="gtip-said' + (noShow ? ' bad' : '') + '">' + (noShow ? '⚠ ' : '') + 'They said: ' + esc(w.label) +
        (r.wedReason ? ' – ' + esc(r.wedReason) : '') + '</div>';
    } else if (s) {
      html += '<div class="gtip-said">No answer before</div>';
    }
    tip.innerHTML = html;
    tip.classList.remove('hidden');
    const cr = td.getBoundingClientRect();
    const tr = tip.getBoundingClientRect();
    const left = Math.min(Math.max(8, cr.left + cr.width / 2 - tr.width / 2), innerWidth - tr.width - 8);
    const top = cr.top - tr.height - 8 > 8 ? cr.top - tr.height - 8 : cr.bottom + 8;
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
  };
  const hide = () => { tip.classList.add('hidden'); pinned = null; };
  const hover = matchMedia('(hover: hover)').matches;
  if (hover) {
    wrap.addEventListener('mouseover', (e) => { const td = e.target.closest('td[data-m]'); if (td && !pinned) show(td); });
    wrap.addEventListener('mouseout', (e) => { if (!pinned && !e.relatedTarget?.closest?.('td[data-m]')) hide(); });
  }
  wrap.addEventListener('click', (e) => {
    const td = e.target.closest('td[data-m]');
    if (!td) return;
    e.stopPropagation();
    if (pinned === td) { hide(); return; }
    pinned = td;
    show(td);
  });
  wrap.addEventListener('scroll', hide, { passive: true });
  gridTipHide = hide;
  if (!gridTipGlobal) {
    gridTipGlobal = true;
    window.addEventListener('scroll', () => gridTipHide && gridTipHide(), { passive: true });
    document.addEventListener('click', (e) => { if (gridTipHide && !e.target.closest('#gtip')) gridTipHide(); });
  }
}
let gridTipHide = null;
let gridTipGlobal = false;

function downloadCsv(lines, filename) {
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

// =================================================================== STATS (chief)
function renderStats(v) {
  const st = S.stats;
  const set = S.data.settings;
  const all = computeStats();
  const rows = all.rows.filter(r => st.patrol === 'all' || r.m.patrol === st.patrol);
  const held = all.held;

  // per-meeting numbers for the chart
  const perMeeting = held.map(d => {
    let present = 0, late = 0, absent = 0;
    rows.forEach(r => {
      const s = (rec(d, r.m.id) || {}).satStatus;
      if (s === 'present') present++; else if (s === 'late') late++; else if (s === 'absent') absent++;
    });
    const done = present + late + absent;
    return { date: d, present: present, late: late, absent: absent, done: done, pct: done ? (present + late) / done * 100 : null };
  });
  const sumDone = perMeeting.reduce((a, m) => a + m.done, 0);
  const avg = sumDone ? perMeeting.reduce((a, m) => a + m.present + m.late, 0) / sumDone * 100 : null;
  const lastM = perMeeting[perMeeting.length - 1];
  const alerts = rows.filter(needsAttention).sort((a, b) => (b.absStreak - a.absStreak) || ((a.pct || 0) - (b.pct || 0)));

  const sorters = {
    pct: (a, b) => ((a.pct == null ? 101 : a.pct) - (b.pct == null ? 101 : b.pct)) || (b.absStreak - a.absStreak),
    streak: (a, b) => (b.absStreak - a.absStreak) || ((a.pct || 0) - (b.pct || 0)),
    late: (a, b) => b.late - a.late,
    broken: (a, b) => b.broken - a.broken,
    name: (a, b) => a.m.name.localeCompare(b.m.name),
    patrol: (a, b) => (patrolRank(a.m.patrol) - patrolRank(b.m.patrol)) || (a.m.order - b.m.order),
  };
  const sorted = rows.slice().sort(sorters[st.sort] || sorters.pct);
  const patrols = S.data.patrols;

  let html =
    '<div class="row" style="justify-content:space-between;align-items:flex-end"><div><h1>Statistics</h1><p class="sub">Season from ' + esc(fmtMed(set.seasonStart)) + ' · ' + plural(held.length, 'réunion') + ' recorded</p></div>' +
    '<button class="btn sm" id="csvBtn">' + icon('download', 'sm') + 'Export CSV</button></div>' +
    '<div class="chips">' + ['all'].concat(patrols).map(p =>
      '<button class="chip" data-spatrol="' + esc(p) + '" aria-pressed="' + (st.patrol === p) + '" style="--pc:' + (p === 'all' ? 'var(--none)' : patrolColor(p)) + '">' +
      (p === 'all' ? 'Whole troupe' : '<span class="pdot"></span>' + esc(p)) + '</button>').join('') + '</div>';

  html += '<div class="kpis">' +
    kpi('Réunions held', held.length, all.tracking ? 'Percentages are tracked' : 'Percentages start at ' + set.minMeetings) +
    kpi('Average attendance', pctText(avg), plural(rows.length, 'scout')) +
    kpi('Last réunion', lastM ? (lastM.present + lastM.late) + '/' + lastM.done : '–', lastM ? fmtShort(lastM.date) + ' · ' + lastM.late + ' late' : 'No data yet') +
    kpi('Need attention', alerts.length, alerts.filter(r => r.streakAlert).length + ' missed ' + set.streakAlert + '+ in a row') +
    '</div>';

  html += '<div class="grid-2">';
  html += '<section class="card"><div class="card-head"><h2>Needs attention</h2></div><div class="card-body">' +
    (alerts.length ? '<div class="att-list">' + alerts.map(attItem).join('') + '</div>' :
      '<p class="muted">Nobody to worry about. Alerts appear when a scout misses ' + set.streakAlert + ' réunions in a row' +
      (all.tracking ? ', or attendance falls under ' + set.warnPct + '%.' : '. Percentage alerts start after ' + set.minMeetings + ' réunions (' + held.length + ' so far).') + '</p>') +
    '</div></section>';
  html += '<section class="card"><div class="card-head"><h2>Attendance per réunion</h2></div><div class="card-body">' + chartHtml(perMeeting, set) + '</div></section>';
  html += '</div>';

  html += '<section class="card"><div class="card-head"><h2>Scouts</h2>' +
    '<label class="sr" for="sortSel">Sort by</label><select class="input" id="sortSel" style="width:auto;margin:0;min-height:38px;padding:6px 10px;font-size:16px">' +
    [['pct', 'Lowest attendance'], ['streak', 'Missed in a row'], ['late', 'Most lates'], ['broken', 'Said yes, didn\'t come'], ['patrol', 'Patrol'], ['name', 'Name']]
      .map(o => '<option value="' + o[0] + '"' + (st.sort === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select></div>' +
    '<div class="card-body stable" style="padding:8px">' +
      '<div class="srow head"><span>Scout</span><span>Patrol</span><span>Attendance</span><span>Came</span><span>Missed in a row</span><span>Late</span><span>Said yes, no-show</span><span>Last 8</span></div>' +
      (sorted.length ? sorted.map(statRow).join('') : '<p class="empty">No scouts.</p>') +
    '</div></section>';

  // Report of one réunion / camp / event
  const dates = Array.from(new Set(S.data.attendance.map(a => a.date).filter(k => !isEventKey(k)).concat(S.data.meetings.map(m => m.date))))
    .sort().reverse().concat(S.data.events.map(e => e.id));
  if (!st.meeting || dates.indexOf(st.meeting) < 0) st.meeting = (held[held.length - 1]) || dates[0] || null;
  html += '<section class="card" id="meetingReport"></section>';

  v.innerHTML = html;
  $$('[data-spatrol]', v).forEach(b => { b.onclick = () => { st.patrol = b.dataset.spatrol; renderStats(v); }; });
  $('#sortSel', v).onchange = (e) => { st.sort = e.target.value; renderStats(v); };
  $$('[data-member]', v).forEach(b => { b.onclick = () => openMemberHistory(b.dataset.member); });
  $('#csvBtn', v).onclick = () => exportCsv(rows, held);
  wireChart(v, perMeeting);
  drawMeetingReport(dates);
}

function kpi(label, value, sub) {
  return '<div class="card kpi"><div class="k-label">' + esc(label) + '</div><div class="k-value">' + esc(value) + '</div><div class="k-sub">' + esc(sub) + '</div></div>';
}

function statRow(r) {
  const pctCls = r.pctLevel === 'low' ? 'pct-low' : r.pctLevel === 'warn' ? 'pct-warn' : '';
  const dots = r.hist.slice(-8).map(x => '<span class="hdot ' + x.sat + '" title="' + esc(fmtShort(x.date) + ': ' + (x.sat ? statusMeta('sat', x.sat).label : 'not marked')) + '"></span>').join('');
  const streak = r.streakAlert ? '<span class="glow-text">' + r.absStreak + ' missed</span>' : r.absStreak ? r.absStreak + ' missed' : (r.inStreak ? r.inStreak + ' came' : '–');
  return '<button class="srow ' + (r.streakAlert ? 'glow' : '') + '" data-member="' + esc(r.m.id) + '" style="--pc:' + patrolColor(r.m.patrol) + '">' +
    '<span class="s-name"><span class="pdot"></span><span>' + esc(r.m.name) + '</span></span>' +
    '<span class="s-col">' + esc(r.m.patrol) + '</span>' +
    '<span class="s-pct ' + pctCls + '">' + pctText(r.pct) + '</span>' +
    '<span class="s-col">' + r.attended + '/' + r.recorded + '</span>' +
    '<span class="s-col">' + streak + '</span>' +
    '<span class="s-col">' + r.late + '</span>' +
    '<span class="s-col">' + r.broken + (r.promised ? ' of ' + r.promised : '') + '</span>' +
    '<span class="s-dots">' + dots + '</span>' +
    '<span class="s-meta"><span>' + esc(r.m.patrol) + '</span><span>' + r.attended + '/' + r.recorded + ' came</span>' +
      (r.absStreak ? '<span class="' + (r.streakAlert ? 'glow-text' : '') + '">' + r.absStreak + ' missed in a row</span>' : '') +
      (r.late ? '<span>' + plural(r.late, 'late') + '</span>' : '') + '</span>' +
    '</button>';
}

function chartHtml(perMeeting, set) {
  const pts = perMeeting.filter(m => m.done);
  if (!pts.length) return '<p class="empty">No réunion has been recorded yet.</p>';
  const shown = pts.slice(-16);
  const every = shown.length > 10 ? 2 : 1;
  return '<div class="chart" id="chart">' +
    '<div class="chart-plot">' +
      [100, 50, 0].map(g => '<div class="chart-grid" style="bottom:' + g + '%"><span>' + g + '%</span></div>').join('') +
      '<div class="chart-grid ref" style="bottom:' + set.warnPct + '%"><span>' + set.warnPct + '% target</span></div>' +
      shown.map((m, i) => '<button class="bar-col" data-bar="' + i + '" aria-label="' + esc(fmtLong(m.date) + ': ' + (m.present + m.late) + ' of ' + m.done + ' came') + '">' +
        '<div class="bar" style="height:' + m.pct + '%"></div>' +
        (i === shown.length - 1 ? '<span class="bar-val" style="bottom:calc(' + m.pct + '% + 4px)">' + Math.round(m.pct) + '%</span>' : '') + '</button>').join('') +
    '</div>' +
    '<div class="chart-x">' + shown.map((m, i) => '<span>' + ((shown.length - 1 - i) % every === 0 ? esc(fmtShort(m.date)) : '') + '</span>').join('') + '</div>' +
    '<div class="tip hidden" id="chartTip"></div></div>';
}

function wireChart(v, perMeeting) {
  const chart = $('#chart', v);
  if (!chart) return;
  const shown = perMeeting.filter(m => m.done).slice(-16);
  const tip = $('#chartTip', chart);
  const show = (btn) => {
    const m = shown[Number(btn.dataset.bar)];
    $$('.bar-col', chart).forEach(b => b.classList.toggle('on', b === btn));
    tip.innerHTML = '<b>' + esc(fmtMed(m.date)) + '</b>' + (m.present + m.late) + ' of ' + m.done + ' came (' + Math.round(m.pct) + '%)<br>' + m.late + ' late · ' + m.absent + ' absent';
    const cr = chart.getBoundingClientRect();
    const br = btn.getBoundingClientRect();
    const x = Math.min(Math.max(br.left - cr.left + br.width / 2, 90), cr.width - 90);
    tip.style.left = x + 'px';
    tip.style.top = (br.top - cr.top + br.height * (1 - m.pct / 100) - 8) + 'px';
    tip.classList.remove('hidden');
  };
  const hide = () => { tip.classList.add('hidden'); $$('.bar-col', chart).forEach(b => b.classList.remove('on')); };
  $$('.bar-col', chart).forEach(b => {
    b.addEventListener('mouseenter', () => show(b));
    b.addEventListener('focus', () => show(b));
    b.addEventListener('click', () => show(b));
    b.addEventListener('blur', hide);
  });
  chart.addEventListener('mouseleave', hide);
}

function drawMeetingReport(dates) {
  const el = $('#meetingReport');
  const st = S.stats;
  if (!dates.length || !st.meeting) {
    el.innerHTML = '<div class="card-head"><h2>Report</h2></div><p class="empty">Nothing recorded yet.</p>';
    return;
  }
  const d = st.meeting;
  const patrols = st.patrol === 'all' ? S.data.patrols : [st.patrol];
  const members = activeMembers(patrols);
  const cancelled = isCancelled(d);
  const reportersFor = (p) => S.data.reporters.filter(r => r.role !== 'admin' && (!r.patrols.length || r.patrols.indexOf(p) >= 0)).map(r => r.name);
  const cell = (n, total, label) => '<span class="' + (n === total ? '' : 'pct-warn') + '">' + n + '/' + total + '</span>' + (label ? ' <span class="muted">' + label + '</span>' : '');

  let rowsHtml = '';
  patrols.forEach(p => {
    const ms = members.filter(m => m.patrol === p);
    if (!ms.length) return;
    const c = { coming: 0, late: 0, out: 0, noreply: 0, wed: 0, present: 0, slate: 0, absent: 0, sat: 0 };
    ms.forEach(m => {
      const r = rec(d, m.id) || {};
      if (r.wedStatus) { c.wed++; c[r.wedStatus]++; }
      if (r.satStatus) { c.sat++; if (r.satStatus === 'late') c.slate++; else c[r.satStatus]++; }
    });
    rowsHtml += '<tr><td><span class="pdot" style="--pc:' + patrolColor(p) + '"></span> <b>' + esc(p) + '</b><div class="muted small">' + esc(reportersFor(p).join(', ') || '—') + '</div></td>' +
      '<td class="num">' + cell(c.wed, ms.length, 'filled') + '<div class="small">' + c.coming + ' in · ' + c.late + ' late · ' + c.out + ' out · ' + c.noreply + ' no reply</div></td>' +
      '<td class="num">' + cell(c.sat, ms.length, 'filled') + '<div class="small">' + c.present + ' present · ' + c.slate + ' late · ' + c.absent + ' absent</div></td></tr>';
  });

  const listOf = (phase, status) => members.filter(m => (rec(d, m.id) || {})[phase + 'Status'] === status);
  const reasonList = (title, ms, phase) => ms.length ? '<div style="margin-top:14px"><h3>' + esc(title) + ' (' + ms.length + ')</h3><div class="reason-list">' +
    ms.map(m => '<div><span class="pdot" style="--pc:' + patrolColor(m.patrol) + '"></span><b>' + esc(m.name) + '</b><span class="muted">' + esc((rec(d, m.id) || {})[phase + 'Reason'] || 'no reason given') + '</span></div>').join('') + '</div></div>' : '';
  const noShows = members.filter(m => { const r = rec(d, m.id) || {}; return (r.wedStatus === 'coming' || r.wedStatus === 'late') && r.satStatus === 'absent'; });

  el.innerHTML =
    '<div class="card-head"><h2>Report</h2><select class="input" id="mtSel" style="width:auto;max-width:60%;margin:0;min-height:38px;padding:6px 10px;font-size:16px">' +
      dates.map(x => '<option value="' + esc(x) + '"' + (x === d ? ' selected' : '') + '>' + esc(keyLabel(x)) + (isCancelled(x) ? ' (no réunion)' : '') + '</option>').join('') + '</select></div>' +
    '<div class="card-body">' +
      (cancelled ? '<div class="banner bad">' + icon('calendar') + '<span class="grow">No réunion on this date.</span></div>' :
      '<div class="scroll-x"><table class="ttable"><thead><tr><th>Patrol · CP / SP</th><th>They said</th><th>They came</th></tr></thead><tbody>' + rowsHtml + '</tbody></table></div>' +
      reasonList('Absent', listOf('sat', 'absent'), 'sat') +
      reasonList('Came late', listOf('sat', 'late'), 'sat') +
      reasonList('Said they would come but did not', noShows, 'sat') +
      reasonList('Said not coming', listOf('wed', 'out'), 'wed') +
      reasonList('Did not reply', listOf('wed', 'noreply'), 'wed')) +
    '</div>';
  $('#mtSel', el).onchange = (e) => { st.meeting = e.target.value; drawMeetingReport(dates); };
}

function openMemberHistory(id) {
  const m = S.data.members.find(x => x.id === id);
  if (!m) return;
  const stat = computeStats().byId.get(id);
  const when = (k) => (isEventKey(k) ? ((findEvent(k) || {}).date || '0000') : k);
  const dates = S.data.attendance.filter(a => a.memberId === id).map(a => a.date)
    .filter(k => !isEventKey(k) || findEvent(k)).sort((a, b) => when(b).localeCompare(when(a)));
  const rows = dates.map(d => {
    const r = rec(d, id) || {};
    const w = r.wedStatus ? statusMeta('wed', r.wedStatus) : null;
    const s = r.satStatus ? statusMeta('sat', r.satStatus) : null;
    return '<tr><td class="num">' + esc(keyLabel(d)) + (isCancelled(d) ? '<div class="muted small">no réunion</div>' : '') + '</td>' +
      '<td>' + (w ? '<span class="pill ' + w.tone + '">' + esc(w.label) + '</span>' + (r.wedReason ? '<div class="small muted">' + esc(r.wedReason) + '</div>' : '') : '<span class="muted">–</span>') + '</td>' +
      '<td>' + (s ? '<span class="pill ' + s.tone + '">' + esc(s.label) + '</span>' + (r.satReason ? '<div class="small muted">' + esc(r.satReason) + '</div>' : '') : '<span class="muted">–</span>') + '</td></tr>';
  }).join('');
  openModal(
    '<div class="row" style="flex-wrap:nowrap;--pc:' + patrolColor(m.patrol) + '"><span class="avatar">' + esc(initials(m.name)) + '</span><div><h2>' + esc(m.name) + '</h2><p class="muted small">' + esc(m.patrol) + (m.birthYear ? ' · ' + esc(m.birthYear) : '') + '</p></div></div>' +
    (stat ? '<div class="sum-pills" style="margin-top:14px">' +
      '<span class="pill ' + (stat.pctLevel === 'low' ? 'bad' : stat.pctLevel === 'warn' ? 'warn' : 'accent') + '">' + pctText(stat.pct) + ' attendance</span>' +
      '<span class="pill">' + stat.attended + '/' + stat.recorded + ' came</span>' +
      (stat.absStreak ? '<span class="pill ' + (stat.streakAlert ? 'bad glow' : '') + '">' + stat.absStreak + ' missed in a row</span>' : '') +
      '<span class="pill warn">' + plural(stat.late, 'late') + '</span>' +
      (stat.broken ? '<span class="pill bad">Said yes, didn\'t come ×' + stat.broken + '</span>' : '') + '</div>' : '') +
    '<div class="scroll-x" style="margin-top:14px"><table class="ttable"><thead><tr><th>When</th><th>They said</th><th>They came</th></tr></thead><tbody>' +
      (rows || '<tr><td colspan="3" class="muted">Nothing recorded yet.</td></tr>') + '</tbody></table></div>' +
    '<div class="modal-actions"><button class="btn" data-close>Close</button></div>', { wide: true });
}

function exportCsv(rows, held) {
  const q = (s) => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
  const head = ['Scout', 'Patrol', 'Birth year', 'Attendance %', 'Came', 'Recorded', 'Missed in a row', 'Late', 'Said yes but absent'].concat(held);
  const lines = [head.map(q).join(',')].concat(rows.map(r => [
    r.m.name, r.m.patrol, r.m.birthYear, r.pct == null ? '' : Math.round(r.pct), r.attended, r.recorded, r.absStreak, r.late, r.broken,
  ].concat(r.hist.map(x => x.sat ? statusMeta('sat', x.sat).label + (x.satReason ? ' (' + x.satReason + ')' : '') : '')).map(q).join(',')));
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'attendance-' + todayIso() + '.csv';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

      (src.url ? '<p class="sub" style="margin:0 0 14px">Connected to <b>' + esc(src.fileName || 'the Drive file') + ' › ' + esc(src.sheetName) + '</b>. ' +
        'Edits to that file show in the app by themselves within 5 minutes (↻ checks now).' + (src.fileUpdated ? ' File last changed ' + esc(ago(src.fileUpdated)) + '.' : '') + '</p>' :
        '<p class="sub" style="margin:0 0 14px">Paste the link of your members file in Google Drive, then Preview and Import.</p>') +
      '<p class="muted small" style="margin:0 0 10px">Only change this to use a different file or tab.</p>' +
      '<label class="field">Google Drive link<input class="input" id="srcUrl" inputmode="url" placeholder="https://docs.google.com/spreadsheets/d/…" value="' + esc(src.url) + '"></label>' +
      '<label class="field">Tab<select class="input" id="srcSheet"><option value="">' + (src.sheetName ? esc(src.sheetName) : 'First visible tab') + '</option></select></label>' +
      '<div class="row" style="margin-top:14px"><button class="btn" id="srcPreview">Preview</button><button class="btn primary" id="srcImport">Import</button>' +
        (src.url ? '<button class="btn" id="srcCheck">' + icon('refresh', 'sm') + 'Check now</button>' : '') + '</div>' +
      '<div id="srcResult"></div>' +
      (src.lastImport ? '<p class="muted small" style="margin-top:12px">Last import ' + esc(ago(src.lastImport)) + ' by ' + esc(src.lastImportBy) + '</p>' : '') +
    '</div></details>';

  drawReporters();
  drawLeaders();
  let preview = null;
  const runSync = async (apply) => {
    const btns = [$('#srcPreview'), $('#srcImport')];
    btns.forEach(b => { b.disabled = true; });
    $('#srcResult').innerHTML = '<p class="muted" style="margin-top:12px"><span class="spinner" style="display:inline-block;width:16px;height:16px;border-width:2px;margin:0 8px -3px 0"></span>Reading the file from Drive…</p>';
    try {
      const res = await call('syncSource', { url: $('#srcUrl').value.trim(), sheetName: $('#srcSheet').value, apply: apply });
      preview = res;
      const sel = $('#srcSheet');
      sel.innerHTML = res.sheetNames.map(n => '<option' + (n === res.sheetName ? ' selected' : '') + '>' + esc(n) + '</option>').join('');
      drawSyncResult(res);
      if (apply) {
        toast('Members list imported');
        await refresh(true);
      }
    } catch (e) {
      $('#srcResult').innerHTML = '<div class="banner bad" style="margin-top:12px">' + icon('alert') + '<span class="grow">' + esc(e.message) + '</span></div>';
    } finally {
      btns.forEach(b => { if (document.body.contains(b)) b.disabled = false; });
    }
  };
  $('#srcPreview').onclick = () => runSync(false);
  if ($('#srcCheck')) $('#srcCheck').onclick = () => refresh();
  $('#srcImport').onclick = async () => {
    if (!preview && !await confirmBox('Import now?', 'The scouts list will be replaced by the one in the file. History is kept.', 'Import')) return;
    runSync(true);
  };
  $('#srcSheet').onchange = () => { preview = null; runSync(false); };
  $('#srcUrl').oninput = () => { preview = null; };
  $('#addRep').onclick = () => editReporter(null);
  $('#addEv').onclick = () => editEvent(null, () => go('admin', true));
  $('#testPush').onclick = async () => {
    try {
      const res = await call('testPush', {});
      toast(res.sent ? 'Sent – it should arrive in a few seconds' : 'Could not reach this phone. Turn reminders off and on again on Home.', res.sent ? '' : 'bad');
    } catch (e) { toast(e.message, 'bad'); }
  };
  $$('[data-evedit]', v).forEach(b => { b.onclick = () => editEvent(findEvent(b.dataset.evedit), () => go('admin', true)); });

  $('#setForm').onsubmit = async (e) => {
    e.preventDefault();
    const f = e.target;
    const payload = {};
    ['teamName', 'currency', 'seasonStart', 'streakAlert', 'minMeetings', 'warnPct', 'lowPct'].forEach(k => { payload[k] = f.elements[k].value; });
    try {
      const res = await call('saveSettings', payload);
      S.data.settings = res.settings;
      S.statsCache = null;
      toast('Rules saved');
      renderShell();
      go('admin', true);
    } catch (err) { toast(err.message, 'bad'); }
  };
}

function drawSyncResult(res) {
  const counts = {};
  res.members.forEach(m => { counts[m.patrol] = (counts[m.patrol] || 0) + 1; });
  const d = res.diff;
  const changes = d.added.length + d.removed.length + d.moved.length;
  const list = (title, items, tone) => items.length ? '<div><span class="pill ' + tone + '">' + esc(title) + ' ' + items.length + '</span><ul>' + items.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>' : '';
  $('#srcResult').innerHTML =
    '<div class="diff">' +
      '<div class="banner ' + (res.applied ? 'info' : changes ? 'warn' : 'info') + '">' + icon(res.applied ? 'check' : 'presence') + '<span class="grow">' +
        '<b>' + esc(res.fileName) + ' › ' + esc(res.sheetName) + '</b><br>' + res.members.length + ' scouts in ' + res.patrols.length + ' patrols, ' +
        d.leaders.filter(x => x.leader !== 'red').length + ' CP, ' + d.leaders.filter(x => x.leader === 'red').length + ' SP · ' +
        (res.applied ? 'imported.' : changes ? plural(changes, 'change') + ' to import.' : 'already up to date.') + '</span></div>' +
      '<div class="sum-pills">' + res.patrols.map(p => '<span class="pill"><span class="pdot" style="--pc:' + (S.patrolIdx.has(p) ? patrolColor(p) : 'var(--none)') + '"></span>' + esc(p) + ' <b>' + (counts[p] || 0) + '</b></span>').join('') + '</div>' +
      list('New', d.added, 'good') + list('Removed', d.removed, 'bad') + list('Changed patrol', d.moved, 'warn') +
    '</div>';
}

const nameKey = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

function drawLeaders() {
  const el = $('#leadersCard');
  if (!el) return;
  const leaders = activeMembers().filter(m => m.leader && m.leader !== 'red');   // CPs (green names)
  const hasAccount = new Set(S.data.reporters.map(r => nameKey(r.name)));
  const missing = leaders.filter(m => !hasAccount.has(nameKey(m.name)));
  el.innerHTML =
    '<div class="card-head"><h2>CP</h2><span class="pill accent">' + leaders.length + '</span></div><div class="card-body">' +
    '<p class="sub" style="margin:0 0 10px">Names written in <b>green</b> in the members file. Each CP fills the attendance and progression of his own patrol. SPs (red names) do not use the app.</p>' +
    (leaders.length ? leaders.map(m =>
      '<div class="rep" style="--pc:' + patrolColor(m.patrol) + '"><span class="avatar">' + esc(initials(m.name)) + '</span><div class="grow"><b>' + esc(m.name) + '</b><div class="tags">' +
        '<span class="pill"><span class="pdot"></span>' + esc(m.patrol) + '</span>' +
        (hasAccount.has(nameKey(m.name)) ? '<span class="pill accent">' + icon('check', 'sm') + 'Has an account</span>' : '<span class="pill warn">No account yet</span>') +
      '</div></div></div>').join('') :
      '<p class="muted">No CP found yet. Write their names in green in the members file.</p>') +
    (missing.length ? '<button class="btn primary block" id="mkLeaders" style="margin-top:12px">' + icon('plus', 'sm') + 'Create ' + plural(missing.length, 'account') + ' with PINs</button>' : '') +
    '</div>';
  const btn = $('#mkLeaders', el);
  if (btn) btn.onclick = async () => {
    btn.disabled = true;
    try {
      const res = await call('createLeaderAccounts', {});
      S.data.reporters = res.reporters;
      drawReporters();
      drawLeaders();
      showLeaderPins(res.created);
    } catch (e) {
      toast(e.message, 'bad');
      btn.disabled = false;
    }
  };
}

/** PINs are only shown this once (the server keeps them encrypted). */
function showLeaderPins(created) {
  if (!created.length) { toast('Every CP and SP already has an account'); return; }
  const appUrl = window.HP_APP_URL || location.href.split(/[?#]/)[0];
  const message = (x) => S.data.settings.teamName + ' – HP App\n' + appUrl + '\nName: ' + x.name + '\nPIN: ' + x.pin;
  openModal(
    '<h2>' + plural(created.length, 'account') + ' created</h2>' +
    '<div class="banner warn" style="margin-top:10px">' + icon('alert') + '<span class="grow">Send each CP / SP his PIN <b>now</b>. They are shown only once. You can set a new PIN later with Edit.</span></div>' +
    '<div class="scroll-x" style="margin-top:12px"><table class="ttable"><thead><tr><th>Name</th><th>Patrol</th><th>PIN</th><th></th></tr></thead><tbody>' +
      created.map((x, i) => '<tr><td><b>' + esc(x.name) + '</b></td><td>' + esc(x.patrol) + '</td><td class="num" style="font-size:17px;font-weight:700;letter-spacing:.08em">' + esc(x.pin) + '</td>' +
        '<td><button class="btn sm" data-share="' + i + '">Send</button></td></tr>').join('') +
    '</tbody></table></div>' +
    '<div class="modal-actions"><button class="btn" id="copyPins">Copy all</button><button class="btn primary" data-close>Done</button></div>', {
    wide: true,
    onMount: (m) => {
      const copy = async (text, okMsg) => {
        try { await navigator.clipboard.writeText(text); toast(okMsg); } catch (e) { window.prompt('Copy this:', text); }
      };
      $$('[data-share]', m).forEach(b => {
        b.onclick = async () => {
          const text = message(created[Number(b.dataset.share)]);
          if (navigator.share) { try { await navigator.share({ text: text }); return; } catch (e) { if (e.name === 'AbortError') return; } }
          copy(text, 'Copied – paste it in WhatsApp');
        };
      });
      $('#copyPins', m).onclick = () => copy(appUrl + '\n\n' + created.map(x => x.name + ' (' + x.patrol + '): ' + x.pin).join('\n'), 'All PINs copied');
    },
  });
}

function drawReporters() {
  const el = $('#repList');
  if (!el) return;
  const reps = S.data.reporters.slice().sort((a, b) => (a.role === b.role ? a.name.localeCompare(b.name) : a.role === 'admin' ? -1 : 1));
  el.innerHTML = reps.map(r =>
    '<div class="rep"><span class="avatar">' + esc(initials(r.name)) + '</span><div class="grow"><b>' + esc(r.name) + '</b><div class="tags">' +
      '<span class="pill ' + (roleKey(r) === 'sp' ? 'bad' : 'accent') + '">' + roleLabel(r) + (roleKey(r) === 'sp' ? ' · no access' : '') + '</span>' +
      (r.patrols.length ? r.patrols.map(p => '<span class="pill"><span class="pdot" style="--pc:' + patrolColor(p) + '"></span>' + esc(p) + '</span>').join('') : '<span class="pill">All patrols</span>') +
    '</div></div><button class="btn sm" data-rep="' + esc(r.id) + '">Edit</button></div>').join('') ||
    '<p class="empty">No reporters yet.</p>';
  $$('[data-rep]', el).forEach(b => { b.onclick = () => editReporter(S.data.reporters.find(r => r.id === b.dataset.rep)); });
}

function editReporter(r) {
  const isNew = !r;
  r = r || { name: '', role: 'cp', patrols: [] };
  const self = !isNew && r.id === S.data.me.id;
  openModal(
    '<h2>' + (isNew ? 'Add an account' : 'Edit ' + esc(r.name)) + '</h2>' +
    '<p class="sub">They sign in with their full name and PIN.</p>' +
    '<form id="repForm" style="margin-top:16px">' +
      '<label class="field">Name<input class="input" name="name" maxlength="60" required value="' + esc(r.name) + '"></label>' +
      '<label class="field">' + (isNew ? 'PIN (4 digits)' : 'New PIN (leave empty to keep the current one)') +
        '<input class="input" name="pin" type="text" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off"' + (isNew ? ' required' : '') + '></label>' +
      '<label class="field">Role<select class="input" name="role">' + [['cp', 'CP'], ['admin', 'Chief (sees everything)']].map(o => '<option value="' + o[0] + '"' + (roleKey(r) === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select></label>' +
      '<div class="field" style="margin-top:12px;font-size:13px;font-weight:600;color:var(--text-2)">In charge of (none ticked = all patrols)</div>' +
      '<div class="check-grid">' + S.data.patrols.map(p => '<label class="check"><input type="checkbox" name="patrols" value="' + esc(p) + '"' + (r.patrols.indexOf(p) >= 0 ? ' checked' : '') + '><span class="pdot" style="--pc:' + patrolColor(p) + '"></span>' + esc(p) + '</label>').join('') + '</div>' +
      '<p class="err" id="repErr"></p>' +
      '<div class="modal-actions">' + (!isNew && !self ? '<button type="button" class="btn danger" id="repDel">Delete</button><span class="spacer"></span>' : '') +
        '<button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn primary">Save</button></div>' +
    '</form>', {
    onMount: (m, close) => {
      const form = $('#repForm', m);
      form.onsubmit = async (e) => {
        e.preventDefault();
        try {
          const res = await call('saveReporter', {
            id: r.id, name: form.elements.name.value, pin: form.elements.pin.value, role: form.elements.role.value,
            patrols: $$('input[name="patrols"]:checked', form).map(x => x.value),
          });
          S.data.reporters = res.reporters;
          close();
          drawReporters();
          drawLeaders();
          toast(isNew ? 'Account added' : 'Saved');
          if (self) refresh(true);
        } catch (err) { $('#repErr', m).textContent = err.message; }
      };
      const del = $('#repDel', m);
      if (del) del.onclick = async () => {
        close();
        if (!await confirmBox('Delete ' + r.name + '?', 'They will not be able to sign in anymore. What they filled stays.', 'Delete', true)) return;
        try {
          const res = await call('deleteReporter', { id: r.id });
          S.data.reporters = res.reporters;
          drawReporters();
          drawLeaders();
          toast('Deleted');
        } catch (err) { toast(err.message, 'bad'); }
      };
    },
  });
}

// =================================================================== go
function boot() { start(); }
const notConnected = () => {
  app.innerHTML = authFrame('<h1>Not connected yet</h1><p class="sub">This app is not linked to its Google server yet. The chief must put the web app link in <b>config.js</b>.</p>');
};
if ((window.google && google.script && google.script.run) || window.HP_API_URL) {
  boot();
} else if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
  // Local preview only: load the mock backend that runs Code.gs in the browser.
  const s = document.createElement('script');
  s.src = '../dev/mock.js';
  s.onload = boot;
  s.onerror = notConnected;
  document.head.appendChild(s);
} else {
  notConnected();
}

// Installed app (PWA): cache the page so it opens instantly and offline.
if ('serviceWorker' in navigator && window.HP_PWA && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
</body>
</html>
