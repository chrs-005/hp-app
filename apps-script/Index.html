<style>
:root {
  color-scheme: light;
  --bg: #f4f4f1;
  --surface: #ffffff;
  --surface-2: #f0efec;
  --text: #0b0b0b;
  --text-2: #52514e;
  --muted: #7a7873;
  --border: rgba(11, 11, 11, .10);
  --hair: #e8e7e1;
  --accent: #1f6f4a;
  --accent-ink: #ffffff;
  --accent-soft: #e3f1ea;
  --accent-text: #17573a;
  --good: #0ca30c; --good-ink: #006300; --good-soft: #e6f5e6;
  --warn: #fab219; --warn-ink: #7a4f00; --warn-soft: #fff3d9;
  --bad: #d03b3b;  --bad-ink: #a82727; --bad-soft: #fbe8e8;
  --none: #898781; --none-ink: #52514e; --none-soft: #ecebe7;
  --p1: #2a78d6; --p2: #eb6834; --p3: #1baf7a; --p4: #eda100;
  --p5: #e87ba4; --p6: #008300; --p7: #4a3aa7; --p8: #e34948;
  --radius: 16px;
  --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 6px 20px rgba(0, 0, 0, .04);
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --tabbar-h: 60px;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #262624;
    --text: #ffffff;
    --text-2: #c3c2b7;
    --muted: #8f8d86;
    --border: rgba(255, 255, 255, .10);
    --hair: #2c2c2a;
    --accent: #3fae7a;
    --accent-ink: #06180f;
    --accent-soft: #15301f;
    --accent-text: #6fd3a2;
    --good-ink: #4cd14c; --good-soft: #142b14;
    --warn-ink: #fab219; --warn-soft: #2f2610;
    --bad-ink: #f07a7a;  --bad-soft: #361717;
    --none-ink: #c3c2b7; --none-soft: #2a2a28;
    --p1: #3987e5; --p2: #d95926; --p3: #199e70; --p4: #c98500;
    --p5: #d55181; --p6: #008300; --p7: #9085e9; --p8: #e66767;
    --shadow: none;
  }
}

* { box-sizing: border-box; }
/* Behave like an app, not a web page: no pinch / double-tap zoom, no rubber-band or
   pull-to-refresh, no sideways drift, no text selection or long-press menus on the UI. */
*, *::before, *::after { touch-action: pan-x pan-y; }
html, body { margin: 0; min-height: 100%; overflow-x: hidden; overscroll-behavior: none; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
input, textarea, select, [contenteditable] { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
img, svg { -webkit-user-drag: none; }
.grid-wrap, .chips, .scroll-x, .modal { overscroll-behavior: contain; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { margin: 0; line-height: 1.2; }
h1 { font-size: 24px; letter-spacing: -.01em; }
h2 { font-size: 17px; }
h3 { font-size: 15px; }
p { margin: 0; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.sm { width: 16px; height: 16px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- shell ---------- */
.shell { display: flex; min-height: 100vh; min-height: 100dvh; }
.sidebar { display: none; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 10px;
  padding: calc(var(--safe-t) + 10px) calc(16px + var(--safe-r)) 10px calc(16px + var(--safe-l));
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 85%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid var(--border);
}
.topbar .brand-mini { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 17px; }
.topbar h1 { font-size: 18px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.save-state { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.save-state.err { color: var(--bad-ink); }
.save-state .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.save-state.busy .dot { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.view { width: 100%; padding: 16px calc(16px + var(--safe-r)) calc(var(--tabbar-h) + var(--safe-b) + 24px) calc(16px + var(--safe-l)); }
.view > * + * { margin-top: 14px; }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex; background: var(--surface); border-top: 1px solid var(--border);
  padding: 0 var(--safe-r) var(--safe-b) var(--safe-l);
}
.tabbar button {
  flex: 1; min-height: var(--tabbar-h); border: 0; background: none; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: 11px; font-weight: 600;
}
.tabbar button .ic { width: 24px; height: 24px; }
.tabbar button[aria-current="page"] { color: var(--accent-text); }
@media (min-width: 900px) {
  .sidebar {
    display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh;
    width: 240px; flex: none; padding: 20px 14px; background: var(--surface); border-right: 1px solid var(--border);
  }
  .sidebar .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
  .sidebar .brand .logo { width: 38px; height: 38px; border-radius: 11px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 21px; }
  .sidebar .brand b { display: block; font-size: 15px; }
  .sidebar .brand span { font-size: 12px; color: var(--muted); }
  .sidebar nav button {
    width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 0; border-radius: 10px;
    background: none; color: var(--text-2); font-weight: 600; text-align: left;
  }
  .sidebar nav button:hover { background: var(--surface-2); }
  .sidebar nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent-text); }
  .sidebar .side-foot { margin-top: auto; padding: 12px; border-top: 1px solid var(--border); font-size: 13px; }
  .sidebar .side-foot b { display: block; }
  .tabbar { display: none; }
  .topbar .brand-mini { display: none; }
  .topbar { padding-left: 32px; padding-right: 32px; }
  .view { padding: 24px 32px 48px; }
}

/* ---------- building blocks ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.card.pad { padding: 16px; }
.card-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--hair); }
.card-head h2 { flex: 1; }
.card-body { padding: 16px; }
.sub { color: var(--text-2); font-size: 14px; margin-top: 4px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px;
  border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-weight: 600;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--bad-ink); }
.btn.ghost { border-color: transparent; background: none; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; filter: none; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 0; background: none; color: var(--text-2); display: grid; place-items: center; flex: none; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn:disabled { opacity: .35; }
label.field { display: block; font-size: 13px; font-weight: 600; color: var(--text-2); }
label.field + label.field { margin-top: 12px; }
.input, select.input {
  display: block; width: 100%; margin-top: 6px; min-height: 46px; padding: 10px 12px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--surface-2); font-size: 16px; /* 16px stops iOS zoom */
}
.input:focus { outline: 2px solid var(--accent); outline-offset: 1px; background: var(--surface); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grid-2 { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); align-items: start; }
.grid-2 > *, .pgrid > *, .kpis > * { min-width: 0; }
@media (min-width: 720px) { .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.pill {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
  background: var(--none-soft); color: var(--none-ink); white-space: nowrap;
}
.pill b { font-variant-numeric: tabular-nums; }
.pill.good { background: var(--good-soft); color: var(--good-ink); }
.pill.warn { background: var(--warn-soft); color: var(--warn-ink); }
.pill.bad { background: var(--bad-soft); color: var(--bad-ink); }
.pill.accent { background: var(--accent-soft); color: var(--accent-text); }
.pdot { width: 10px; height: 10px; border-radius: 50%; background: var(--pc, var(--none)); flex: none; display: inline-block; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; min-height: 38px; padding: 0 14px; border-radius: 999px; flex: none;
  border: 1px solid var(--border); background: var(--surface); color: var(--text-2); font-weight: 600; font-size: 14px;
}
.chip[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--bg); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.banner { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 12px; font-size: 14px; font-weight: 500; }
.banner.info { background: var(--accent-soft); color: var(--accent-text); }
.banner.warn { background: var(--warn-soft); color: var(--warn-ink); }
.banner.bad { background: var(--bad-soft); color: var(--bad-ink); }
.banner .grow { flex: 1 1 200px; min-width: 0; }

/* red glow for "missed N in a row" */
@keyframes glow {
  0%, 100% { box-shadow: 0 0 0 1.5px var(--bad), 0 0 0 0 rgba(208, 59, 59, 0); }
  50% { box-shadow: 0 0 0 1.5px var(--bad), 0 0 16px 3px rgba(208, 59, 59, .45); }
}
.glow { animation: glow 1.8s ease-in-out infinite; }
.glow-text { color: var(--bad-ink); font-weight: 700; }
@media (prefers-reduced-motion: reduce) { .glow { animation: none; box-shadow: 0 0 0 2px var(--bad); } }

/* ---------- segmented controls ---------- */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 14px; background: var(--surface-2); }
.seg button {
  min-height: 42px; border: 0; border-radius: 10px; background: none; color: var(--text-2);
  display: flex; align-items: center; justify-content: center; gap: 5px; font-weight: 600; font-size: 13.5px; padding: 0 4px;
}
.seg button:disabled { cursor: default; opacity: .5; }
.seg-phase button { flex-direction: column; gap: 0; min-height: 52px; font-size: 15px; }
.seg-phase button small { font-size: 12px; font-weight: 500; color: var(--muted); }
.seg-phase button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.seg-status button[aria-pressed="true"].good { background: var(--good-soft); color: var(--good-ink); box-shadow: inset 0 0 0 1.5px var(--good); }
.seg-status button[aria-pressed="true"].bad  { background: var(--bad-soft);  color: var(--bad-ink);  box-shadow: inset 0 0 0 1.5px var(--bad); }
.seg-status button[aria-pressed="true"].warn { background: var(--warn-soft); color: var(--warn-ink); box-shadow: inset 0 0 0 1.5px var(--warn); }
.seg-status button[aria-pressed="true"].none { background: var(--surface); color: var(--text); box-shadow: inset 0 0 0 1.5px var(--none); }
@media (max-width: 359px) { .seg-status .ic { display: none; } }

/* ---------- presence ---------- */
.pres-top { display: grid; gap: 10px; }
@media (min-width: 900px) { .pres-top { grid-template-columns: minmax(320px, 1fr) minmax(320px, 1fr); align-items: stretch; } }
.seg-mode { max-width: 420px; }
.seg-mode button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.event-card { padding: 10px; min-width: 0; }
.event-card .chip { min-height: 34px; padding: 0 12px; font-size: 13px; }
.ev-now { display: flex; align-items: center; gap: 10px; padding: 8px 6px 2px; }
.ev-now > div { flex: 1; min-width: 0; }
.ev-now .dl-rel, .date-label .dl-rel { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--accent-text); }
.ev-now .dl-main { font-size: 17px; font-weight: 700; }
.pres-top > * { min-width: 0; }
.date-card { display: flex; align-items: center; gap: 4px; padding: 6px; }
.date-label { flex: 1; text-align: center; min-width: 0; }
.date-label .dl-rel { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--accent-text); }
.date-label .dl-main { font-size: 17px; font-weight: 700; }
.summary { padding: 14px 16px; }
.sum-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sum-top .count { flex: 1; font-size: 15px; }
.sum-top .count b { font-size: 22px; font-variant-numeric: tabular-nums; }
.progress { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin: 10px 0; display: flex; gap: 2px; }
.progress span { display: block; height: 100%; }
.progress .good { background: var(--good); } .progress .warn { background: var(--warn); }
.progress .bad { background: var(--bad); } .progress .none { background: var(--none); }
.sum-pills { display: flex; flex-wrap: wrap; gap: 6px; }
.sum-note { margin-top: 10px; font-size: 13px; color: var(--text-2); }
.pgrid { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 900px) { .pgrid { grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); } }
.pcard { overflow: hidden; }
.pc-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--hair); background: color-mix(in srgb, var(--pc) 8%, var(--surface)); }
.pc-head h3 { flex: 1; font-size: 16px; }
.pc-head .pc-count { font-size: 13px; font-weight: 700; color: var(--text-2); font-variant-numeric: tabular-nums; }
.mrow { padding: 12px 16px; }
.mrow + .mrow { border-top: 1px solid var(--hair); }
.mtop { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
.avatar {
  width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 12.5px; font-weight: 700;
  background: color-mix(in srgb, var(--pc, var(--none)) 18%, var(--surface)); color: var(--text); box-shadow: inset 0 0 0 1.5px var(--pc, var(--none));
}
.mname { flex: 1; min-width: 0; }
.mname .nm { font-weight: 650; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mname .meta { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.mrow .reason { margin-top: 8px; min-height: 42px; }
.mrow .by { margin-top: 6px; font-size: 12px; color: var(--muted); }
.mrow.locked .seg { opacity: .5; }
.alert-pill { background: var(--bad-soft); color: var(--bad-ink); }
.alert-pill.glow { box-shadow: 0 0 0 1.5px var(--bad); }

/* ---------- home ---------- */
.hello h1 { font-size: 26px; }
.step { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
.step + .step { border-top: 1px solid var(--hair); }
.step .st-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); flex: none; }
.step .st-ic.done { background: var(--good-soft); color: var(--good-ink); }
.step .st-txt { flex: 1; min-width: 0; }
.step .st-txt b { display: block; }
.step .st-txt span { font-size: 13px; color: var(--muted); }

/* ---------- stats ---------- */
.kpis { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 900px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.kpi { padding: 14px 16px; }
.kpi .k-label { font-size: 13px; color: var(--text-2); font-weight: 600; }
.kpi .k-value { font-size: 30px; font-weight: 700; letter-spacing: -.02em; margin-top: 2px; }
.kpi .k-sub { font-size: 12.5px; color: var(--muted); }
.att-list { display: grid; gap: 8px; }
.att-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); border: 0; width: 100%; text-align: left; }
.att-item .grow { flex: 1; min-width: 0; }
.att-item .grow b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.att-item .grow span { display: block; font-size: 12.5px; color: var(--text-2); }
.att-item .grow .why { display: flex; align-items: center; gap: 4px; color: var(--bad-ink); font-weight: 600; }
.att-item .grow .why.warn { color: var(--warn-ink); }
.att-item.glow { background: var(--bad-soft); }
.chart { position: relative; padding: 8px 0 0; }
.chart-plot { position: relative; height: 180px; margin-left: 38px; border-bottom: 1px solid var(--muted); display: flex; align-items: flex-end; gap: 6px; }
.chart-grid { position: absolute; left: 0; right: 0; border-top: 1px solid var(--hair); pointer-events: none; }
.chart-grid.ref { border-top: 1.5px dashed var(--warn); }
.chart-grid span { position: absolute; left: -38px; top: -8px; width: 32px; text-align: right; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chart-grid.ref span { left: auto; right: 0; width: auto; top: -18px; color: var(--warn-ink); font-weight: 600; }
.bar-col { flex: 1; min-width: 6px; max-width: 44px; height: 100%; display: flex; align-items: flex-end; position: relative; border: 0; background: none; padding: 0; }
.bar-col .bar { width: 100%; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; }
.bar-col:hover .bar, .bar-col:focus-visible .bar, .bar-col.on .bar { filter: brightness(1.15); }
.bar-col .bar-val { position: absolute; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 700; color: var(--text); white-space: nowrap; }
.chart-x { display: flex; gap: 6px; margin-left: 38px; padding-top: 6px; }
.chart-x span { flex: 1; min-width: 6px; max-width: 44px; text-align: center; font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: visible; }
.tip {
  position: absolute; z-index: 5; pointer-events: none; min-width: 170px; padding: 10px 12px; border-radius: 10px;
  background: var(--text); color: var(--bg); font-size: 12.5px; box-shadow: 0 6px 20px rgba(0, 0, 0, .2); transform: translate(-50%, -100%);
}
.tip b { display: block; font-size: 13px; margin-bottom: 2px; }
.stable { width: 100%; }
.srow {
  display: grid; align-items: center; gap: 4px 10px; padding: 10px 12px; border-radius: 12px; width: 100%; border: 0; background: none; text-align: left;
  grid-template-columns: 1fr auto; grid-template-areas: "name pct" "meta dots";
}
.srow + .srow { margin-top: 4px; }
.srow:hover { background: var(--surface-2); }
.srow .s-name { grid-area: name; min-width: 0; display: flex; align-items: center; gap: 8px; font-weight: 650; }
.srow .s-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow .s-pct { grid-area: pct; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }

    { k: 'late', label: 'Came late', short: 'Late', icon: 'clock', tone: 'warn', reason: true },
  ],
};
const statusMeta = (phase, k) => PHASES[phase].find(o => o.k === k);

// =================================================================== api
function call(action, payload) {
  const req = { action: action, payload: payload || {}, token: S.token };
  const done = (res) => {
    if (res && res.ok) return res.data;
    const err = new Error((res && res.error) || 'Unknown error');
    err.server = true;
    throw err;
  };
  if (window.google && google.script && google.script.run) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler((res) => { try { resolve(done(res)); } catch (e) { reject(e); } })
        .withFailureHandler((e) => reject(new Error((e && e.message) || 'Network error')))
        .api(req);
    });
  }
  if (window.HP_API_URL) {
    return fetch(window.HP_API_URL, { method: 'POST', body: JSON.stringify(req), headers: { 'Content-Type': 'text/plain;charset=utf-8' } })
      .then(r => r.json()).then(done);
  }
  return window.HPMock.api(req).then(done);
}

};

function indexData() {
  const D = S.data;
  D.events = D.events || [];   // older server version without camps / events
  D.money = D.money || { catalog: [], orders: [], lines: [] };
  D.prog = D.prog || { groups: [], items: [], done: [] };
  S.progDone = new Map(D.prog.done.map(d => [d.memberId + '|' + d.key, d]));
  applyPendingProg();
  applyPendingTicks();   // taps not saved yet stay visible after a reload of the data
  S.att = new Map();
  D.attendance.forEach(a => S.att.set(a.date + '|' + a.memberId, a));
  S.patrolIdx = new Map(D.patrols.map((p, i) => [p, i]));
  S.meetingByDate = new Map(D.meetings.map(m => [m.date, m]));
  S.statsCache = null;
}
const isAdmin = () => S.data.me.role === 'admin';
/** 'admin', 'cp' or 'sp'. Older accounts ("reporter") take CP / SP from their name's color in the members file. */
function roleKey(r) {
  if (r.role === 'admin' || r.role === 'cp' || r.role === 'sp') return r.role;
  const m = S.data.members.find(x => nameKey(x.name) === nameKey(r.name));
  return m && m.leader === 'red' ? 'sp' : 'cp';
}
const roleLabel = (r) => ({ admin: 'Chief', cp: 'CP', sp: 'SP' }[roleKey(r)]);
const patrolColor = (p) => 'var(--p' + (((S.patrolIdx.get(p) || 0) % 8) + 1) + ')';
const patrolRank = (p) => (S.patrolIdx.has(p) ? S.patrolIdx.get(p) : 99);
function myPatrols() {
  const me = S.data.me;
  if (me.role === 'admin' || !me.patrols.length) return S.data.patrols.slice();
  return S.data.patrols.filter(p => me.patrols.indexOf(p) >= 0);
}
function activeMembers(patrols) {
  return S.data.members
    .filter(m => m.active && (!patrols || patrols.indexOf(m.patrol) >= 0))
    .sort((a, b) => (patrolRank(a.patrol) - patrolRank(b.patrol)) || (a.order - b.order));
}
const rec = (date, id) => S.att.get(date + '|' + id);
const isCancelled = (date) => !!(S.meetingByDate.get(date) || {}).cancelled;

// =================================================================== statistics
/** Everything the Stats tab and the alerts need, from raw attendance. */
function computeStats() {
  if (S.statsCache) return S.statsCache;
  const set = S.data.settings;
  const today = todayIso();
  const heldSet = new Set();
  S.data.attendance.forEach(a => {
    if (a.satStatus && !isEventKey(a.date) && a.date >= set.seasonStart && a.date <= today && !isCancelled(a.date)) heldSet.add(a.date);
  });
  const held = Array.from(heldSet).sort();
  const tracking = held.length >= set.minMeetings;
  const byId = new Map();
  const rows = activeMembers().map(m => {
    const hist = held.map(d => { const r = rec(d, m.id) || {}; return { date: d, wed: r.wedStatus || '', sat: r.satStatus || '', satReason: r.satReason || '' }; });
    const done = hist.filter(x => x.sat);
    const attended = done.filter(x => x.sat !== 'absent').length;
    let absStreak = 0;
    for (let i = done.length - 1; i >= 0 && done[i].sat === 'absent'; i--) absStreak++;
    let inStreak = 0;
    for (let i = done.length - 1; i >= 0 && done[i].sat !== 'absent'; i--) inStreak++;
    const promised = done.filter(x => x.wed === 'coming' || x.wed === 'late');
    const pct = done.length ? (attended / done.length) * 100 : null;
    const pctLevel = !tracking || pct == null ? '' : pct < set.lowPct ? 'low' : pct < set.warnPct ? 'warn' : '';
    const row = {
      m: m, hist: hist, recorded: done.length, attended: attended,
      late: done.filter(x => x.sat === 'late').length, absent: done.length - attended,
      absStreak: absStreak, inStreak: inStreak, pct: pct, pctLevel: pctLevel,
      streakAlert: absStreak >= set.streakAlert,
      promised: promised.length, broken: promised.filter(x => x.sat === 'absent').length,
      noreply: hist.filter(x => x.wed === 'noreply').length,
    };
    byId.set(m.id, row);
    return row;
  });
  S.statsCache = { held: held, tracking: tracking, rows: rows, byId: byId };
  return S.statsCache;
}
const needsAttention = (r) => r.streakAlert || r.pctLevel === 'low' || r.pctLevel === 'warn';
function alertText(r) {
  const parts = [];
  if (r.streakAlert) parts.push('Missed ' + r.absStreak + ' in a row');
  if (r.pctLevel) parts.push(pctText(r.pct) + ' attendance');
  return parts.join(' · ');
}

// =================================================================== saving
let flushTimer = null;
function setAnswer(date, memberId, phase, status, reason) {
  const key = date + '|' + memberId;
  let r = S.att.get(key);
  if (!r) {
    r = { date: date, memberId: memberId, wedStatus: '', wedReason: '', wedBy: '', wedAt: '', satStatus: '', satReason: '', satBy: '', satAt: '' };
    S.att.set(key, r);
    S.data.attendance.push(r);
  }
  const meta = statusMeta(phase, status);
  r[phase + 'Status'] = status;
  r[phase + 'Reason'] = meta && meta.reason ? reason : '';
  r[phase + 'By'] = status ? S.data.me.name : '';
  r[phase + 'At'] = status ? new Date().toISOString() : '';
  S.statsCache = null;
  S.pending.set(key + '|' + phase, { date: date, memberId: memberId, phase: phase, status: status, reason: r[phase + 'Reason'] });
  scheduleFlush(700);
}
function scheduleFlush(delay) {
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flush, delay);
  showSaveState();
}
async function flush() {
  if (S.inflight || !S.pending.size) return;
  S.inflight = true;
  const batch = Array.from(S.pending.values());
  S.pending.clear();
  showSaveState();
  let retry = false;
  try {
    const res = await call('saveAttendance', { entries: batch });
    res.rows.forEach(row => {
      const key = row.date + '|' + row.memberId;
      const local = S.att.get(key);
      if (!local) return;
      ['wed', 'sat'].forEach(ph => {
        if (S.pending.has(key + '|' + ph)) return;   // newer local edit waiting
        ['Status', 'Reason', 'By', 'At'].forEach(f => { local[ph + f] = row[ph + f]; });
      });
    });
    S.saveError = null;
  } catch (e) {
    if (e.message === 'AUTH') { logout(); return; }
    if (e.server) {
      // Refused by the server (e.g. no meeting that day): drop it and resync.
      toast(e.message, 'bad');
      S.saveError = null;
      refresh();
    } else {
      batch.forEach(b => {
        const k = b.date + '|' + b.memberId + '|' + b.phase;
        if (!S.pending.has(k)) S.pending.set(k, b);
      });
      S.saveError = e.message;
      retry = true;
    }
  } finally {
    S.inflight = false;
    showSaveState();
    if (S.pending.size) scheduleFlush(retry ? 5000 : 300);
  }
}
let savedTimer;
function showSaveState() {
  const el = $('#saveState');
  if (!el) return;
  clearTimeout(savedTimer);
  const waiting = S.pending.size + moneyPending.size + progBatch.pending.size;
  if ((S.saveError && S.pending.size) || (moneyError && moneyPending.size) || (progBatch.error && progBatch.pending.size)) {
    el.className = 'save-state err busy';
    el.innerHTML = '<span class="dot"></span>Not saved – retrying';
  } else if (waiting || S.inflight || moneyInflight || progBatch.busy) {
    el.className = 'save-state busy';
    el.innerHTML = '<span class="dot"></span>Saving…';
  } else {
    el.className = 'save-state';
    el.innerHTML = icon('check', 'sm') + 'Saved';
    savedTimer = setTimeout(() => { el.innerHTML = ''; }, 2500);
  }
}
window.addEventListener('beforeunload', (e) => {
  if (S.pending.size || S.inflight || moneyPending.size || moneyInflight || progBatch.pending.size || progBatch.busy) { e.preventDefault(); e.returnValue = ''; }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { flush(); flushMoney(); progBatch.flush(); return; }
  if (S.data && !S.pending.size && !S.inflight && !moneyPending.size && !moneyInflight && !progBatch.pending.size && !progBatch.busy &&
    Date.now() - S.loadedAt > 60000) refresh(true);
});

// =================================================================== modal
function openModal(html, opts) {
  opts = opts || {};
  const wrap = document.createElement('div');
  wrap.className = 'modal-wrap';
  wrap.innerHTML = '<div class="modal ' + (opts.wide ? 'wide' : '') + '" role="dialog" aria-modal="true">' + html + '</div>';
  document.body.appendChild(wrap);
  requestAnimationFrame(() => wrap.classList.add('open'));
  let closed = false;
  const close = () => {
    if (closed) return;
    closed = true;
    wrap.classList.remove('open');
    setTimeout(() => wrap.remove(), 200);
    document.removeEventListener('keydown', onKey);
    if (opts.onClose) opts.onClose();
  };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  wrap.addEventListener('click', (e) => { if (e.target === wrap || e.target.closest('[data-close]')) close(); });
  if (opts.onMount) opts.onMount(wrap.firstChild, close);
  return close;
}
function confirmBox(title, text, okLabel, danger) {
  return new Promise((resolve) => {
    let answered = false;
    openModal('<h2>' + esc(title) + '</h2><p class="sub">' + text + '</p><div class="modal-actions"><button class="btn" data-close>Cancel</button><button class="btn ' + (danger ? 'danger' : 'primary') + '" data-ok>' + esc(okLabel) + '</button></div>', {
      onMount: (m, close) => { $('[data-ok]', m).onclick = () => { answered = true; close(); resolve(true); }; },
      onClose: () => { if (!answered) resolve(false); },
    });
  });
}

function announceMembersSync() {
  const s = S.data && S.data.membersSync;

// =================================================================== reminders (push notifications)
const pushSupported = () => !!(window.HP_PWA && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && S.boot && S.boot.vapidKey);
const isIos = () => /iPhone|iPad|iPod/.test(navigator.userAgent);
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

function b64ToBytes(b64url) {
  const b64 = b64url.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((b64url.length + 3) % 4);
  return Uint8Array.from(atob(b64), c => c.charCodeAt(0));
}

async function currentPushSub() {
  if (!pushSupported()) return null;
  const reg = await navigator.serviceWorker.ready;
  return reg.pushManager.getSubscription();
}

/** Home card: turn reminders on / off on this phone. */
async function drawReminders() {
  const el = $('#remCard');
  if (!el) return;
  const head = '<div class="card-head"><h2>Reminders</h2></div><div class="card-body">';
  const when = 'Wednesday and Saturday at 5 pm, plus Thursday and Sunday if your scouts are still not filled.';
  let html = '';
  if (!pushSupported()) {
    if (isIos() && !isStandalone() && window.HP_PWA) {
      html = head + '<p class="sub" style="margin:0">To get reminders on iPhone: tap Share ⬆️ → <b>Add to Home Screen</b>, then open the app from its icon.</p></div>';
    }
  } else if (Notification.permission === 'denied') {
    html = head + '<p class="sub" style="margin:0">Notifications are blocked for this app. Allow them in your phone settings to get reminders.</p></div>';
  } else {
    let sub = null;
    try { sub = await currentPushSub(); } catch (e) { sub = null; }
    if (sub && Notification.permission === 'granted') {
      call('savePush', sub.toJSON()).catch(() => {});   // keep it linked to whoever is signed in
      html = head + '<p class="sub" style="margin:0 0 12px">' + icon('check', 'sm') + ' On for this phone: ' + when + '</p>' +
        '<button class="btn sm" id="remOff">Turn off</button></div>';
    } else {
      html = head + '<p class="sub" style="margin:0 0 12px">Get a notification ' + when + '</p>' +
        '<button class="btn primary" id="remOn">' + icon('clock', 'sm') + 'Turn on reminders</button></div>';
    }
  }
  if (!document.body.contains(el)) return;
  el.innerHTML = html;
  el.classList.toggle('hidden', !html);
  if ($('#remOn', el)) $('#remOn', el).onclick = enableReminders;
  if ($('#remOff', el)) $('#remOff', el).onclick = disableReminders;
}

async function enableReminders() {
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { drawReminders(); return; }
    const reg = await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) ||
      await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(S.boot.vapidKey) });
    await call('savePush', sub.toJSON());
    toast('Reminders are on');
  } catch (e) {
    toast('Could not turn on reminders: ' + e.message, 'bad');
  }
  drawReminders();
}

async function disableReminders() {
  try {
    const sub = await currentPushSub();
    if (sub) {
      await call('removePush', { endpoint: sub.endpoint }).catch(() => {});
      await sub.unsubscribe();
    }
    toast('Reminders are off');
  } catch (e) { toast(e.message, 'bad'); }
  drawReminders();
}

async function logout() {
  // This phone stops getting the reminders of the person who signs out.
  try {
    const sub = await currentPushSub();
    if (sub) {
      await call('removePush', { endpoint: sub.endpoint }).catch(() => {});
      await sub.unsubscribe();
    }
  } catch (e) { /* not supported here */ }
  // The next person on this phone starts fresh (no screen choices left from the previous one).
  S.presence = { date: null, phase: null, patrol: 'all' };
  S.presenceSub = null;
  S.progView = null;
  S.moneyView = null;
  S.overview = null;
  S.stats = { patrol: 'all', sort: 'pct', meeting: null };
  S.tab = 'home';
  store.set('hp.tab', null);
  S.token = null;
  S.data = null;
  store.set('hp.token', null);
  S.pending.clear();
  call('bootstrap').then(b => { S.boot = b; renderLogin(); }).catch(() => renderLogin());
}

function go(tabId, keepScroll) {
  if (gridTipHide) gridTipHide();
  if (tabId === 'overview' || tabId === 'stats') { S.presenceSub = tabId; tabId = 'presence'; }   // now inside Presence
  const tabs = visibleTabs();
  const tab = tabs.find(t => t.id === tabId) || tabs[0];
  S.tab = tab.id;
  store.set('hp.tab', tab.id);
  $$('[data-tab]').forEach(b => { if (b.dataset.tab === tab.id) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  $('#tbTitle').textContent = tab.id === 'home' ? S.data.settings.teamName : tab.label;
  const y = window.scrollY;
  const view = $('#view');
  view.onclick = null;
  view.innerHTML = '';
  tab.render(view);
  window.scrollTo(0, keepScroll ? y : 0);
}

// =================================================================== HOME
function renderHome(v) {
  const me = S.data.me;
  const patrols = myPatrols();
  const members = activeMembers(patrols);
  const next = nearestSaturday(todayIso());
  const last = addDays(next, -7);
  const filled = (date, phase) => members.filter(m => (rec(date, m.id) || {})[phase + 'Status']).length;
  const step = (date, phase, title) => {
    const n = filled(date, phase);
    const done = n === members.length && members.length > 0;
    return '<div class="step"><div class="st-ic ' + (done ? 'done' : '') + '">' + icon(done ? 'check' : phase === 'wed' ? 'calendar' : 'presence') + '</div>' +
      '<div class="st-txt"><b>' + title + '</b><span>' + n + ' of ' + members.length + ' scouts filled</span></div>' +
      '<button class="btn sm ' + (done ? '' : 'primary') + '" data-go="' + date + '|' + phase + '">' + (done ? 'Review' : 'Fill in') + '</button></div>';
  };
  const lastMissing = members.length - filled(last, 'sat');

  let html =
    '<div class="hello"><h1>Hi ' + esc(firstName(me.name)) + '</h1><p class="sub">' +
      (me.role === 'admin' ? 'Chief · all patrols' : roleLabel(me) + ' · ' + (me.patrols.length ? esc(patrols.join(', ')) : 'all patrols')) + '</p></div>';

  if (!S.data.members.length) {
    html += '<div class="banner warn">' + icon('alert') + '<span class="grow">No scouts loaded yet.' + (isAdmin() ? ' Go to Admin and import the members list from Drive.' : ' Ask the chief to import the members list.') + '</span>' +
      (isAdmin() ? '<button class="btn sm" data-tab-go="admin">Admin</button>' : '') + '</div>';
  }

  html += '<div class="grid-2">';
  html += '<section class="card"><div class="card-head"><h2>' + esc(fmtLong(next)) + '</h2><span class="pill accent">' + relLabel(next) + '</span></div><div class="card-body" style="padding-top:4px;padding-bottom:4px">' +
    (isCancelled(next)
      ? '<div class="banner bad" style="margin:12px 0">' + icon('calendar') + '<span class="grow"><b>No réunion this Saturday</b>' +
          ((S.meetingByDate.get(next) || {}).note ? ' — ' + esc(S.meetingByDate.get(next).note) : '') + '</span>' +
          (isAdmin() ? '<button class="btn sm" data-reunion-on="' + next + '">Undo</button>' : '') + '</div>'
      : step(next, 'wed', 'They said · by Wednesday') + step(next, 'sat', 'They came · on Saturday') +
        (isAdmin() ? '<div class="step"><button class="btn ghost sm" style="padding-left:0" data-reunion-off="' + next + '">' + icon('calendar', 'sm') + 'No réunion this Saturday?</button></div>' : '')) +
    '</div></section>';

  if (lastMissing > 0 && !isCancelled(last) && last >= S.data.settings.seasonStart) {
    html += '<section class="card"><div class="card-head"><h2>' + esc(fmtLong(last)) + '</h2><span class="pill warn">' + plural(lastMissing, 'scout') + ' not marked</span></div><div class="card-body" style="padding-top:4px;padding-bottom:4px">' +
      step(last, 'sat', 'They came · on Saturday') + '</div></section>';
  }

  const stats = computeStats();
  const alerts = stats.rows.filter(r => patrols.indexOf(r.m.patrol) >= 0 && needsAttention(r))
    .sort((a, b) => (b.absStreak - a.absStreak) || ((a.pct || 0) - (b.pct || 0)));
  html += '<section class="card"><div class="card-head"><h2>Needs attention</h2>' + (alerts.length ? '<span class="pill bad">' + alerts.length + '</span>' : '') + '</div><div class="card-body">' +
    (alerts.length ? '<div class="att-list">' + alerts.slice(0, 6).map(attItem).join('') + '</div>' +
      (alerts.length > 6 && isAdmin() ? '<button class="btn block" style="margin-top:12px" data-tab-go="stats">See all ' + alerts.length + '</button>' : '')
      : '<p class="muted">Nobody missed ' + S.data.settings.streakAlert + ' réunions in a row' + (stats.tracking ? ' or has low attendance.' : '. Percentages start after ' + S.data.settings.minMeetings + ' réunions (' + stats.held.length + ' so far).') + '</p>') +
    '</div></section>';
  html += '<section class="card hidden" id="remCard"></section>';
  html += '</div>';

  html += '<div class="row" style="justify-content:space-between"><span class="muted small">Signed in as ' + esc(me.name) + '</span><span class="row"><button class="btn sm" data-act="pin">Change my PIN</button><button class="btn sm" data-act="logout2">' + icon('logout', 'sm') + 'Sign out</button></span></div>';
  v.innerHTML = html;

  $$('[data-go]', v).forEach(b => {
    b.onclick = () => {
      const parts = b.dataset.go.split('|');
      S.presence.mode = 'reunion';
      S.presence.day = todayIso();
      S.presence.date = parts[0];
      S.presence.phase = parts[1];
      go('presence');
    };
  });
  $$('[data-tab-go]', v).forEach(b => { b.onclick = () => go(b.dataset.tabGo); });
  $$('[data-member]', v).forEach(b => { b.onclick = () => openMemberHistory(b.dataset.member); });
  $('[data-act="logout2"]', v).onclick = logout;
  $('[data-act="pin"]', v).onclick = openChangePin;
  $$('[data-reunion-off]', v).forEach(b => { b.onclick = () => openCancelReunion(b.dataset.reunionOff); });
  $$('[data-reunion-on]', v).forEach(b => { b.onclick = () => setMeetingCancelled(b.dataset.reunionOn, false, ''); });
  drawReminders();
}

// =================================================================== batched ticks (shared helper)
/**
 * Taps change the screen at once and are sent together after half a second of calm, in
 * one request. Failed sends are retried; answers never undo newer taps.
 */
function makeBatcher(action, keyOf) {
  let timer = null;
  let inflight = null;
  const b = {
    pending: new Map(),
    error: null,
    get busy() { return !!inflight; },
    add(change) {
      const k = keyOf(change);
      b.pending.set(k, Object.assign(b.pending.get(k) || {}, change));
      clearTimeout(timer);
      timer = setTimeout(b.flush, 500);
      showSaveState();
    },
    async flush() {
      clearTimeout(timer);
      while (inflight) await inflight;
      if (!b.pending.size) return;
      const batch = Array.from(b.pending.values());
      b.pending.clear();
      let retry = false;
      inflight = call(action, { changes: batch }).then(() => { b.error = null; }, (e) => {
        if (e.message === 'AUTH') { logout(); return; }
        if (e.server) { b.error = null; toast(e.message, 'bad'); setTimeout(() => refresh(true), 0); return; }
        batch.forEach(c => { const k = keyOf(c); b.pending.set(k, Object.assign({}, c, b.pending.get(k) || {})); });
        b.error = e.message;
        retry = true;
      });
      showSaveState();
      await inflight;
      inflight = null;
      showSaveState();
      if (b.pending.size) timer = setTimeout(b.flush, retry ? 5000 : 300);
    },
  };
  return b;
}

// =================================================================== PROGRESSION (CPs & chiefs)
const progBatch = makeBatcher('progSet', (c) => c.memberId + '|' + c.key);
function applyPendingProg() {
  if (!S.progDone || !progBatch.pending.size) return;
  progBatch.pending.forEach((c, k) => {
    if (c.done) S.progDone.set(k, S.progDone.get(k) || { memberId: c.memberId, key: c.key, doneAt: new Date().toISOString(), doneBy: S.data.me.name });
    else S.progDone.delete(k);
  });
}
const progGroups = () => S.data.prog.groups;
const progItemsOf = (gid) => S.data.prog.items.filter(i => i.groupId === gid);
const progIsDone = (memberId, key) => S.progDone.has(memberId + '|' + key);
/** The levels in order: Promesse < Seconde classe < Première classe < Troupe Raider. */
const progLevels = () => progGroups().filter(g => g.kind === 'stage');
const levelObtained = (memberId, g) => progIsDone(memberId, 'obtained:' + g.id);
/** Highest level obtained, or null. */
function progLevel(memberId) {
  const got = progLevels().filter(g => levelObtained(memberId, g));
  return got.length ? got[got.length - 1] : null;
}
/** Badges of a scout: typed by name ("badge:<name>"), plus any ticked from an older badge list. */
function scoutBadges(memberId) {
  const out = [];
  S.progDone.forEach((d, k) => {
    if (d.memberId !== memberId) return;
    if (d.key.indexOf('badge:') === 0) out.push({ key: d.key, name: d.key.slice(6), d: d });
  });
  progGroups().filter(g => g.kind === 'badges').forEach(g => progItemsOf(g.id).forEach(i => {
    if (progIsDone(memberId, i.id)) out.push({ key: i.id, name: i.name, d: S.progDone.get(memberId + '|' + i.id) });
  }));
  return out.sort((a, b) => a.name.localeCompare(b.name));
}
/** Every badge name already given to someone (to suggest while typing). */
function knownBadges() {
  const names = new Set();
  S.progDone.forEach(d => { if (d.key.indexOf('badge:') === 0) names.add(d.key.slice(6)); });
  progGroups().filter(g => g.kind === 'badges').forEach(g => progItemsOf(g.id).forEach(i => names.add(i.name)));
  return Array.from(names).sort();
}
function progSetKey(memberId, key, done) {
  const k = memberId + '|' + key;
  if (done === S.progDone.has(k)) return;
  if (done) S.progDone.set(k, { memberId: memberId, key: key, doneAt: new Date().toISOString(), doneBy: S.data.me.name });
  else S.progDone.delete(k);
  progBatch.add({ memberId: memberId, key: key, done: done });
}
/**
 * Setting a level also sets every level below it (Première classe ⇒ Seconde ⇒ Promesse);
 * removing a level also removes the ones above it.
 */
function setLevel(memberId, g, on) {
  const levels = progLevels();
  const idx = levels.findIndex(x => x.id === g.id);
  levels.forEach((x, i) => {
    if (on && i <= idx) progSetKey(memberId, 'obtained:' + x.id, true);
    if (!on && i >= idx) progSetKey(memberId, 'obtained:' + x.id, false);
  });
}

function renderProgression(v) {
  const P = S.progView || (S.progView = { memberId: null, patrol: 'all' });
  if (P.memberId && !S.data.members.some(m => m.id === P.memberId)) P.memberId = null;
  if (P.memberId) { renderScoutProg(v, P); return; }
  const patrols = myPatrols();
  if (P.patrol !== 'all' && patrols.indexOf(P.patrol) < 0) P.patrol = 'all';
  const members = activeMembers(P.patrol === 'all' ? patrols : [P.patrol]);
  const levels = progLevels();
  const shortName = (n) => n.replace(/^Seconde classe$/, '2nde classe').replace(/^Première classe$/, '1ère classe');

  let html = '<div><h1>Progression</h1><p class="sub">Promesse, Seconde classe, Première classe, Troupe Raider and badges. Tap a scout to update him.</p></div>';
  if (patrols.length > 1) {
    html += '<div class="chips">' + ['all'].concat(patrols).map(p =>
      '<button class="chip" data-pgpatrol="' + esc(p) + '" aria-pressed="' + (P.patrol === p) + '" style="--pc:' + (p === 'all' ? 'var(--none)' : patrolColor(p)) + '">' +
      (p === 'all' ? 'All patrols' : '<span class="pdot"></span>' + esc(p)) + '</button>').join('') + '</div>';
  }
  html += '<section class="card">' + (members.length ? members.map(m => {
    const top = progLevel(m.id);
    const nb = scoutBadges(m.id).length;
    const pills = levels.map(g => levelObtained(m.id, g)
      ? '<span class="pill good">' + icon('check', 'sm') + esc(shortName(g.name)) + '</span>'
      : '<span class="pill">' + esc(shortName(g.name)) + '</span>').join('') +
      '<span class="pill accent">Badges <b>' + nb + '</b></span>';
    return '<button class="pg-row" data-pgscout="' + esc(m.id) + '" style="--pc:' + patrolColor(m.patrol) + '"><span class="avatar">' + esc(initials(m.name)) + '</span>' +
      '<span class="grow"><b>' + esc(m.name) + '</b><span class="pg-next">' + esc(m.patrol) + ' · ' + esc(top ? top.name : 'No level yet') + '</span>' +
      '<span class="pg-pills">' + pills + '</span></span>' + icon('right', 'sm') + '</button>';
  }).join('') : '<p class="empty">No scouts.</p>') + '</section>';
  v.innerHTML = html;
  $$('[data-pgpatrol]', v).forEach(b => { b.onclick = () => { P.patrol = b.dataset.pgpatrol; renderProgression(v); }; });
  $$('[data-pgscout]', v).forEach(b => { b.onclick = () => { P.memberId = b.dataset.pgscout; renderProgression(v); window.scrollTo(0, 0); }; });
}

function renderScoutProg(v, P) {
  const m = S.data.members.find(x => x.id === P.memberId);
  const when = (d) => (d ? fmtShort(isoOf(new Date(d.doneAt))) + (d.doneBy ? ' · ' + d.doneBy : '') : '');
  const draw = () => {
    const top = progLevel(m.id);
    const badges = scoutBadges(m.id);
    v.innerHTML = '<button class="btn ghost sm" id="pgBack" style="padding-left:0">' + icon('back', 'sm') + 'All scouts</button>' +
      '<div class="row" style="flex-wrap:nowrap;--pc:' + patrolColor(m.patrol) + '"><span class="avatar">' + esc(initials(m.name)) + '</span>' +
      '<div><h1 style="font-size:22px">' + esc(m.name) + '</h1><p class="sub" style="margin:0">' + esc(m.patrol) + (m.birthYear ? ' · ' + esc(m.birthYear) : '') + ' · ' + esc(top ? top.name : 'No level yet') + '</p></div></div>' +
      '<section class="card"><div class="card-head"><h2>Level</h2></div>' +
        '<p class="small muted" style="margin:10px 16px 0">Tapping a level also ticks the ones before it. Untick one to remove it and the ones after.</p>' +
        progLevels().map(g => {
          const on = levelObtained(m.id, g);
          return '<button class="pg-item" data-level="' + esc(g.id) + '" aria-pressed="' + on + '"><span class="pg-box">' + icon('check', 'sm') + '</span>' +
            '<span class="grow"><span class="nm">' + esc(g.name) + '</span><span class="when">' + esc(when(S.progDone.get(m.id + '|obtained:' + g.id))) + '</span></span></button>';
        }).join('') + '</section>' +
      '<section class="card"><div class="card-head"><h2>Badges</h2><span class="pill accent">' + badges.length + '</span></div>' +
        '<form id="badgeForm" class="row" style="padding:14px 16px 4px;flex-wrap:nowrap">' +
          '<input class="input" name="badge" list="badgeNames" maxlength="60" placeholder="Badge name…" style="margin:0" autocomplete="off">' +
          '<button class="btn primary" type="submit">' + icon('plus', 'sm') + 'Add</button></form>' +
        '<datalist id="badgeNames">' + knownBadges().map(n => '<option value="' + esc(n) + '">').join('') + '</datalist>' +
        (badges.length ? badges.map(b =>
          '<div class="pg-item" style="cursor:default"><span class="pg-box" style="background:var(--good);border-color:var(--good);color:#fff">' + icon('check', 'sm') + '</span>' +
          '<span class="grow"><span class="nm" style="color:var(--text)">' + esc(b.name) + '</span><span class="when">' + esc(when(b.d)) + '</span></span>' +
          '<button class="icon-btn" data-badge-rm="' + esc(b.key) + '" aria-label="Remove ' + esc(b.name) + '">' + icon('x', 'sm') + '</button></div>').join('')
          : '<p class="empty">No badges yet.</p>') +
      '</section>';
    $('#pgBack', v).onclick = () => { P.memberId = null; renderProgression(v); };
    $('#badgeForm', v).onsubmit = (e) => {
      e.preventDefault();
      const name = e.target.elements.badge.value.replace(/\s+/g, ' ').trim().slice(0, 60);
      if (!name) return;
      const same = scoutBadges(m.id).find(b => nameKey(b.name) === nameKey(name));
      if (same) { toast(m.name + ' already has ' + same.name); return; }
      const known = knownBadges().find(n => nameKey(n) === nameKey(name));   // same spelling as the others
      progSetKey(m.id, 'badge:' + (known || name.charAt(0).toUpperCase() + name.slice(1)), true);
      draw();
      $('#badgeForm input', v).focus();
    };
  };
  draw();
  v.onclick = async (e) => {
    const lv = e.target.closest('[data-level]');
    if (lv && v.contains(lv)) {
      const g = progLevels().find(x => x.id === lv.dataset.level);
      setLevel(m.id, g, !levelObtained(m.id, g));
      const y = window.scrollY;
      draw();
      window.scrollTo(0, y);
      return;
    }
    const rm = e.target.closest('[data-badge-rm]');
    if (rm && v.contains(rm)) {
      const key = rm.dataset.badgeRm;
      if (!await confirmBox('Remove this badge?', esc(scoutBadges(m.id).find(b => b.key === key).name) + ' will be removed from ' + esc(m.name) + '.', 'Remove', true)) return;
      progSetKey(m.id, key, false);
      draw();
    }
  };
}

// =================================================================== PRESENCE
/** Attendance key of what is open in Presence: a réunion date, or a camp / event id. */
function pkey() {
  const P = S.presence;
  return P.mode === 'event' ? P.eventId : P.date;
}
const findEvent = (id) => S.data.events.find(e => e.id === id);
const isEventKey = (k) => !/^\d{4}-\d{2}-\d{2}$/.test(k);
/** Label of a réunion date or an event, for lists and reports. */
function keyLabel(k) {
  if (!isEventKey(k)) return 'Réunion · ' + fmtMed(k);
  const ev = findEvent(k);
  return ev ? ev.title : 'Deleted event';
}
/** The patrol whose dates to show: a CP's own patrol, or the patrol chosen in Presence. */
function viewerPatrol() {
  const ps = myPatrols();
  if (ps.length === 1) return ps[0];
  return S.presence && S.presence.patrol !== 'all' ? S.presence.patrol : null;
}
/** Dates of an event for a patrol: its own dates when the event has dates per patrol (Camp Patrouille). */
function evWhen(ev, patrol) {
  const pd = ev.patrolDates;
  if (pd && patrol && pd[patrol]) return { date: pd[patrol].date, endDate: pd[patrol].endDate };
  return { date: ev.date, endDate: ev.endDate };
}
function rangeText(w) {
  if (!w.date) return 'No date yet';
  if (!w.endDate || w.endDate === w.date) return fmtMed(w.date);
  return fmtShort(w.date) + ' → ' + fmtMed(w.endDate);
}
function eventDates(ev) {
  const patrol = viewerPatrol();
  if (ev.patrolDates && !(patrol && ev.patrolDates[patrol])) return patrol ? 'No date yet for ' + patrol : 'Different dates for each patrol';
  return rangeText(evWhen(ev, patrol));
}
/** The two moments of every réunion / camp: what they answered before, what really happened. */
function phaseText(phase) {
  const P = S.presence;
  const ev = P.mode === 'event' ? findEvent(P.eventId) : null;
  const word = ev && ev.kind === 'camp' ? 'camp' : 'event';
  if (phase === 'wed') return { title: 'They said', sub: ev ? 'Before the ' + word : 'By Wednesday' };
  return { title: 'They came', sub: ev ? 'At the ' + word : 'On Saturday' };
}
function defaultEventPhase(ev) {
  const w = ev ? evWhen(ev, viewerPatrol()) : {};
  return w.date && w.date <= todayIso() ? 'sat' : 'wed';
}

function renderPresence(v) {
  const P = S.presence;
  // A new day (app left open on the phone): jump back to the default Saturday for today.
  if (!P.date || P.day !== todayIso()) Object.assign(P, defaultMeeting(), { mode: 'reunion', day: todayIso() });
  if (P.mode === 'event' && !findEvent(P.eventId)) {
    const evs = S.data.events;
    const when = (e) => evWhen(e, viewerPatrol());
    const next = evs.filter(e => when(e).date && (when(e).endDate || when(e).date) >= todayIso())
      .sort((a, b) => when(a).date.localeCompare(when(b).date))[0];
    const ev = next || evs[0];
    if (!ev) P.mode = 'reunion';
    else { P.eventId = ev.id; P.phase = defaultEventPhase(ev); }
  }
  const patrols = myPatrols();
  if (P.patrol !== 'all' && patrols.indexOf(P.patrol) < 0) P.patrol = 'all';
  const ev = P.mode === 'event' ? findEvent(P.eventId) : null;

  const whenCard = ev
    ? '<div class="card event-card">' +
        '<div class="chips">' + S.data.events.map(e =>
          '<button class="chip" data-event="' + esc(e.id) + '" aria-pressed="' + (e.id === ev.id) + '">' + esc(e.title) + '</button>').join('') +
          (isAdmin() ? '<button class="chip" data-event-new>' + icon('plus', 'sm') + 'New event</button>' : '') + '</div>' +
        '<div class="ev-now"><div><div class="dl-rel">' + (ev.kind === 'camp' ? 'Camp' : 'Special event') + '</div><div class="dl-main">' + esc(ev.title) + '</div>' +
          '<div class="muted small">' + esc(eventDates(ev)) + '</div></div>' +
          (isAdmin() ? '<button class="btn sm" data-event-edit>Edit</button>' : '') + '</div>' +
      '</div>'
    : '<div class="card date-card">' +
        '<button class="icon-btn" data-step="-7" aria-label="Previous Saturday">' + icon('left') + '</button>' +
        '<div class="date-label"><div class="dl-rel">' + relLabel(P.date) + '</div><div class="dl-main">' + esc(fmtLong(P.date)) + '</div></div>' +
        '<button class="icon-btn" data-step="7" aria-label="Next Saturday">' + icon('right') + '</button>' +
      '</div>';

  v.innerHTML =
    '<div class="seg seg-mode" role="tablist">' +
      '<button role="tab" data-mode="reunion" aria-selected="' + (P.mode === 'reunion') + '">Réunions</button>' +
      '<button role="tab" data-mode="event" aria-selected="' + (P.mode === 'event') + '">Camps &amp; events</button>' +
    '</div>' +
    '<div class="pres-top">' + whenCard +
      '<div class="seg seg-phase" role="tablist">' + ['wed', 'sat'].map(ph => {
        const t = phaseText(ph);
        return '<button role="tab" data-phase="' + ph + '" aria-selected="' + (P.phase === ph) + '">' + t.title + '<small>' + t.sub + '</small></button>';
      }).join('') +
      '</div>' +
    '</div>' +
    '<div id="presBanner"></div>' +
    (patrols.length > 1 ? '<div class="chips">' + ['all'].concat(patrols).map(p =>
      '<button class="chip" data-patrol="' + esc(p) + '" aria-pressed="' + (P.patrol === p) + '" style="--pc:' + (p === 'all' ? 'var(--none)' : patrolColor(p)) + '">' +
      (p === 'all' ? 'All patrols' : '<span class="pdot"></span>' + esc(p)) + '</button>').join('') + '</div>' : '') +
    '<div class="card summary" id="presSummary"></div>' +
    '<div class="pgrid" id="presList"></div>';

  $$('[data-step]', v).forEach(b => { b.onclick = () => { P.date = addDays(P.date, Number(b.dataset.step)); renderPresence(v); }; });
  $$('[data-phase]', v).forEach(b => { b.onclick = () => { P.phase = b.dataset.phase; renderPresence(v); }; });
  $$('[data-patrol]', v).forEach(b => { b.onclick = () => { P.patrol = b.dataset.patrol; renderPresence(v); }; });
  $$('[data-mode]', v).forEach(b => {
    b.onclick = () => {
      if (P.mode === b.dataset.mode) return;
      P.mode = b.dataset.mode;
      if (P.mode === 'reunion') Object.assign(P, defaultMeeting(), { mode: 'reunion' });
      else P.eventId = null;
      renderPresence(v);
    };
  });
  $$('[data-event]', v).forEach(b => {
    b.onclick = () => { P.eventId = b.dataset.event; P.phase = defaultEventPhase(findEvent(P.eventId)); renderPresence(v); };
  });
  if ($('[data-event-new]', v)) $('[data-event-new]', v).onclick = () => editEvent(null, (id) => { P.eventId = id; renderPresence(v); });
  if ($('[data-event-edit]', v)) $('[data-event-edit]', v).onclick = () => editEvent(ev, () => renderPresence(v));
  const chosen = $('.event-card .chip[aria-pressed="true"]', v);
  if (chosen) chosen.scrollIntoView({ block: 'nearest', inline: 'center' });

  const list = $('#presList', v);
  list.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-st]');
    if (!btn || btn.disabled) return;
    const row = btn.closest('.mrow');
    const id = row.dataset.id;
    const key = pkey();
    const cur = (rec(key, id) || {})[P.phase + 'Status'] || '';
    const next = cur === btn.dataset.st ? '' : btn.dataset.st;   // tap again to clear
    const input = $('.reason', row);
    setAnswer(key, id, P.phase, next, input ? input.value : ((rec(key, id) || {})[P.phase + 'Reason'] || ''));
    redrawRow(id);
    drawSummary();
  });
  const reasonTimers = {};
  list.addEventListener('input', (e) => {
    if (!e.target.classList.contains('reason')) return;
    const id = e.target.closest('.mrow').dataset.id;
    const value = e.target.value;
    const date = pkey();
    const phase = P.phase;
    clearTimeout(reasonTimers[id]);
    reasonTimers[id] = setTimeout(() => {
      const r = rec(date, id) || {};
      if (r[phase + 'Status']) setAnswer(date, id, phase, r[phase + 'Status'], value);
    }, 600);
  });

  drawBanner();
  drawSummary();
  drawList();
}

function presenceMembers() {
  const P = S.presence;
  const patrols = P.patrol === 'all' ? myPatrols() : [P.patrol];
  return activeMembers(patrols);
}
function presenceLocked() {
  return S.presence.mode === 'reunion' && isCancelled(S.presence.date) && !isAdmin();
}

function drawBanner() {
  const P = S.presence;
  const el = $('#presBanner');
  const m = S.meetingByDate.get(P.date);
  let html = '';
  if (P.mode === 'event') {
    const ev = findEvent(P.eventId);
    const w = ev ? evWhen(ev, viewerPatrol()) : {};
    if (P.phase === 'sat' && w.date && w.date > todayIso()) {
      html = '<div class="banner warn">' + icon('clock') + '<span class="grow">This has not happened yet. Fill "They came" during or after it.</span></div>';
    }
  } else if (m && m.cancelled) {
    html = '<div class="banner bad">' + icon('calendar') + '<span class="grow"><b>No réunion this Saturday</b>' + (m.note ? ' — ' + esc(m.note) : '') + '</span>' +
      (isAdmin() ? '<button class="btn sm" data-meeting="open">Undo</button>' : '') + '</div>';
  } else if (P.phase === 'sat' && P.date > todayIso()) {
    html = '<div class="banner warn">' + icon('clock') + '<span class="grow">This Saturday has not happened yet. Fill this after the réunion.</span></div>';
  } else if (P.date < S.data.settings.seasonStart) {
    html = '<div class="banner warn">' + icon('alert') + '<span class="grow">This date is before the season start (' + esc(fmtShort(S.data.settings.seasonStart)) + ') and is not counted in the stats.</span></div>';
  }
  el.innerHTML = html;
  el.classList.toggle('hidden', !html);
  const undo = $('[data-meeting="open"]', el);
  if (undo) undo.onclick = () => setMeetingCancelled(P.date, false, '');
}

/** Create (ev = null) or edit a camp / special event. onSaved(id) after saving. */
function editEvent(ev, onSaved) {
  const isNew = !ev;
  ev = ev || { title: '', date: '', endDate: '', kind: 'special' };
  // Camp Patrouille starts with one date per patrol; any event can switch.
  const perPatrol = !!ev.patrolDates || (ev.id === 'ev_camp-patrouille' && !ev.date);
  openModal(
    '<h2>' + (isNew ? 'New special event' : 'Edit ' + esc(ev.title)) + '</h2>' +
    '<p class="sub">' + (isNew ? 'Any day that is not a normal Saturday réunion: outing, service, ceremony… It shows next to the camps.' : 'Dates are optional.') + '</p>' +
    '<form id="evForm" style="margin-top:14px">' +
      '<label class="field">Name<input class="input" name="title" maxlength="60" required value="' + esc(ev.title) + '" placeholder="e.g. Sortie, Jamboree, Messe"></label>' +
      '<label class="check" style="margin-top:12px"><input type="checkbox" name="perPatrol"' + (perPatrol ? ' checked' : '') + '>Different dates for each patrol</label>' +
      '<div id="evOne" class="grid-2' + (perPatrol ? ' hidden' : '') + '" style="margin-top:12px"><label class="field">Starts<input class="input" type="date" name="date" value="' + esc(perPatrol ? '' : ev.date) + '"></label>' +
      '<label class="field">Ends (optional)<input class="input" type="date" name="endDate" value="' + esc(perPatrol ? '' : ev.endDate) + '"></label></div>' +
      '<div id="evPer"' + (perPatrol ? '' : ' class="hidden"') + '>' + S.data.patrols.map(p => {
        const d = (ev.patrolDates || {})[p] || {};
        return '<div class="pp-row" data-pp="' + esc(p) + '" style="--pc:' + patrolColor(p) + '"><b><span class="pdot"></span> ' + esc(p) + '</b>' +
          '<div class="grid-2"><label class="field">Starts<input class="input" type="date" name="ppDate" value="' + esc(d.date || '') + '"></label>' +
          '<label class="field">Ends<input class="input" type="date" name="ppEnd" value="' + esc(d.endDate || '') + '"></label></div></div>';
      }).join('') + '</div>' +
      '<p class="err" id="evErr"></p>' +
      '<div class="modal-actions">' + (!isNew ? '<button type="button" class="btn danger" id="evDel">Delete</button><span class="spacer"></span>' : '') +
        '<button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn primary">Save</button></div>' +
    '</form>', {
    onMount: (m, close) => {
      const f = $('#evForm', m);
      f.elements.perPatrol.onchange = () => {
        $('#evOne', m).classList.toggle('hidden', f.elements.perPatrol.checked);
        $('#evPer', m).classList.toggle('hidden', !f.elements.perPatrol.checked);
      };
      f.onsubmit = async (e) => {
        e.preventDefault();
        const payload = { id: ev.id, title: f.elements.title.value };
        if (f.elements.perPatrol.checked) {
          payload.patrolDates = {};
          $$('[data-pp]', m).forEach(row => {
            payload.patrolDates[row.dataset.pp] = { date: $('[name=ppDate]', row).value, endDate: $('[name=ppEnd]', row).value };
          });
        } else {
          payload.date = f.elements.date.value;
          payload.endDate = f.elements.endDate.value;
        }
        try {
          const res = await call('saveEvent', payload);
          S.data.events = res.events;
          close();
          toast(isNew ? 'Event created' : 'Saved');
          if (onSaved) onSaved(res.id);
        } catch (err) { $('#evErr', m).textContent = err.message; }
      };
      const del = $('#evDel', m);
      if (del) del.onclick = async () => {
        close();
        if (!await confirmBox('Delete ' + ev.title + '?', 'Everything filled for it (who said, who came) is deleted too.', 'Delete', true)) return;
        try {
          const res = await call('deleteEvent', { id: ev.id });
          S.data.events = res.events;
          S.data.attendance = S.data.attendance.filter(a => a.date !== ev.id);
          indexData();
          toast('Deleted');
          if (S.presence.eventId === ev.id) S.presence.eventId = null;
          go(S.tab, true);
        } catch (err) { toast(err.message, 'bad'); }
      };
    },
  });
}

/** Chief: cancel a Saturday. Everyone then sees "No réunion this Saturday". */
function openCancelReunion(date) {
  openModal('<h2>No réunion on ' + esc(fmtLong(date)) + '?</h2>' +
    '<p class="sub">Everyone will see "No réunion this Saturday". Nobody can fill it, it does not count in the statistics and no reminders are sent.</p>' +
    '<label class="field" style="margin-top:14px">Reason shown to everyone (optional)<input class="input" id="mtNote" maxlength="200" placeholder="e.g. Holiday, camp, exams"></label>' +
    '<div class="modal-actions"><button class="btn" data-close>Keep it</button><button class="btn danger" data-ok>Cancel the réunion</button></div>', {
    onMount: (m, close) => { $('[data-ok]', m).onclick = () => { close(); setMeetingCancelled(date, true, $('#mtNote', m).value); }; },
  });
}

async function setMeetingCancelled(date, cancelled, note) {
  try {
    const res = await call('setMeeting', { date: date, cancelled: cancelled, note: note });
    S.data.meetings = res.meetings;
    indexData();
    go(S.tab, true);
    toast(cancelled ? 'Réunion cancelled' : 'The réunion is back on');
  } catch (e) { toast(e.message, 'bad'); }
}

function drawSummary() {
  const P = S.presence;
  const members = presenceMembers();
  const opts = PHASES[P.phase];
  const counts = {};
  opts.forEach(o => { counts[o.k] = 0; });
  let filled = 0;
  members.forEach(m => {
    const st = (rec(pkey(), m.id) || {})[P.phase + 'Status'];
    if (st) { filled++; counts[st]++; }
  });
  const missing = members.length - filled;
  const total = members.length || 1;
  let html = '<div class="sum-top"><div class="count"><b>' + filled + '</b> of ' + members.length + ' filled</div>';
  // "They came" can start from what they said: coming -> present, late -> late, not coming -> absent.
  const FROM_SAID = { coming: 'present', late: 'late', out: 'absent' };
  const fillable = P.phase === 'sat' ? members.filter(m => {
    const r = rec(pkey(), m.id) || {};
    return !r.satStatus && FROM_SAID[r.wedStatus];
  }) : [];
  if (missing > 0 && !presenceLocked()) {
    if (fillable.length) html += '<button class="btn sm primary" data-autofill>' + icon('presence', 'sm') + 'Fill from They said (' + fillable.length + ')</button>';
    html += P.phase === 'wed'
      ? '<button class="btn sm" data-bulk="noreply">' + icon('question', 'sm') + 'Rest = No reply</button>'
      : '<button class="btn sm" data-bulk="present">' + icon('check', 'sm') + 'Rest = Present</button>';
  }
  html += '</div><div class="progress" role="img" aria-label="' + filled + ' of ' + members.length + ' filled">' +
    opts.map(o => counts[o.k] ? '<span class="' + o.tone + '" style="width:' + (counts[o.k] / total * 100) + '%"></span>' : '').join('') + '</div>' +
    '<div class="sum-pills">' + opts.map(o => '<span class="pill ' + o.tone + '">' + icon(o.icon, 'sm') + o.label + ' <b>' + counts[o.k] + '</b></span>').join('') +
    (missing ? '<span class="pill">Not filled <b>' + missing + '</b></span>' : '') + '</div>';

  if (P.phase === 'sat') {
    const w = { coming: 0, late: 0, out: 0 };
    members.forEach(m => { const s = (rec(pkey(), m.id) || {}).wedStatus; if (s in w) w[s]++; });
    if (w.coming + w.late + w.out) html += '<p class="sum-note">They said: ' + w.coming + ' coming, ' + w.late + ' late, ' + w.out + ' not coming.</p>';
  }
  if (isAdmin() && P.mode === 'reunion' && !isCancelled(P.date)) {
    html += '<p class="sum-note"><button class="btn ghost sm" style="padding-left:0" data-meeting="cancel">' + icon('calendar', 'sm') + 'No réunion this Saturday?</button></p>';
  }
  const el = $('#presSummary');
  el.innerHTML = html;
  const auto = $('[data-autofill]', el);
  if (auto) auto.onclick = async () => {
    const n = { present: 0, late: 0, absent: 0 };
    fillable.forEach(m => { n[FROM_SAID[rec(pkey(), m.id).wedStatus]]++; });
    if (!await confirmBox('Fill from They said?',
      plural(fillable.length, 'scout') + ' not marked yet will be filled from their answer: <b>' + n.present + ' present</b>, <b>' + n.late + ' late</b>, <b>' + n.absent + ' absent</b> (with their reason). ' +
      'Change the ones that did something else after.', 'Fill ' + fillable.length)) return;
    fillable.forEach(m => {
      const r = rec(pkey(), m.id);
      setAnswer(pkey(), m.id, 'sat', FROM_SAID[r.wedStatus], r.wedReason || '');
    });
    drawList();
    drawSummary();
  };
  const bulk = $('[data-bulk]', el);
  if (bulk) bulk.onclick = async () => {
    const st = bulk.dataset.bulk;
    const label = statusMeta(P.phase, st).label;
    if (!await confirmBox('Mark the rest?', 'The ' + plural(missing, 'scout') + ' not filled yet will be marked <b>' + esc(label) + '</b>.', 'Mark ' + missing)) return;
    members.forEach(m => { if (!(rec(pkey(), m.id) || {})[P.phase + 'Status']) setAnswer(pkey(), m.id, P.phase, st, ''); });
    drawList();
    drawSummary();
  };
  const cancel = $('[data-meeting="cancel"]', el);
  if (cancel) cancel.onclick = () => openCancelReunion(P.date);
  // keep patrol counters in the list headers in sync
  $$('[data-pcount]').forEach(c => {
    const ms = members.filter(m => m.patrol === c.dataset.pcount);
    c.textContent = ms.filter(m => (rec(pkey(), m.id) || {})[P.phase + 'Status']).length + '/' + ms.length;
  });
}

function drawList() {
  const P = S.presence;
  const members = presenceMembers();
  const el = $('#presList');
  if (!members.length) {
    el.innerHTML = '<div class="card empty">No scouts to show.' + (isAdmin() ? ' Import the members list in Admin.' : '') + '</div>';
    return;
  }
  const groups = [];
  members.forEach(m => {
    let g = groups[groups.length - 1];
    if (!g || g.patrol !== m.patrol) { g = { patrol: m.patrol, members: [] }; groups.push(g); }
    g.members.push(m);
  });
  el.innerHTML = groups.map(g => {
    const n = g.members.filter(m => (rec(pkey(), m.id) || {})[P.phase + 'Status']).length;
    return '<section class="card pcard" style="--pc:' + patrolColor(g.patrol) + '">' +
      '<header class="pc-head"><span class="pdot"></span><h3>' + esc(g.patrol) + '</h3><span class="pc-count" data-pcount="' + esc(g.patrol) + '">' + n + '/' + g.members.length + '</span></header>' +
      g.members.map(rowHtml).join('') + '</section>';
  }).join('');
}

function rowHtml(m) {
  const P = S.presence;
  const r = rec(pkey(), m.id) || {};
  const st = r[P.phase + 'Status'] || '';
  const meta = statusMeta(P.phase, st);
  const locked = presenceLocked();
  const stat = computeStats().byId.get(m.id);
  let extra = '';
  if (P.phase === 'sat' && r.wedStatus) {
    const w = statusMeta('wed', r.wedStatus);
    extra += '<span class="pill ' + w.tone + '" title="What they said before">Said: ' + esc(w.label) + (r.wedReason ? ' · ' + esc(r.wedReason) : '') + '</span>';
  }
  if (stat && stat.streakAlert) extra += '<span class="pill alert-pill glow">' + icon('alert', 'sm') + 'Missed ' + stat.absStreak + ' in a row</span>';
  return '<div class="mrow ' + (locked ? 'locked' : '') + '" data-id="' + esc(m.id) + '">' +
    '<div class="mtop"><span class="avatar">' + esc(initials(m.name)) + '</span>' +
      '<div class="mname"><div class="nm">' + esc(m.name) + '</div><div class="meta">' + (m.birthYear ? '<span>' + esc(m.birthYear) + '</span>' : '') + leaderPill(m) + extra + '</div></div></div>' +
    '<div class="seg seg-status" role="group" aria-label="' + esc(m.name) + '">' +
      PHASES[P.phase].map(o => '<button data-st="' + o.k + '" class="' + o.tone + '" aria-pressed="' + (o.k === st) + '"' + (locked ? ' disabled' : '') + '>' + icon(o.icon, 'sm') + '<span>' + o.short + '</span></button>').join('') +
    '</div>' +
    (meta && meta.reason ? '<input class="input reason" maxlength="200" placeholder="Reason' + (P.phase === 'sat' ? ' (optional)' : '') + '" value="' + esc(r[P.phase + 'Reason'] || '') + '"' + (locked ? ' disabled' : '') + '>' : '') +
    (st && r[P.phase + 'By'] ? '<div class="by">by ' + esc(r[P.phase + 'By']) + ' · ' + esc(ago(r[P.phase + 'At'])) + '</div>' : '') +
    '</div>';
}

function leaderPill(m) {
  return m.leader ? '<span class="pill accent">' + (m.leader === 'red' ? 'SP' : 'CP') + '</span>' : '';
}

function redrawRow(id) {
  const old = $('.mrow[data-id="' + CSS.escape(id) + '"]');
  const m = S.data.members.find(x => x.id === id);
  if (!old || !m) return;
  const tmp = document.createElement('div');
  tmp.innerHTML = rowHtml(m);
  old.replaceWith(tmp.firstChild);
}

// =================================================================== MONEY (chief): orders, given / paid
const money = () => S.data.money;
function fmtMoney(n) {
  const c = S.data.settings.currency || '$';
  const v = (Math.round((n || 0) * 100) / 100).toLocaleString('en-US', { maximumFractionDigits: 2 });
  return /^[$€£]$/.test(c) ? c + v : v + ' ' + c;
}
const lineTotal = (l) => l.price * (l.qty || 1);
const lineState = (l) => (l.given && l.paid ? 'done' : l.given ? 'owes' : l.paid ? 'give' : 'open');
const LINE_STATES = {
  done: { label: 'Done', tone: 'good' },
  owes: { label: 'Owes money', tone: 'bad' },
  give: { label: 'To give', tone: 'warn' },
  open: { label: 'Not given · not paid', tone: 'none' },
};
function moneySums(lines) {
  const s = { n: lines.length, total: 0, paid: 0, paidN: 0, givenN: 0, owed: 0, owesN: 0, toGiveN: 0 };
  lines.forEach(l => {
    const t = lineTotal(l);
    s.total += t;
    if (l.paid) { s.paid += t; s.paidN++; }
    if (l.given) s.givenN++;
    if (l.given && !l.paid) { s.owed += t; s.owesN++; }
    if (l.paid && !l.given) s.toGiveN++;
  });
  return s;
}
const memberOf = (id) => S.data.members.find(m => m.id === id) || { id: id, name: '(no longer on the list)', patrol: '', leader: '' };
const orderLines = (orderId) => money().lines.filter(l => l.orderId === orderId);
const orderTitle = (o) => (o.kind === 'troupe' ? o.title : memberOf((orderLines(o.id)[0] || {}).memberId).name);
const itemNames = () => Array.from(new Set(money().lines.map(l => l.item).concat(money().orders.map(o => o.title)).filter(Boolean))).sort();
const lineLabel = (l) => l.item + (l.variant ? ' ' + l.variant : '');

function renderMoney(v) {
  const M = S.moneyView || (S.moneyView = { view: 'orders', orderId: null, filter: 'all', patrol: 'all' });
  if (M.orderId && !money().orders.some(o => o.id === M.orderId)) M.orderId = null;
  if (M.orderId) { renderOrder(v, M); return; }
  const all = moneySums(money().lines);

  let html =
    '<div><h1>Money</h1><p class="sub">What you bought for the scouts: who got it, who paid.</p></div>' +
    '<div class="kpis">' +
      kpi('They owe you', fmtMoney(all.owed), plural(all.owesN, 'item') + ' given, not paid') +
      kpi('Collected', fmtMoney(all.paid), 'of ' + fmtMoney(all.total)) +
      kpi('To give', all.toGiveN, 'paid, not given yet') +
      kpi('Orders', money().orders.length, plural(all.n, 'line')) +
    '</div>' +
