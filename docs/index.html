      S.data.patrols.map(p => {
        const ms = activeMembers([p]);
        return '<div style="margin-top:12px"><h3 style="display:flex;align-items:center;gap:8px"><span class="pdot" style="--pc:' + patrolColor(p) + '"></span>' + esc(p) + ' <span class="muted small">' + ms.length + '</span></h3>' +
          '<p class="small" style="margin-top:4px;color:var(--text-2)">' + ms.map(m => esc(m.name) + (m.birthYear ? ' <span class="muted">(' + esc(m.birthYear) + ')</span>' : '')).join(', ') + '</p></div>';
      }).join('') +
      (inactive.length ? '<div style="margin-top:16px"><h3>No longer on the list</h3><p class="small muted" style="margin-top:4px">' + inactive.map(m => esc(m.name)).join(', ') + '</p></div>' : '') +
    '</div></details>' +
    '</div>';

  drawReporters();
  drawLeaders();
  let preview = null;
  const runSync = async (apply) => {
    const btns = [$('#srcPreview'), $('#srcImport')];
    btns.forEach(b => { b.disabled = true; });
    $('#srcResult').innerHTML = '<p class="muted" style="margin-top:12px"><span class="spinner" style="display:inline-block;width:16px;height:16px;border-width:2px;margin:0 8px -3px 0"></span>Reading the file from Drive…</p>';
    try {
      const res = await call('syncSource', { url: $('#srcUrl').value.trim(), sheetName: $('#srcSheet').value, apply: apply });
      preview = res;
      const sel = $('#srcSheet');
      sel.innerHTML = res.sheetNames.map(n => '<option' + (n === res.sheetName ? ' selected' : '') + '>' + esc(n) + '</option>').join('');
      drawSyncResult(res);
      if (apply) {
        toast('Members list imported');
        await refresh(true);
      }
    } catch (e) {
      $('#srcResult').innerHTML = '<div class="banner bad" style="margin-top:12px">' + icon('alert') + '<span class="grow">' + esc(e.message) + '</span></div>';
    } finally {
      btns.forEach(b => { if (document.body.contains(b)) b.disabled = false; });
    }
  };
  $('#srcPreview').onclick = () => runSync(false);
  if ($('#srcCheck')) $('#srcCheck').onclick = () => refresh();
  $('#srcImport').onclick = async () => {
    if (!preview && !await confirmBox('Import now?', 'The scouts list will be replaced by the one in the file. History is kept.', 'Import')) return;
    runSync(true);
  };
  $('#srcSheet').onchange = () => { preview = null; runSync(false); };
  $('#srcUrl').oninput = () => { preview = null; };
  $('#addRep').onclick = () => editReporter(null);

  $('#setForm').onsubmit = async (e) => {
    e.preventDefault();
    const f = e.target;
    const payload = {};
    ['teamName', 'seasonStart', 'streakAlert', 'minMeetings', 'warnPct', 'lowPct'].forEach(k => { payload[k] = f.elements[k].value; });
    try {
      const res = await call('saveSettings', payload);
      S.data.settings = res.settings;
      S.statsCache = null;
      toast('Rules saved');
      renderShell();
      go('admin', true);
    } catch (err) { toast(err.message, 'bad'); }
  };
}

function drawSyncResult(res) {
  const counts = {};
  res.members.forEach(m => { counts[m.patrol] = (counts[m.patrol] || 0) + 1; });
  const d = res.diff;
  const changes = d.added.length + d.removed.length + d.moved.length;
  const list = (title, items, tone) => items.length ? '<div><span class="pill ' + tone + '">' + esc(title) + ' ' + items.length + '</span><ul>' + items.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>' : '';
  $('#srcResult').innerHTML =
    '<div class="diff">' +
      '<div class="banner ' + (res.applied ? 'info' : changes ? 'warn' : 'info') + '">' + icon(res.applied ? 'check' : 'presence') + '<span class="grow">' +
        '<b>' + esc(res.fileName) + ' › ' + esc(res.sheetName) + '</b><br>' + res.members.length + ' scouts in ' + res.patrols.length + ' patrols, ' +
        plural(d.leaders.length, 'leader') + ' (names in color) · ' +
        (res.applied ? 'imported.' : changes ? plural(changes, 'change') + ' to import.' : 'already up to date.') + '</span></div>' +
      '<div class="sum-pills">' + res.patrols.map(p => '<span class="pill"><span class="pdot" style="--pc:' + (S.patrolIdx.has(p) ? patrolColor(p) : 'var(--none)') + '"></span>' + esc(p) + ' <b>' + (counts[p] || 0) + '</b></span>').join('') + '</div>' +
      list('New', d.added, 'good') + list('Removed', d.removed, 'bad') + list('Changed patrol', d.moved, 'warn') +
    '</div>';
}

const nameKey = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

function drawLeaders() {
  const el = $('#leadersCard');
  if (!el) return;
  const leaders = activeMembers().filter(m => m.leader);
  const hasAccount = new Set(S.data.reporters.map(r => nameKey(r.name)));
  const missing = leaders.filter(m => !hasAccount.has(nameKey(m.name)));
  el.innerHTML =
    '<div class="card-head"><h2>Patrol leaders</h2><span class="pill accent">' + leaders.length + '</span></div><div class="card-body">' +
    '<p class="sub" style="margin:0 0 10px">The names written in <b>green</b> or <b>red</b> in the members file. Each one reports for his own patrol.</p>' +
    (leaders.length ? leaders.map(m =>
      '<div class="rep" style="--pc:' + patrolColor(m.patrol) + '"><span class="avatar">' + esc(initials(m.name)) + '</span><div class="grow"><b>' + esc(m.name) + '</b><div class="tags">' +
        '<span class="pill"><span class="pdot"></span>' + esc(m.patrol) + '</span>' +
        '<span class="pill">' + esc(m.leader === 'green' ? 'Green' : m.leader === 'red' ? 'Red' : 'Colored') + '</span>' +
        (hasAccount.has(nameKey(m.name)) ? '<span class="pill accent">' + icon('check', 'sm') + 'Has an account</span>' : '<span class="pill warn">No account yet</span>') +
      '</div></div></div>').join('') :
      '<p class="muted">No leaders found yet. Import the members list (names in color = leaders).</p>') +
    (missing.length ? '<button class="btn primary block" id="mkLeaders" style="margin-top:12px">' + icon('plus', 'sm') + 'Create ' + plural(missing.length, 'account') + ' with PINs</button>' : '') +
    '</div>';
  const btn = $('#mkLeaders', el);
  if (btn) btn.onclick = async () => {
    btn.disabled = true;
    try {
      const res = await call('createLeaderAccounts', {});
      S.data.reporters = res.reporters;
      drawReporters();
      drawLeaders();
      showLeaderPins(res.created);
    } catch (e) {
      toast(e.message, 'bad');
      btn.disabled = false;
    }
  };
}

/** PINs are only shown this once (the server keeps them encrypted). */
function showLeaderPins(created) {
  if (!created.length) { toast('Every leader already has an account'); return; }
  const appUrl = window.HP_APP_URL || location.href.split(/[?#]/)[0];
  const message = (x) => S.data.settings.teamName + ' – HP App\n' + appUrl + '\nName: ' + x.name + '\nPIN: ' + x.pin;
  openModal(
    '<h2>' + plural(created.length, 'account') + ' created</h2>' +
    '<div class="banner warn" style="margin-top:10px">' + icon('alert') + '<span class="grow">Send each leader his PIN <b>now</b>. They are shown only once. You can set a new PIN later with Edit.</span></div>' +
    '<div class="scroll-x" style="margin-top:12px"><table class="ttable"><thead><tr><th>Leader</th><th>Patrol</th><th>PIN</th><th></th></tr></thead><tbody>' +
      created.map((x, i) => '<tr><td><b>' + esc(x.name) + '</b></td><td>' + esc(x.patrol) + '</td><td class="num" style="font-size:17px;font-weight:700;letter-spacing:.08em">' + esc(x.pin) + '</td>' +
        '<td><button class="btn sm" data-share="' + i + '">Send</button></td></tr>').join('') +
    '</tbody></table></div>' +
    '<div class="modal-actions"><button class="btn" id="copyPins">Copy all</button><button class="btn primary" data-close>Done</button></div>', {
    wide: true,
    onMount: (m) => {
      const copy = async (text, okMsg) => {
        try { await navigator.clipboard.writeText(text); toast(okMsg); } catch (e) { window.prompt('Copy this:', text); }
      };
      $$('[data-share]', m).forEach(b => {
        b.onclick = async () => {
          const text = message(created[Number(b.dataset.share)]);
          if (navigator.share) { try { await navigator.share({ text: text }); return; } catch (e) { if (e.name === 'AbortError') return; } }
          copy(text, 'Copied – paste it in WhatsApp');
        };
      });
      $('#copyPins', m).onclick = () => copy(appUrl + '\n\n' + created.map(x => x.name + ' (' + x.patrol + '): ' + x.pin).join('\n'), 'All PINs copied');
    },
  });
}

function drawReporters() {
  const el = $('#repList');
  if (!el) return;
  const reps = S.data.reporters.slice().sort((a, b) => (a.role === b.role ? a.name.localeCompare(b.name) : a.role === 'admin' ? -1 : 1));
  el.innerHTML = reps.map(r =>
    '<div class="rep"><span class="avatar">' + esc(initials(r.name)) + '</span><div class="grow"><b>' + esc(r.name) + '</b><div class="tags">' +
      (r.role === 'admin' ? '<span class="pill accent">Chief</span>' : '') +
      (r.patrols.length ? r.patrols.map(p => '<span class="pill"><span class="pdot" style="--pc:' + patrolColor(p) + '"></span>' + esc(p) + '</span>').join('') : '<span class="pill">All patrols</span>') +
    '</div></div><button class="btn sm" data-rep="' + esc(r.id) + '">Edit</button></div>').join('') ||
    '<p class="empty">No reporters yet.</p>';
  $$('[data-rep]', el).forEach(b => { b.onclick = () => editReporter(S.data.reporters.find(r => r.id === b.dataset.rep)); });
}

function editReporter(r) {
  const isNew = !r;
  r = r || { name: '', role: 'reporter', patrols: [] };
  const self = !isNew && r.id === S.data.me.id;
  openModal(
    '<h2>' + (isNew ? 'Add a reporter' : 'Edit ' + esc(r.name)) + '</h2>' +
    '<p class="sub">Reporters sign in with their name and PIN to fill the Presence tab.</p>' +
    '<form id="repForm" style="margin-top:16px">' +
      '<label class="field">Name<input class="input" name="name" maxlength="60" required value="' + esc(r.name) + '"></label>' +
      '<label class="field">' + (isNew ? 'PIN (4–8 digits)' : 'New PIN (leave empty to keep the current one)') +
        '<input class="input" name="pin" type="text" inputmode="numeric" pattern="[0-9]{4,8}" maxlength="8" autocomplete="off"' + (isNew ? ' required' : '') + '></label>' +
      '<label class="field">Role<select class="input" name="role"><option value="reporter">Reporter</option><option value="admin"' + (r.role === 'admin' ? ' selected' : '') + '>Chief (sees stats &amp; admin)</option></select></label>' +
      '<div class="field" style="margin-top:12px;font-size:13px;font-weight:600;color:var(--text-2)">In charge of (none ticked = all patrols)</div>' +
      '<div class="check-grid">' + S.data.patrols.map(p => '<label class="check"><input type="checkbox" name="patrols" value="' + esc(p) + '"' + (r.patrols.indexOf(p) >= 0 ? ' checked' : '') + '><span class="pdot" style="--pc:' + patrolColor(p) + '"></span>' + esc(p) + '</label>').join('') + '</div>' +
      '<p class="err" id="repErr"></p>' +
      '<div class="modal-actions">' + (!isNew && !self ? '<button type="button" class="btn danger" id="repDel">Delete</button><span class="spacer"></span>' : '') +
        '<button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn primary">Save</button></div>' +
    '</form>', {
    onMount: (m, close) => {
      const form = $('#repForm', m);
      form.onsubmit = async (e) => {
        e.preventDefault();
        try {
          const res = await call('saveReporter', {
            id: r.id, name: form.elements.name.value, pin: form.elements.pin.value, role: form.elements.role.value,
            patrols: $$('input[name="patrols"]:checked', form).map(x => x.value),
          });
          S.data.reporters = res.reporters;
          close();
          drawReporters();
          drawLeaders();
          toast(isNew ? 'Reporter added' : 'Saved');
          if (self) refresh(true);
        } catch (err) { $('#repErr', m).textContent = err.message; }
      };
      const del = $('#repDel', m);
      if (del) del.onclick = async () => {
        close();
        if (!await confirmBox('Delete ' + r.name + '?', 'They will not be able to sign in anymore. What they filled stays.', 'Delete', true)) return;
        try {
          const res = await call('deleteReporter', { id: r.id });
          S.data.reporters = res.reporters;
          drawReporters();
          drawLeaders();
          toast('Deleted');
        } catch (err) { toast(err.message, 'bad'); }
      };
    },
  });
}

// =================================================================== go
function boot() { start(); }
const notConnected = () => {
  app.innerHTML = authFrame('<h1>Not connected yet</h1><p class="sub">This app is not linked to its Google server yet. The chief must put the web app link in <b>config.js</b>.</p>');
};
if ((window.google && google.script && google.script.run) || window.HP_API_URL) {
  boot();
} else if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
  // Local preview only: load the mock backend that runs Code.gs in the browser.
  const s = document.createElement('script');
  s.src = '../dev/mock.js';
  s.onload = boot;
  s.onerror = notConnected;
  document.head.appendChild(s);
} else {
  notConnected();
}

// Installed app (PWA): cache the page so it opens instantly and offline.
if ('serviceWorker' in navigator && window.HP_PWA && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
</body>
</html>
