<style>
:root {
  color-scheme: light;
  --bg: #f4f4f1;
  --surface: #ffffff;
  --surface-2: #f0efec;
  --text: #0b0b0b;
  --text-2: #52514e;
  --muted: #7a7873;
  --border: rgba(11, 11, 11, .10);
  --hair: #e8e7e1;
  --accent: #1f6f4a;
  --accent-ink: #ffffff;
  --accent-soft: #e3f1ea;
  --accent-text: #17573a;
  --good: #0ca30c; --good-ink: #006300; --good-soft: #e6f5e6;
  --warn: #fab219; --warn-ink: #7a4f00; --warn-soft: #fff3d9;
  --bad: #d03b3b;  --bad-ink: #a82727; --bad-soft: #fbe8e8;
  --none: #898781; --none-ink: #52514e; --none-soft: #ecebe7;
  --p1: #2a78d6; --p2: #eb6834; --p3: #1baf7a; --p4: #eda100;
  --p5: #e87ba4; --p6: #008300; --p7: #4a3aa7; --p8: #e34948;
  --radius: 16px;
  --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 6px 20px rgba(0, 0, 0, .04);
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --tabbar-h: 60px;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #262624;
    --text: #ffffff;
    --text-2: #c3c2b7;
    --muted: #8f8d86;
    --border: rgba(255, 255, 255, .10);
    --hair: #2c2c2a;
    --accent: #3fae7a;
    --accent-ink: #06180f;
    --accent-soft: #15301f;
    --accent-text: #6fd3a2;
    --good-ink: #4cd14c; --good-soft: #142b14;
    --warn-ink: #fab219; --warn-soft: #2f2610;
    --bad-ink: #f07a7a;  --bad-soft: #361717;
    --none-ink: #c3c2b7; --none-soft: #2a2a28;
    --p1: #3987e5; --p2: #d95926; --p3: #199e70; --p4: #c98500;
    --p5: #d55181; --p6: #008300; --p7: #9085e9; --p8: #e66767;
    --shadow: none;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { margin: 0; line-height: 1.2; }
h1 { font-size: 24px; letter-spacing: -.01em; }
h2 { font-size: 17px; }
h3 { font-size: 15px; }
p { margin: 0; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.sm { width: 16px; height: 16px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- shell ---------- */
.shell { display: flex; min-height: 100vh; min-height: 100dvh; }
.sidebar { display: none; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 10px;
  padding: calc(var(--safe-t) + 10px) calc(16px + var(--safe-r)) 10px calc(16px + var(--safe-l));
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 85%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid var(--border);
}
.topbar .brand-mini { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 17px; }
.topbar h1 { font-size: 18px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.save-state { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.save-state.err { color: var(--bad-ink); }
.save-state .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.save-state.busy .dot { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.view { width: 100%; padding: 16px calc(16px + var(--safe-r)) calc(var(--tabbar-h) + var(--safe-b) + 24px) calc(16px + var(--safe-l)); }
.view > * + * { margin-top: 14px; }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex; background: var(--surface); border-top: 1px solid var(--border);
  padding: 0 var(--safe-r) var(--safe-b) var(--safe-l);
}
.tabbar button {
  flex: 1; min-height: var(--tabbar-h); border: 0; background: none; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: 11px; font-weight: 600;
}
.tabbar button .ic { width: 24px; height: 24px; }
.tabbar button[aria-current="page"] { color: var(--accent-text); }
@media (min-width: 900px) {
  .sidebar {
    display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh;
    width: 240px; flex: none; padding: 20px 14px; background: var(--surface); border-right: 1px solid var(--border);
  }
  .sidebar .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
  .sidebar .brand .logo { width: 38px; height: 38px; border-radius: 11px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 21px; }
  .sidebar .brand b { display: block; font-size: 15px; }
  .sidebar .brand span { font-size: 12px; color: var(--muted); }
  .sidebar nav button {
    width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 0; border-radius: 10px;
    background: none; color: var(--text-2); font-weight: 600; text-align: left;
  }
  .sidebar nav button:hover { background: var(--surface-2); }
  .sidebar nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent-text); }
  .sidebar .side-foot { margin-top: auto; padding: 12px; border-top: 1px solid var(--border); font-size: 13px; }
  .sidebar .side-foot b { display: block; }
  .tabbar { display: none; }
  .topbar .brand-mini { display: none; }
  .topbar { padding-left: 32px; padding-right: 32px; }
  .view { padding: 24px 32px 48px; }
}

/* ---------- building blocks ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.card.pad { padding: 16px; }
.card-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--hair); }
.card-head h2 { flex: 1; }
.card-body { padding: 16px; }
.sub { color: var(--text-2); font-size: 14px; margin-top: 4px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px;
  border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-weight: 600;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--bad-ink); }
.btn.ghost { border-color: transparent; background: none; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; filter: none; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 0; background: none; color: var(--text-2); display: grid; place-items: center; flex: none; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn:disabled { opacity: .35; }
label.field { display: block; font-size: 13px; font-weight: 600; color: var(--text-2); }
label.field + label.field { margin-top: 12px; }
.input, select.input {
  display: block; width: 100%; margin-top: 6px; min-height: 46px; padding: 10px 12px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--surface-2); font-size: 16px; /* 16px stops iOS zoom */
}
.input:focus { outline: 2px solid var(--accent); outline-offset: 1px; background: var(--surface); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grid-2 { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); align-items: start; }
.grid-2 > *, .pgrid > *, .kpis > * { min-width: 0; }
@media (min-width: 720px) { .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.pill {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
  background: var(--none-soft); color: var(--none-ink); white-space: nowrap;
}
.pill b { font-variant-numeric: tabular-nums; }
.pill.good { background: var(--good-soft); color: var(--good-ink); }
.pill.warn { background: var(--warn-soft); color: var(--warn-ink); }
.pill.bad { background: var(--bad-soft); color: var(--bad-ink); }
.pill.accent { background: var(--accent-soft); color: var(--accent-text); }
.pdot { width: 10px; height: 10px; border-radius: 50%; background: var(--pc, var(--none)); flex: none; display: inline-block; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; min-height: 38px; padding: 0 14px; border-radius: 999px; flex: none;
  border: 1px solid var(--border); background: var(--surface); color: var(--text-2); font-weight: 600; font-size: 14px;
}
.chip[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--bg); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.banner { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 12px; font-size: 14px; font-weight: 500; }
.banner.info { background: var(--accent-soft); color: var(--accent-text); }
.banner.warn { background: var(--warn-soft); color: var(--warn-ink); }
.banner.bad { background: var(--bad-soft); color: var(--bad-ink); }
.banner .grow { flex: 1 1 200px; min-width: 0; }

/* red glow for "missed N in a row" */
@keyframes glow {
  0%, 100% { box-shadow: 0 0 0 1.5px var(--bad), 0 0 0 0 rgba(208, 59, 59, 0); }
  50% { box-shadow: 0 0 0 1.5px var(--bad), 0 0 16px 3px rgba(208, 59, 59, .45); }
}
.glow { animation: glow 1.8s ease-in-out infinite; }
.glow-text { color: var(--bad-ink); font-weight: 700; }
@media (prefers-reduced-motion: reduce) { .glow { animation: none; box-shadow: 0 0 0 2px var(--bad); } }

/* ---------- segmented controls ---------- */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 14px; background: var(--surface-2); }
.seg button {
  min-height: 42px; border: 0; border-radius: 10px; background: none; color: var(--text-2);
  display: flex; align-items: center; justify-content: center; gap: 5px; font-weight: 600; font-size: 13.5px; padding: 0 4px;
}
.seg button:disabled { cursor: default; opacity: .5; }
.seg-phase button { flex-direction: column; gap: 0; min-height: 52px; font-size: 15px; }
.seg-phase button small { font-size: 12px; font-weight: 500; color: var(--muted); }
.seg-phase button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.seg-status button[aria-pressed="true"].good { background: var(--good-soft); color: var(--good-ink); box-shadow: inset 0 0 0 1.5px var(--good); }
.seg-status button[aria-pressed="true"].bad  { background: var(--bad-soft);  color: var(--bad-ink);  box-shadow: inset 0 0 0 1.5px var(--bad); }
.seg-status button[aria-pressed="true"].warn { background: var(--warn-soft); color: var(--warn-ink); box-shadow: inset 0 0 0 1.5px var(--warn); }
.seg-status button[aria-pressed="true"].none { background: var(--surface); color: var(--text); box-shadow: inset 0 0 0 1.5px var(--none); }
@media (max-width: 359px) { .seg-status .ic { display: none; } }

/* ---------- presence ---------- */
.pres-top { display: grid; gap: 10px; }
@media (min-width: 900px) { .pres-top { grid-template-columns: minmax(320px, 1fr) minmax(320px, 1fr); align-items: stretch; } }
.date-card { display: flex; align-items: center; gap: 4px; padding: 6px; }
.date-label { flex: 1; text-align: center; min-width: 0; }
.date-label .dl-rel { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--accent-text); }
.date-label .dl-main { font-size: 17px; font-weight: 700; }
.summary { padding: 14px 16px; }
.sum-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sum-top .count { flex: 1; font-size: 15px; }
.sum-top .count b { font-size: 22px; font-variant-numeric: tabular-nums; }
.progress { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin: 10px 0; display: flex; gap: 2px; }
.progress span { display: block; height: 100%; }
.progress .good { background: var(--good); } .progress .warn { background: var(--warn); }
.progress .bad { background: var(--bad); } .progress .none { background: var(--none); }
.sum-pills { display: flex; flex-wrap: wrap; gap: 6px; }
.sum-note { margin-top: 10px; font-size: 13px; color: var(--text-2); }
.pgrid { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 900px) { .pgrid { grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); } }
.pcard { overflow: hidden; }
.pc-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--hair); background: color-mix(in srgb, var(--pc) 8%, var(--surface)); }
.pc-head h3 { flex: 1; font-size: 16px; }
.pc-head .pc-count { font-size: 13px; font-weight: 700; color: var(--text-2); font-variant-numeric: tabular-nums; }
.mrow { padding: 12px 16px; }
.mrow + .mrow { border-top: 1px solid var(--hair); }
.mtop { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
.avatar {
  width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 12.5px; font-weight: 700;
  background: color-mix(in srgb, var(--pc, var(--none)) 18%, var(--surface)); color: var(--text); box-shadow: inset 0 0 0 1.5px var(--pc, var(--none));
}
.mname { flex: 1; min-width: 0; }
.mname .nm { font-weight: 650; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mname .meta { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.mrow .reason { margin-top: 8px; min-height: 42px; }
.mrow .by { margin-top: 6px; font-size: 12px; color: var(--muted); }
.mrow.locked .seg { opacity: .5; }
.alert-pill { background: var(--bad-soft); color: var(--bad-ink); }
.alert-pill.glow { box-shadow: 0 0 0 1.5px var(--bad); }

/* ---------- home ---------- */
.hello h1 { font-size: 26px; }
.step { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
.step + .step { border-top: 1px solid var(--hair); }
.step .st-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); flex: none; }
.step .st-ic.done { background: var(--good-soft); color: var(--good-ink); }
.step .st-txt { flex: 1; min-width: 0; }
.step .st-txt b { display: block; }
.step .st-txt span { font-size: 13px; color: var(--muted); }

/* ---------- stats ---------- */
.kpis { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 900px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.kpi { padding: 14px 16px; }
.kpi .k-label { font-size: 13px; color: var(--text-2); font-weight: 600; }
.kpi .k-value { font-size: 30px; font-weight: 700; letter-spacing: -.02em; margin-top: 2px; }
.kpi .k-sub { font-size: 12.5px; color: var(--muted); }
.att-list { display: grid; gap: 8px; }
.att-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); border: 0; width: 100%; text-align: left; }
.att-item .grow { flex: 1; min-width: 0; }
.att-item .grow b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.att-item .grow span { display: block; font-size: 12.5px; color: var(--text-2); }
.att-item .grow .why { display: flex; align-items: center; gap: 4px; color: var(--bad-ink); font-weight: 600; }
.att-item .grow .why.warn { color: var(--warn-ink); }
.att-item.glow { background: var(--bad-soft); }
.chart { position: relative; padding: 8px 0 0; }
.chart-plot { position: relative; height: 180px; margin-left: 38px; border-bottom: 1px solid var(--muted); display: flex; align-items: flex-end; gap: 6px; }
.chart-grid { position: absolute; left: 0; right: 0; border-top: 1px solid var(--hair); pointer-events: none; }
.chart-grid.ref { border-top: 1.5px dashed var(--warn); }
.chart-grid span { position: absolute; left: -38px; top: -8px; width: 32px; text-align: right; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chart-grid.ref span { left: auto; right: 0; width: auto; top: -18px; color: var(--warn-ink); font-weight: 600; }
.bar-col { flex: 1; min-width: 6px; max-width: 44px; height: 100%; display: flex; align-items: flex-end; position: relative; border: 0; background: none; padding: 0; }
.bar-col .bar { width: 100%; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; }
.bar-col:hover .bar, .bar-col:focus-visible .bar, .bar-col.on .bar { filter: brightness(1.15); }
.bar-col .bar-val { position: absolute; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 700; color: var(--text); white-space: nowrap; }
.chart-x { display: flex; gap: 6px; margin-left: 38px; padding-top: 6px; }
.chart-x span { flex: 1; min-width: 6px; max-width: 44px; text-align: center; font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: visible; }
.tip {
  position: absolute; z-index: 5; pointer-events: none; min-width: 170px; padding: 10px 12px; border-radius: 10px;
  background: var(--text); color: var(--bg); font-size: 12.5px; box-shadow: 0 6px 20px rgba(0, 0, 0, .2); transform: translate(-50%, -100%);
}
.tip b { display: block; font-size: 13px; margin-bottom: 2px; }
.stable { width: 100%; }
.srow {
  display: grid; align-items: center; gap: 4px 10px; padding: 10px 12px; border-radius: 12px; width: 100%; border: 0; background: none; text-align: left;
  grid-template-columns: 1fr auto; grid-template-areas: "name pct" "meta dots";
}
.srow + .srow { margin-top: 4px; }
.srow:hover { background: var(--surface-2); }
.srow .s-name { grid-area: name; min-width: 0; display: flex; align-items: center; gap: 8px; font-weight: 650; }
.srow .s-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow .s-pct { grid-area: pct; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.srow .s-meta { grid-area: meta; font-size: 12.5px; color: var(--text-2); display: flex; gap: 10px; flex-wrap: wrap; }
.srow .s-dots { grid-area: dots; display: flex; gap: 3px; justify-content: flex-end; }
.srow .s-col { display: none; }
.srow.head { display: none; }
.srow.glow { background: var(--bad-soft); }
.hdot { width: 10px; height: 10px; border-radius: 3px; background: var(--hair); }
.hdot.present { background: var(--good); }
.hdot.late { background: var(--warn); }
.hdot.absent { background: var(--bad); }
.pct-low { color: var(--bad-ink); }
.pct-warn { color: var(--warn-ink); }
@media (min-width: 900px) {
  .srow {
    grid-template-columns: minmax(180px, 2.2fr) minmax(90px, 1fr) 80px 70px 110px 60px 90px 120px;
    grid-template-areas: none; gap: 10px;
  }
  .srow .s-name, .srow .s-pct, .srow .s-dots { grid-area: auto; }
  .srow .s-meta { display: none; }

  .srow.head { display: grid; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding-top: 0; }
  .srow.head:hover { background: none; }
}
.ttable { width: 100%; border-collapse: collapse; font-size: 14px; }
.ttable th, .ttable td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--hair); vertical-align: top; }
.ttable th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.ttable td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.reason-list { display: grid; gap: 6px; margin-top: 8px; }
.reason-list div { display: flex; gap: 8px; align-items: baseline; font-size: 14px; }
.reason-list div .muted { font-size: 13px; }

/* ---------- admin ---------- */
.rep { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
.rep + .rep { border-top: 1px solid var(--hair); }
.rep .grow { flex: 1; min-width: 0; }
.rep .grow b { display: block; }
.rep .tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
.check-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin-top: 8px; }
.check { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); font-weight: 600; font-size: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.diff { display: grid; gap: 10px; margin-top: 12px; }
.diff ul { margin: 6px 0 0; padding-left: 18px; font-size: 14px; }
details.card > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary::after { content: "›"; margin-left: auto; font-size: 22px; color: var(--muted); transition: transform .2s; }
details.card[open] > summary::after { transform: rotate(90deg); }

/* ---------- auth ---------- */
.auth { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: calc(var(--safe-t) + 24px) 16px calc(var(--safe-b) + 24px); }
.auth-card { width: 100%; max-width: 400px; padding: 28px 22px; }
.auth-card .logo { width: 56px; height: 56px; border-radius: 16px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 30px; margin-bottom: 16px; }

.auth-card .btn { margin-top: 18px; }

.loading { min-height: 100vh; display: grid; place-items: center; color: var(--muted); }
.spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--hair); border-top-color: var(--accent); animation: spin .8s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- modal & toast ---------- */
.modal-wrap { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .4); display: flex; align-items: flex-end; justify-content: center; opacity: 0; transition: opacity .2s; }
.modal-wrap.open { opacity: 1; }
.modal {
  width: 100%; max-height: 88vh; overflow: auto; background: var(--surface); border-radius: 20px 20px 0 0;
  padding: 20px 18px calc(18px + var(--safe-b)); transform: translateY(24px); transition: transform .2s;
}
.modal-wrap.open .modal { transform: none; }
.modal h2 { font-size: 19px; margin-bottom: 4px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }
.modal-actions .spacer { flex: 1; }
@media (min-width: 640px) {
  .modal-wrap { align-items: center; }
  .modal { max-width: 520px; border-radius: 20px; padding: 24px; }
  .modal.wide { max-width: 760px; }
}
#toast {
  position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + var(--safe-b) + 16px); z-index: 60; transform: translate(-50%, 20px);
  max-width: calc(100% - 32px); padding: 12px 16px; border-radius: 12px; background: var(--text); color: var(--bg); font-size: 14px; font-weight: 600;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.bad { background: var(--bad); color: #fff; }
@media (min-width: 900px) { #toast { bottom: 24px; } }
</style>

<body>
<div id="app"><div class="loading"><div><div class="spinner"></div>Loading…</div></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
// Optional: when this page is hosted outside Apps Script (e.g. GitHub Pages),
// put the web app URL here so it talks to the backend through doPost.
window.HP_API_URL = window.HP_API_URL || '';
</script>

<script>
(function () {
'use strict';

// =================================================================== helpers
const $ = (sel, el) => (el || document).querySelector(sel);
const $$ = (sel, el) => Array.from((el || document).querySelectorAll(sel));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* storage blocked */ } },
};

const ICONS = {
  home: '<path d="M3.5 10.5 12 3.5l8.5 7V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"/>',
  presence: '<rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 3.5h6v2H9zM9 13l2 2 4-4"/>',
  stats: '<path d="M5 20v-7M11 20V5M17 20v-10M3 20h18"/>',
  admin: '<path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  x: '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
  clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  question: '<circle cx="12" cy="12" r="8.5"/><path d="M9.7 9.6a2.4 2.4 0 1 1 3.3 2.2c-.6.3-1 .8-1 1.5v.3M12 16.7v.1"/>',
  left: '<path d="M14.5 6l-6 6 6 6"/>',
  right: '<path d="M9.5 6l6 6-6 6"/>',
  refresh: '<path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5V9H15"/>',
  logout: '<path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M10 16l-4-4 4-4M6 12h10"/>',
  alert: '<path d="M12 4 2.8 19.5h18.4zM12 10v4.2M12 17.2v.1"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  calendar: '<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  download: '<path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/>',
};
const icon = (name, cls) => '<svg class="ic ' + (cls || '') + '" viewBox="0 0 24 24" aria-hidden="true">' + ICONS[name] + '</svg>';

const pad = (n) => String(n).padStart(2, '0');
const isoOf = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseIso = (s) => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const addDays = (s, n) => { const d = parseIso(s); d.setDate(d.getDate() + n); return isoOf(d); };
const todayIso = () => isoOf(new Date());
const fmtDate = (s, opts) => parseIso(s).toLocaleDateString('en-GB', opts);
const fmtLong = (s) => fmtDate(s, { weekday: 'long', day: 'numeric', month: 'long' });
const fmtShort = (s) => fmtDate(s, { day: 'numeric', month: 'short' });
const fmtMed = (s) => fmtDate(s, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
function nearestSaturday(s) { const d = parseIso(s); return addDays(s, (6 - d.getDay() + 7) % 7); }
function defaultMeeting() {
  const t = todayIso();
  const day = parseIso(t).getDay();
  if (day === 6) return { date: t, phase: 'sat' };
  if (day === 0) return { date: addDays(t, -1), phase: 'sat' };   // Sunday: finish yesterday's report
  return { date: nearestSaturday(t), phase: 'wed' };
}
function relLabel(s) {
  const diff = Math.round((parseIso(s) - parseIso(todayIso())) / 86400000);
  if (diff === 0) return 'Today';
  if (diff > 0 && diff < 7) return 'This Saturday';
  if (diff < 0 && diff > -7) return 'Last Saturday';
  const w = Math.round(Math.abs(diff) / 7);
  return diff > 0 ? 'In ' + w + ' weeks' : w + ' weeks ago';
}
function ago(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const s = (Date.now() - d.getTime()) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + ' min ago';
  const time = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  if (isoOf(d) === todayIso()) return 'today ' + time;
  return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }) + ' ' + time;
}
const initials = (name) => name.split(' ').filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const firstName = (name) => String(name || '').split(' ')[0];
const pctText = (p) => (p == null ? '–' : Math.round(p) + '%');
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : (many || one + 's'));

let toastTimer;
function toast(msg, kind) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'show ' + (kind || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = kind || ''; }, kind === 'bad' ? 5000 : 2600);
}

// =================================================================== statuses
const PHASES = {
  wed: [
    { k: 'coming', label: 'Coming', short: 'In', icon: 'check', tone: 'good' },
    { k: 'out', label: 'Not coming', short: 'Out', icon: 'x', tone: 'bad', reason: true },
    { k: 'late', label: 'Coming late', short: 'Late', icon: 'clock', tone: 'warn', reason: true },
    { k: 'noreply', label: 'No reply', short: 'No reply', icon: 'question', tone: 'none' },
  ],
  sat: [
    { k: 'present', label: 'Present', short: 'Present', icon: 'check', tone: 'good' },
    { k: 'absent', label: 'Absent', short: 'Absent', icon: 'x', tone: 'bad', reason: true },
    { k: 'late', label: 'Came late', short: 'Late', icon: 'clock', tone: 'warn', reason: true },
  ],
};
const statusMeta = (phase, k) => PHASES[phase].find(o => o.k === k);

// =================================================================== api
function call(action, payload) {
  const req = { action: action, payload: payload || {}, token: S.token };
  const done = (res) => {
    if (res && res.ok) return res.data;
    const err = new Error((res && res.error) || 'Unknown error');
    err.server = true;
    throw err;
  };
  if (window.google && google.script && google.script.run) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler((res) => { try { resolve(done(res)); } catch (e) { reject(e); } })
        .withFailureHandler((e) => reject(new Error((e && e.message) || 'Network error')))
        .api(req);
    });
  }
  if (window.HP_API_URL) {
    return fetch(window.HP_API_URL, { method: 'POST', body: JSON.stringify(req), headers: { 'Content-Type': 'text/plain;charset=utf-8' } })
      .then(r => r.json()).then(done);
  }
  return window.HPMock.api(req).then(done);
}

// =================================================================== state
const S = {
  token: store.get('hp.token'),
  boot: null,
  data: null,
  tab: store.get('hp.tab') || 'home',
  presence: { date: null, phase: null, patrol: 'all' },
  stats: { patrol: 'all', sort: 'pct', meeting: null },
  pending: new Map(),
  inflight: false,
  saveError: null,
  loadedAt: 0,
};

function indexData() {
  const D = S.data;
  S.att = new Map();
  D.attendance.forEach(a => S.att.set(a.date + '|' + a.memberId, a));
  S.patrolIdx = new Map(D.patrols.map((p, i) => [p, i]));
  S.meetingByDate = new Map(D.meetings.map(m => [m.date, m]));
  S.statsCache = null;
}
const isAdmin = () => S.data.me.role === 'admin';
const patrolColor = (p) => 'var(--p' + (((S.patrolIdx.get(p) || 0) % 8) + 1) + ')';
const patrolRank = (p) => (S.patrolIdx.has(p) ? S.patrolIdx.get(p) : 99);
function myPatrols() {
  const me = S.data.me;
  if (me.role === 'admin' || !me.patrols.length) return S.data.patrols.slice();
  return S.data.patrols.filter(p => me.patrols.indexOf(p) >= 0);
}
function activeMembers(patrols) {
  return S.data.members
    .filter(m => m.active && (!patrols || patrols.indexOf(m.patrol) >= 0))
    .sort((a, b) => (patrolRank(a.patrol) - patrolRank(b.patrol)) || (a.order - b.order));
}
const rec = (date, id) => S.att.get(date + '|' + id);
const isCancelled = (date) => !!(S.meetingByDate.get(date) || {}).cancelled;

// =================================================================== statistics
/** Everything the Stats tab and the alerts need, from raw attendance. */
function computeStats() {
  if (S.statsCache) return S.statsCache;
  const set = S.data.settings;
  const today = todayIso();
  const heldSet = new Set();
  S.data.attendance.forEach(a => {
    if (a.satStatus && a.date >= set.seasonStart && a.date <= today && !isCancelled(a.date)) heldSet.add(a.date);
  });
  const held = Array.from(heldSet).sort();
  const tracking = held.length >= set.minMeetings;
  const byId = new Map();
  const rows = activeMembers().map(m => {
    const hist = held.map(d => { const r = rec(d, m.id) || {}; return { date: d, wed: r.wedStatus || '', sat: r.satStatus || '', satReason: r.satReason || '' }; });
    const done = hist.filter(x => x.sat);
    const attended = done.filter(x => x.sat !== 'absent').length;
    let absStreak = 0;
    for (let i = done.length - 1; i >= 0 && done[i].sat === 'absent'; i--) absStreak++;
    let inStreak = 0;
    for (let i = done.length - 1; i >= 0 && done[i].sat !== 'absent'; i--) inStreak++;
    const promised = done.filter(x => x.wed === 'coming' || x.wed === 'late');
    const pct = done.length ? (attended / done.length) * 100 : null;
    const pctLevel = !tracking || pct == null ? '' : pct < set.lowPct ? 'low' : pct < set.warnPct ? 'warn' : '';
    const row = {
      m: m, hist: hist, recorded: done.length, attended: attended,
      late: done.filter(x => x.sat === 'late').length, absent: done.length - attended,
      absStreak: absStreak, inStreak: inStreak, pct: pct, pctLevel: pctLevel,
      streakAlert: absStreak >= set.streakAlert,
      promised: promised.length, broken: promised.filter(x => x.sat === 'absent').length,
      noreply: hist.filter(x => x.wed === 'noreply').length,
    };
    byId.set(m.id, row);
    return row;
  });
  S.statsCache = { held: held, tracking: tracking, rows: rows, byId: byId };
  return S.statsCache;
}
const needsAttention = (r) => r.streakAlert || r.pctLevel === 'low' || r.pctLevel === 'warn';
function alertText(r) {
  const parts = [];
  if (r.streakAlert) parts.push('Missed ' + r.absStreak + ' in a row');
  if (r.pctLevel) parts.push(pctText(r.pct) + ' attendance');
  return parts.join(' · ');
}

// =================================================================== saving
let flushTimer = null;
function setAnswer(date, memberId, phase, status, reason) {
  const key = date + '|' + memberId;
  let r = S.att.get(key);
  if (!r) {
    r = { date: date, memberId: memberId, wedStatus: '', wedReason: '', wedBy: '', wedAt: '', satStatus: '', satReason: '', satBy: '', satAt: '' };
    S.att.set(key, r);
    S.data.attendance.push(r);
  }
  const meta = statusMeta(phase, status);
  r[phase + 'Status'] = status;
  r[phase + 'Reason'] = meta && meta.reason ? reason : '';
  r[phase + 'By'] = status ? S.data.me.name : '';
  r[phase + 'At'] = status ? new Date().toISOString() : '';
  S.statsCache = null;
  S.pending.set(key + '|' + phase, { date: date, memberId: memberId, phase: phase, status: status, reason: r[phase + 'Reason'] });
  scheduleFlush(700);
}
function scheduleFlush(delay) {
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flush, delay);
  showSaveState();
}
async function flush() {
  if (S.inflight || !S.pending.size) return;
  S.inflight = true;
  const batch = Array.from(S.pending.values());
  S.pending.clear();
  showSaveState();
  let retry = false;
  try {
    const res = await call('saveAttendance', { entries: batch });
    res.rows.forEach(row => {
      const key = row.date + '|' + row.memberId;
      const local = S.att.get(key);
      if (!local) return;
      ['wed', 'sat'].forEach(ph => {
        if (S.pending.has(key + '|' + ph)) return;   // newer local edit waiting
        ['Status', 'Reason', 'By', 'At'].forEach(f => { local[ph + f] = row[ph + f]; });
      });
    });
    S.saveError = null;
  } catch (e) {
    if (e.message === 'AUTH') { logout(); return; }
    if (e.server) {
      // Refused by the server (e.g. no meeting that day): drop it and resync.
      toast(e.message, 'bad');
      S.saveError = null;
      refresh();
    } else {
      batch.forEach(b => {
        const k = b.date + '|' + b.memberId + '|' + b.phase;
        if (!S.pending.has(k)) S.pending.set(k, b);
      });
      S.saveError = e.message;
      retry = true;
    }
  } finally {
    S.inflight = false;
    showSaveState();
    if (S.pending.size) scheduleFlush(retry ? 5000 : 300);
  }
}
let savedTimer;
function showSaveState() {
  const el = $('#saveState');
  if (!el) return;
  clearTimeout(savedTimer);
  if (S.saveError && S.pending.size) {
    el.className = 'save-state err busy';
    el.innerHTML = '<span class="dot"></span>Not saved – retrying';
  } else if (S.pending.size || S.inflight) {
    el.className = 'save-state busy';
    el.innerHTML = '<span class="dot"></span>Saving…';
  } else {
    el.className = 'save-state';
    el.innerHTML = icon('check', 'sm') + 'Saved';
    savedTimer = setTimeout(() => { el.innerHTML = ''; }, 2500);
  }
}
window.addEventListener('beforeunload', (e) => {
  if (S.pending.size || S.inflight) { e.preventDefault(); e.returnValue = ''; }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { flush(); return; }
  if (S.data && !S.pending.size && !S.inflight && Date.now() - S.loadedAt > 60000) refresh(true);
});

// =================================================================== modal
function openModal(html, opts) {
  opts = opts || {};
  const wrap = document.createElement('div');
  wrap.className = 'modal-wrap';
  wrap.innerHTML = '<div class="modal ' + (opts.wide ? 'wide' : '') + '" role="dialog" aria-modal="true">' + html + '</div>';
  document.body.appendChild(wrap);
  requestAnimationFrame(() => wrap.classList.add('open'));
  let closed = false;
  const close = () => {
    if (closed) return;
    closed = true;
    wrap.classList.remove('open');
    setTimeout(() => wrap.remove(), 200);
    document.removeEventListener('keydown', onKey);
    if (opts.onClose) opts.onClose();
  };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  wrap.addEventListener('click', (e) => { if (e.target === wrap || e.target.closest('[data-close]')) close(); });
  if (opts.onMount) opts.onMount(wrap.firstChild, close);
  return close;
}
function confirmBox(title, text, okLabel, danger) {
  return new Promise((resolve) => {
    let answered = false;
    openModal('<h2>' + esc(title) + '</h2><p class="sub">' + text + '</p><div class="modal-actions"><button class="btn" data-close>Cancel</button><button class="btn ' + (danger ? 'danger' : 'primary') + '" data-ok>' + esc(okLabel) + '</button></div>', {
      onMount: (m, close) => { $('[data-ok]', m).onclick = () => { answered = true; close(); resolve(true); }; },
      onClose: () => { if (!answered) resolve(false); },
    });
  });
}

// =================================================================== boot & auth
const app = $('#app');

async function start() {
  try {
    if (window.HPMockReady) await window.HPMockReady;
    S.boot = await call('bootstrap');
  } catch (e) {
    app.innerHTML = '<div class="auth"><div class="card auth-card"><h1>Cannot reach the app</h1><p class="sub">' + esc(e.message) + '</p><button class="btn primary block" onclick="location.reload()">Try again</button></div></div>';
    return;
  }
  if (S.boot.needsSetup) return renderSetup();
  if (!S.token) return renderLogin();
  await loadState();
}

async function loadState() {
  try {
    S.data = await call('state');
  } catch (e) {
    if (e.message === 'AUTH') return logout();
    app.innerHTML = '<div class="auth"><div class="card auth-card"><h1>Something went wrong</h1><p class="sub">' + esc(e.message) + '</p><button class="btn primary block" onclick="location.reload()">Try again</button></div></div>';
    return;
  }
  S.loadedAt = Date.now();
  indexData();
  renderShell();
  go(S.tab);
  announceMembersSync();
}

/** quiet = background refresh. The ↻ button (not quiet) also checks the Drive members file now. */
async function refresh(quiet) {
  if (S.pending.size || S.inflight) { await flush(); }
  try {
    S.data = await call('state', quiet ? {} : { sync: true });
    S.loadedAt = Date.now();
    indexData();
    go(S.tab, true);
    if (!announceMembersSync() && !quiet) toast('Up to date');
  } catch (e) {
    if (e.message === 'AUTH') return logout();
    if (!quiet) toast(e.message, 'bad');
  }
}

/** Tells the user when the members list was just re-imported from Drive. */
function announceMembersSync() {
  const s = S.data && S.data.membersSync;
  if (!s) return false;
  const parts = [];
  if (s.added.length) parts.push('+' + s.added.length + ' new');
  if (s.removed.length) parts.push(s.removed.length + ' removed');
  if (s.moved.length) parts.push(s.moved.length + ' changed patrol');
  toast('Members list updated from Drive' + (parts.length ? ': ' + parts.join(', ') : ''));
  return true;
}

function logout() {
  S.token = null;
  S.data = null;
  store.set('hp.token', null);
  S.pending.clear();
  call('bootstrap').then(b => { S.boot = b; renderLogin(); }).catch(() => renderLogin());
}

function authFrame(inner) {
  return '<div class="auth"><div class="card auth-card"><div class="logo" aria-hidden="true">⚜</div>' + inner + '</div></div>';
}

function renderLogin() {
  const last = store.get('hp.lastName') || '';
  app.innerHTML = authFrame(
    '<h1>' + esc(S.boot.teamName) + '</h1><p class="sub">Sign in to report who comes on Saturday.</p>' +
    '<form id="loginForm" autocomplete="on">' +
    '<label class="field">Your full name<input class="input" id="lgName" autocomplete="username" autocapitalize="words" autocorrect="off" spellcheck="false" required maxlength="60" placeholder="First and last name" value="' + esc(last) + '"></label>' +
    '<label class="field">PIN<input class="input" id="lgPin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="current-password" required></label>' +
    '<button class="btn primary block" type="submit">Sign in</button><p class="err" id="lgErr"></p></form>');
  if (last) $('#lgPin').focus();
  $('#loginForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = $('#loginForm button');
    btn.disabled = true;
    $('#lgErr').textContent = '';
    try {
      const name = $('#lgName').value.trim();
      const res = await call('login', { name: name, pin: $('#lgPin').value });
      S.token = res.token;
      store.set('hp.token', res.token);
      store.set('hp.lastName', name);
      app.innerHTML = '<div class="loading"><div><div class="spinner"></div>Loading…</div></div>';
      await loadState();
    } catch (err) {
      $('#lgErr').textContent = err.message;
      btn.disabled = false;
    }
  };
}

function renderSetup() {
  app.innerHTML = authFrame(
    '<h1>Welcome</h1><p class="sub">First time here. Create the chief account. Only the chief can see the statistics and manage the app.</p>' +
    '<form id="setupForm">' +
    '<label class="field">Your name<input class="input" id="suName" autocomplete="name" required maxlength="60"></label>' +
    '<label class="field">Choose a PIN (4–8 digits)<input class="input" id="suPin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="new-password" required></label>' +
    '<label class="field">Repeat the PIN<input class="input" id="suPin2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="new-password" required></label>' +
    '<label class="field">Link of your members file in Google Drive<input class="input" id="suSrc" inputmode="url" autocomplete="off" placeholder="https://docs.google.com/spreadsheets/d/…"></label>' +
    '<p class="muted small" style="margin-top:6px">The app stays connected to this file: when you change it in Drive, the app updates by itself.</p>' +
    '<button class="btn primary block" type="submit">Create chief account</button><p class="err" id="suErr"></p></form>');
  $('#setupForm').onsubmit = async (e) => {
    e.preventDefault();
    if ($('#suPin').value !== $('#suPin2').value) { $('#suErr').textContent = 'The two PINs are different.'; return; }
    const btn = $('#setupForm button');
    btn.disabled = true;
    btn.textContent = 'Connecting to Drive…';
    try {
      const res = await call('setup', { name: $('#suName').value, pin: $('#suPin').value, sourceUrl: $('#suSrc').value.trim() });
      S.token = res.token;
      store.set('hp.token', res.token);
      S.tab = 'admin';
      await loadState();
      if (res.importError) toast('Members file: ' + res.importError, 'bad');
      else if (S.data.members.length) toast(S.data.members.length + ' scouts loaded from Drive');
    } catch (err) {
      $('#suErr').textContent = err.message;
      btn.disabled = false;
      btn.textContent = 'Create chief account';
    }
  };
}

// =================================================================== shell & tabs
// Add new sections of the app here: { id, label, icon, render(viewEl), admin? }.
const TABS = [
  { id: 'home', label: 'Home', icon: 'home', render: renderHome },
  { id: 'presence', label: 'Presence', icon: 'presence', render: renderPresence },
  { id: 'stats', label: 'Stats', icon: 'stats', render: renderStats, admin: true },
  { id: 'admin', label: 'Admin', icon: 'admin', render: renderAdmin, admin: true },
];
const visibleTabs = () => TABS.filter(t => !t.admin || isAdmin());

function renderShell() {
  const me = S.data.me;
  const nav = visibleTabs().map(t => '<button data-tab="' + t.id + '">' + icon(t.icon) + '<span>' + t.label + '</span></button>').join('');
  app.innerHTML =
    '<div class="shell">' +
      '<aside class="sidebar">' +
        '<div class="brand"><div class="logo" aria-hidden="true">⚜</div><div><b>' + esc(S.data.settings.teamName) + '</b><span>HP App</span></div></div>' +
        '<nav>' + nav + '</nav>' +
        '<div class="side-foot"><b>' + esc(me.name) + '</b><span class="muted">' + (me.role === 'admin' ? 'Chief' : 'Reporter') + '</span>' +
          '<button class="btn ghost sm" data-act="logout" style="margin-top:8px;padding-left:0">' + icon('logout', 'sm') + 'Sign out</button></div>' +
      '</aside>' +
      '<div class="main">' +
        '<header class="topbar"><div class="brand-mini" aria-hidden="true">⚜</div><h1 id="tbTitle"></h1>' +
          '<span id="saveState" class="save-state" aria-live="polite"></span>' +
          '<button class="icon-btn" data-act="refresh" aria-label="Refresh">' + icon('refresh') + '</button></header>' +
        '<main class="view" id="view"></main>' +
      '</div>' +
      '<nav class="tabbar">' + nav + '</nav>' +
    '</div>';
  $$('[data-tab]').forEach(b => { b.onclick = () => go(b.dataset.tab); });
  $$('[data-act="logout"]').forEach(b => { b.onclick = logout; });
  $('[data-act="refresh"]').onclick = () => refresh();
}

function go(tabId, keepScroll) {
  const tabs = visibleTabs();
  const tab = tabs.find(t => t.id === tabId) || tabs[0];
  S.tab = tab.id;
  store.set('hp.tab', tab.id);
  $$('[data-tab]').forEach(b => { if (b.dataset.tab === tab.id) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  $('#tbTitle').textContent = tab.id === 'home' ? S.data.settings.teamName : tab.label;
  const y = window.scrollY;
  const view = $('#view');
  view.innerHTML = '';
  tab.render(view);
  window.scrollTo(0, keepScroll ? y : 0);
}

// =================================================================== HOME
function renderHome(v) {
  const me = S.data.me;
  const patrols = myPatrols();
  const members = activeMembers(patrols);
  const next = nearestSaturday(todayIso());
  const last = addDays(next, -7);
  const filled = (date, phase) => members.filter(m => (rec(date, m.id) || {})[phase + 'Status']).length;
  const step = (date, phase, title) => {
    const n = filled(date, phase);
    const done = n === members.length && members.length > 0;
    return '<div class="step"><div class="st-ic ' + (done ? 'done' : '') + '">' + icon(done ? 'check' : phase === 'wed' ? 'calendar' : 'presence') + '</div>' +
      '<div class="st-txt"><b>' + title + '</b><span>' + n + ' of ' + members.length + ' scouts filled</span></div>' +
      '<button class="btn sm ' + (done ? '' : 'primary') + '" data-go="' + date + '|' + phase + '">' + (done ? 'Review' : 'Fill in') + '</button></div>';
  };
  const lastMissing = members.length - filled(last, 'sat');

  let html =
    '<div class="hello"><h1>Hi ' + esc(firstName(me.name)) + '</h1><p class="sub">' +
      (me.role === 'admin' ? 'Chief · all patrols' : 'Reporter · ' + (me.patrols.length ? esc(patrols.join(', ')) : 'all patrols')) + '</p></div>';

  if (!S.data.members.length) {
    html += '<div class="banner warn">' + icon('alert') + '<span class="grow">No scouts loaded yet.' + (isAdmin() ? ' Go to Admin and import the members list from Drive.' : ' Ask the chief to import the members list.') + '</span>' +
      (isAdmin() ? '<button class="btn sm" data-tab-go="admin">Admin</button>' : '') + '</div>';
  }

  html += '<div class="grid-2">';
  html += '<section class="card"><div class="card-head"><h2>' + esc(fmtLong(next)) + '</h2><span class="pill accent">' + relLabel(next) + '</span></div><div class="card-body" style="padding-top:4px;padding-bottom:4px">' +
    (isCancelled(next) ? '<p class="empty">No meeting this Saturday.</p>' : step(next, 'wed', 'Wednesday · who is coming?') + step(next, 'sat', 'Saturday · who came?')) + '</div></section>';

  if (lastMissing > 0 && !isCancelled(last) && last >= S.data.settings.seasonStart) {
    html += '<section class="card"><div class="card-head"><h2>' + esc(fmtLong(last)) + '</h2><span class="pill warn">' + plural(lastMissing, 'scout') + ' not marked</span></div><div class="card-body" style="padding-top:4px;padding-bottom:4px">' +
      step(last, 'sat', 'Saturday · who came?') + '</div></section>';
  }

  const stats = computeStats();
  const alerts = stats.rows.filter(r => patrols.indexOf(r.m.patrol) >= 0 && needsAttention(r))
    .sort((a, b) => (b.absStreak - a.absStreak) || ((a.pct || 0) - (b.pct || 0)));
  html += '<section class="card"><div class="card-head"><h2>Needs attention</h2>' + (alerts.length ? '<span class="pill bad">' + alerts.length + '</span>' : '') + '</div><div class="card-body">' +
    (alerts.length ? '<div class="att-list">' + alerts.slice(0, 6).map(attItem).join('') + '</div>' +
      (alerts.length > 6 && isAdmin() ? '<button class="btn block" style="margin-top:12px" data-tab-go="stats">See all ' + alerts.length + '</button>' : '')
      : '<p class="muted">Nobody missed ' + S.data.settings.streakAlert + ' Saturdays in a row' + (stats.tracking ? ' or has low attendance.' : '. Percentages start after ' + S.data.settings.minMeetings + ' meetings (' + stats.held.length + ' so far).') + '</p>') +
    '</div></section>';
  html += '</div>';

  html += '<div class="row" style="justify-content:space-between"><span class="muted small">Signed in as ' + esc(me.name) + '</span><button class="btn sm" data-act="logout2">' + icon('logout', 'sm') + 'Sign out</button></div>';
  v.innerHTML = html;

  $$('[data-go]', v).forEach(b => {
    b.onclick = () => {
      const parts = b.dataset.go.split('|');
      S.presence.date = parts[0];
      S.presence.phase = parts[1];
      go('presence');
    };
  });
  $$('[data-tab-go]', v).forEach(b => { b.onclick = () => go(b.dataset.tabGo); });
  $$('[data-member]', v).forEach(b => { b.onclick = () => openMemberHistory(b.dataset.member); });
  $('[data-act="logout2"]', v).onclick = logout;
}

function attItem(r) {
  return '<button class="att-item ' + (r.streakAlert ? 'glow' : '') + '" data-member="' + esc(r.m.id) + '" style="--pc:' + patrolColor(r.m.patrol) + '">' +
    '<span class="avatar">' + esc(initials(r.m.name)) + '</span>' +
    '<span class="grow"><b>' + esc(r.m.name) + '</b><span class="why ' + (r.streakAlert || r.pctLevel === 'low' ? '' : 'warn') + '">' + icon('alert', 'sm') + esc(alertText(r)) + '</span></span>' +
    '<span class="muted small">' + esc(r.m.patrol) + '</span></button>';
}

// =================================================================== PRESENCE
function renderPresence(v) {
  const P = S.presence;
  if (!P.date) Object.assign(P, defaultMeeting());
  const patrols = myPatrols();
  if (P.patrol !== 'all' && patrols.indexOf(P.patrol) < 0) P.patrol = 'all';

  v.innerHTML =
    '<div class="pres-top">' +
      '<div class="card date-card">' +
        '<button class="icon-btn" data-step="-7" aria-label="Previous Saturday">' + icon('left') + '</button>' +
        '<div class="date-label"><div class="dl-rel">' + relLabel(P.date) + '</div><div class="dl-main">' + esc(fmtLong(P.date)) + '</div></div>' +
        '<button class="icon-btn" data-step="7" aria-label="Next Saturday">' + icon('right') + '</button>' +
      '</div>' +
      '<div class="seg seg-phase" role="tablist">' +
        '<button role="tab" data-phase="wed" aria-selected="' + (P.phase === 'wed') + '">Wednesday<small>Who is coming?</small></button>' +
        '<button role="tab" data-phase="sat" aria-selected="' + (P.phase === 'sat') + '">Saturday<small>Who came?</small></button>' +
      '</div>' +
    '</div>' +
    '<div id="presBanner"></div>' +
    (patrols.length > 1 ? '<div class="chips">' + ['all'].concat(patrols).map(p =>
      '<button class="chip" data-patrol="' + esc(p) + '" aria-pressed="' + (P.patrol === p) + '" style="--pc:' + (p === 'all' ? 'var(--none)' : patrolColor(p)) + '">' +
      (p === 'all' ? 'All patrols' : '<span class="pdot"></span>' + esc(p)) + '</button>').join('') + '</div>' : '') +
    '<div class="card summary" id="presSummary"></div>' +
    '<div class="pgrid" id="presList"></div>';

  $$('[data-step]', v).forEach(b => { b.onclick = () => { P.date = addDays(P.date, Number(b.dataset.step)); renderPresence(v); }; });
  $$('[data-phase]', v).forEach(b => { b.onclick = () => { P.phase = b.dataset.phase; renderPresence(v); }; });
  $$('[data-patrol]', v).forEach(b => { b.onclick = () => { P.patrol = b.dataset.patrol; renderPresence(v); }; });

  const list = $('#presList', v);
  list.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-st]');
    if (!btn || btn.disabled) return;
    const row = btn.closest('.mrow');
    const id = row.dataset.id;
    const cur = (rec(P.date, id) || {})[P.phase + 'Status'] || '';
    const next = cur === btn.dataset.st ? '' : btn.dataset.st;   // tap again to clear
    const input = $('.reason', row);
    setAnswer(P.date, id, P.phase, next, input ? input.value : ((rec(P.date, id) || {})[P.phase + 'Reason'] || ''));
    redrawRow(id);
    drawSummary();
  });
  const reasonTimers = {};
  list.addEventListener('input', (e) => {
    if (!e.target.classList.contains('reason')) return;
    const id = e.target.closest('.mrow').dataset.id;
    const value = e.target.value;
    const date = P.date;
    const phase = P.phase;
    clearTimeout(reasonTimers[id]);
    reasonTimers[id] = setTimeout(() => {
      const r = rec(date, id) || {};
      if (r[phase + 'Status']) setAnswer(date, id, phase, r[phase + 'Status'], value);
    }, 600);
  });

  drawBanner();
  drawSummary();
  drawList();
}

function presenceMembers() {
  const P = S.presence;
  const patrols = P.patrol === 'all' ? myPatrols() : [P.patrol];
  return activeMembers(patrols);
}
function presenceLocked() {
  return isCancelled(S.presence.date) && !isAdmin();
}

function drawBanner() {
  const P = S.presence;
  const el = $('#presBanner');
  const m = S.meetingByDate.get(P.date);
  let html = '';
  if (m && m.cancelled) {
    html = '<div class="banner bad">' + icon('calendar') + '<span class="grow"><b>No meeting this Saturday</b>' + (m.note ? ' — ' + esc(m.note) : '') + '</span>' +
      (isAdmin() ? '<button class="btn sm" data-meeting="open">Undo</button>' : '') + '</div>';
  } else if (P.phase === 'sat' && P.date > todayIso()) {
    html = '<div class="banner warn">' + icon('clock') + '<span class="grow">This Saturday has not happened yet. Fill this after the meeting.</span></div>';
  } else if (P.date < S.data.settings.seasonStart) {
    html = '<div class="banner warn">' + icon('alert') + '<span class="grow">This date is before the season start (' + esc(fmtShort(S.data.settings.seasonStart)) + ') and is not counted in the stats.</span></div>';
  }
  el.innerHTML = html;
  el.classList.toggle('hidden', !html);
  const undo = $('[data-meeting="open"]', el);
  if (undo) undo.onclick = () => setMeetingCancelled(P.date, false, '');
}

async function setMeetingCancelled(date, cancelled, note) {
  try {
    const res = await call('setMeeting', { date: date, cancelled: cancelled, note: note });
    S.data.meetings = res.meetings;
    indexData();
    go(S.tab, true);
    toast(cancelled ? 'Marked as no meeting' : 'Meeting is back on');
  } catch (e) { toast(e.message, 'bad'); }
}

function drawSummary() {
  const P = S.presence;
  const members = presenceMembers();
  const opts = PHASES[P.phase];
  const counts = {};
  opts.forEach(o => { counts[o.k] = 0; });
  let filled = 0;
  members.forEach(m => {
    const st = (rec(P.date, m.id) || {})[P.phase + 'Status'];
    if (st) { filled++; counts[st]++; }
  });
  const missing = members.length - filled;
  const total = members.length || 1;
  let html = '<div class="sum-top"><div class="count"><b>' + filled + '</b> of ' + members.length + ' filled</div>';
  if (missing > 0 && !presenceLocked()) {
    html += P.phase === 'wed'
      ? '<button class="btn sm" data-bulk="noreply">' + icon('question', 'sm') + 'Rest = No reply</button>'
      : '<button class="btn sm" data-bulk="present">' + icon('check', 'sm') + 'Rest = Present</button>';
  }
  html += '</div><div class="progress" role="img" aria-label="' + filled + ' of ' + members.length + ' filled">' +
    opts.map(o => counts[o.k] ? '<span class="' + o.tone + '" style="width:' + (counts[o.k] / total * 100) + '%"></span>' : '').join('') + '</div>' +
    '<div class="sum-pills">' + opts.map(o => '<span class="pill ' + o.tone + '">' + icon(o.icon, 'sm') + o.label + ' <b>' + counts[o.k] + '</b></span>').join('') +
    (missing ? '<span class="pill">Not filled <b>' + missing + '</b></span>' : '') + '</div>';

  if (P.phase === 'sat') {
    const w = { coming: 0, late: 0, out: 0 };
    members.forEach(m => { const s = (rec(P.date, m.id) || {}).wedStatus; if (s in w) w[s]++; });
    if (w.coming + w.late + w.out) html += '<p class="sum-note">On Wednesday: ' + w.coming + ' said coming, ' + w.late + ' late, ' + w.out + ' not coming.</p>';
  }
  if (isAdmin() && !isCancelled(P.date)) {
    html += '<p class="sum-note"><button class="btn ghost sm" style="padding-left:0" data-meeting="cancel">' + icon('calendar', 'sm') + 'No meeting this Saturday?</button></p>';
  }
  const el = $('#presSummary');
  el.innerHTML = html;
  const bulk = $('[data-bulk]', el);
  if (bulk) bulk.onclick = async () => {
    const st = bulk.dataset.bulk;
    const label = statusMeta(P.phase, st).label;
    if (!await confirmBox('Mark the rest?', 'The ' + plural(missing, 'scout') + ' not filled yet will be marked <b>' + esc(label) + '</b>.', 'Mark ' + missing)) return;
    members.forEach(m => { if (!(rec(P.date, m.id) || {})[P.phase + 'Status']) setAnswer(P.date, m.id, P.phase, st, ''); });
    drawList();
    drawSummary();
  };
  const cancel = $('[data-meeting="cancel"]', el);
  if (cancel) cancel.onclick = () => {
    openModal('<h2>No meeting on ' + esc(fmtLong(P.date)) + '?</h2><p class="sub">This Saturday will not count in the statistics and reporters cannot fill it.</p>' +
      '<label class="field" style="margin-top:14px">Note (optional)<input class="input" id="mtNote" maxlength="200" placeholder="e.g. Holiday, camp, exams"></label>' +
      '<div class="modal-actions"><button class="btn" data-close>Cancel</button><button class="btn primary" data-ok>Mark as no meeting</button></div>', {
      onMount: (m, close) => { $('[data-ok]', m).onclick = () => { close(); setMeetingCancelled(P.date, true, $('#mtNote', m).value); }; },
    });
  };
  // keep patrol counters in the list headers in sync
  $$('[data-pcount]').forEach(c => {
    const ms = members.filter(m => m.patrol === c.dataset.pcount);
    c.textContent = ms.filter(m => (rec(P.date, m.id) || {})[P.phase + 'Status']).length + '/' + ms.length;
  });
}

function drawList() {
  const P = S.presence;
  const members = presenceMembers();
  const el = $('#presList');
  if (!members.length) {
    el.innerHTML = '<div class="card empty">No scouts to show.' + (isAdmin() ? ' Import the members list in Admin.' : '') + '</div>';
    return;
  }
  const groups = [];
  members.forEach(m => {
    let g = groups[groups.length - 1];
    if (!g || g.patrol !== m.patrol) { g = { patrol: m.patrol, members: [] }; groups.push(g); }
    g.members.push(m);
  });
  el.innerHTML = groups.map(g => {
    const n = g.members.filter(m => (rec(P.date, m.id) || {})[P.phase + 'Status']).length;
    return '<section class="card pcard" style="--pc:' + patrolColor(g.patrol) + '">' +
      '<header class="pc-head"><span class="pdot"></span><h3>' + esc(g.patrol) + '</h3><span class="pc-count" data-pcount="' + esc(g.patrol) + '">' + n + '/' + g.members.length + '</span></header>' +
      g.members.map(rowHtml).join('') + '</section>';
  }).join('');
}

function rowHtml(m) {
  const P = S.presence;
  const r = rec(P.date, m.id) || {};
  const st = r[P.phase + 'Status'] || '';
  const meta = statusMeta(P.phase, st);
  const locked = presenceLocked();
  const stat = computeStats().byId.get(m.id);
  let extra = '';
  if (P.phase === 'sat' && r.wedStatus) {
    const w = statusMeta('wed', r.wedStatus);
    extra += '<span class="pill ' + w.tone + '" title="Wednesday answer">Wed: ' + esc(w.label) + (r.wedReason ? ' · ' + esc(r.wedReason) : '') + '</span>';
  }
  if (stat && stat.streakAlert) extra += '<span class="pill alert-pill glow">' + icon('alert', 'sm') + 'Missed ' + stat.absStreak + ' in a row</span>';
  return '<div class="mrow ' + (locked ? 'locked' : '') + '" data-id="' + esc(m.id) + '">' +
    '<div class="mtop"><span class="avatar">' + esc(initials(m.name)) + '</span>' +
      '<div class="mname"><div class="nm">' + esc(m.name) + '</div><div class="meta">' + (m.birthYear ? '<span>' + esc(m.birthYear) + '</span>' : '') + leaderPill(m) + extra + '</div></div></div>' +
    '<div class="seg seg-status" role="group" aria-label="' + esc(m.name) + '">' +
      PHASES[P.phase].map(o => '<button data-st="' + o.k + '" class="' + o.tone + '" aria-pressed="' + (o.k === st) + '"' + (locked ? ' disabled' : '') + '>' + icon(o.icon, 'sm') + '<span>' + o.short + '</span></button>').join('') +
    '</div>' +
    (meta && meta.reason ? '<input class="input reason" maxlength="200" placeholder="Reason' + (P.phase === 'sat' ? ' (optional)' : '') + '" value="' + esc(r[P.phase + 'Reason'] || '') + '"' + (locked ? ' disabled' : '') + '>' : '') +

// =================================================================== STATS (chief)
function renderStats(v) {
  const st = S.stats;
  const set = S.data.settings;
  const all = computeStats();
  const rows = all.rows.filter(r => st.patrol === 'all' || r.m.patrol === st.patrol);
  const held = all.held;

  // per-meeting numbers for the chart
  const perMeeting = held.map(d => {
    let present = 0, late = 0, absent = 0;
    rows.forEach(r => {
      const s = (rec(d, r.m.id) || {}).satStatus;
      if (s === 'present') present++; else if (s === 'late') late++; else if (s === 'absent') absent++;
    });
    const done = present + late + absent;
    return { date: d, present: present, late: late, absent: absent, done: done, pct: done ? (present + late) / done * 100 : null };
  });
  const sumDone = perMeeting.reduce((a, m) => a + m.done, 0);
  const avg = sumDone ? perMeeting.reduce((a, m) => a + m.present + m.late, 0) / sumDone * 100 : null;
  const lastM = perMeeting[perMeeting.length - 1];
  const alerts = rows.filter(needsAttention).sort((a, b) => (b.absStreak - a.absStreak) || ((a.pct || 0) - (b.pct || 0)));

  const sorters = {
    pct: (a, b) => ((a.pct == null ? 101 : a.pct) - (b.pct == null ? 101 : b.pct)) || (b.absStreak - a.absStreak),
    streak: (a, b) => (b.absStreak - a.absStreak) || ((a.pct || 0) - (b.pct || 0)),
    late: (a, b) => b.late - a.late,
    broken: (a, b) => b.broken - a.broken,
    name: (a, b) => a.m.name.localeCompare(b.m.name),
    patrol: (a, b) => (patrolRank(a.m.patrol) - patrolRank(b.m.patrol)) || (a.m.order - b.m.order),
  };
  const sorted = rows.slice().sort(sorters[st.sort] || sorters.pct);
  const patrols = S.data.patrols;

  let html =
    '<div class="row" style="justify-content:space-between;align-items:flex-end"><div><h1>Statistics</h1><p class="sub">Season from ' + esc(fmtMed(set.seasonStart)) + ' · ' + plural(held.length, 'Saturday') + ' recorded</p></div>' +
    '<button class="btn sm" id="csvBtn">' + icon('download', 'sm') + 'Export CSV</button></div>' +
    '<div class="chips">' + ['all'].concat(patrols).map(p =>
      '<button class="chip" data-spatrol="' + esc(p) + '" aria-pressed="' + (st.patrol === p) + '" style="--pc:' + (p === 'all' ? 'var(--none)' : patrolColor(p)) + '">' +
      (p === 'all' ? 'Whole troupe' : '<span class="pdot"></span>' + esc(p)) + '</button>').join('') + '</div>';

  html += '<div class="kpis">' +
    kpi('Saturdays held', held.length, all.tracking ? 'Percentages are tracked' : 'Percentages start at ' + set.minMeetings) +
    kpi('Average attendance', pctText(avg), plural(rows.length, 'scout')) +
    kpi('Last Saturday', lastM ? (lastM.present + lastM.late) + '/' + lastM.done : '–', lastM ? fmtShort(lastM.date) + ' · ' + lastM.late + ' late' : 'No data yet') +
    kpi('Need attention', alerts.length, alerts.filter(r => r.streakAlert).length + ' missed ' + set.streakAlert + '+ in a row') +
    '</div>';

  html += '<div class="grid-2">';
  html += '<section class="card"><div class="card-head"><h2>Needs attention</h2></div><div class="card-body">' +
    (alerts.length ? '<div class="att-list">' + alerts.map(attItem).join('') + '</div>' :
      '<p class="muted">Nobody to worry about. Alerts appear when a scout misses ' + set.streakAlert + ' Saturdays in a row' +
      (all.tracking ? ', or attendance falls under ' + set.warnPct + '%.' : '. Percentage alerts start after ' + set.minMeetings + ' Saturdays (' + held.length + ' so far).') + '</p>') +
    '</div></section>';
  html += '<section class="card"><div class="card-head"><h2>Attendance per Saturday</h2></div><div class="card-body">' + chartHtml(perMeeting, set) + '</div></section>';
  html += '</div>';

  html += '<section class="card"><div class="card-head"><h2>Scouts</h2>' +
    '<label class="sr" for="sortSel">Sort by</label><select class="input" id="sortSel" style="width:auto;margin:0;min-height:38px;padding:6px 10px;font-size:14px">' +
    [['pct', 'Lowest attendance'], ['streak', 'Missed in a row'], ['late', 'Most lates'], ['broken', 'Said yes, didn\'t come'], ['patrol', 'Patrol'], ['name', 'Name']]
      .map(o => '<option value="' + o[0] + '"' + (st.sort === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select></div>' +
    '<div class="card-body stable" style="padding:8px">' +
      '<div class="srow head"><span>Scout</span><span>Patrol</span><span>Attendance</span><span>Came</span><span>Missed in a row</span><span>Late</span><span>Said yes, no-show</span><span>Last 8</span></div>' +
      (sorted.length ? sorted.map(statRow).join('') : '<p class="empty">No scouts.</p>') +
    '</div></section>';

  // Saturday report
  const dates = Array.from(new Set(S.data.attendance.map(a => a.date).concat(S.data.meetings.map(m => m.date)))).sort().reverse();
  if (!st.meeting || dates.indexOf(st.meeting) < 0) st.meeting = (held[held.length - 1]) || dates[0] || null;
  html += '<section class="card" id="meetingReport"></section>';

  v.innerHTML = html;
  $$('[data-spatrol]', v).forEach(b => { b.onclick = () => { st.patrol = b.dataset.spatrol; renderStats(v); }; });
  $('#sortSel', v).onchange = (e) => { st.sort = e.target.value; renderStats(v); };
  $$('[data-member]', v).forEach(b => { b.onclick = () => openMemberHistory(b.dataset.member); });
  $('#csvBtn', v).onclick = () => exportCsv(rows, held);
  wireChart(v, perMeeting);
  drawMeetingReport(dates);
}

function kpi(label, value, sub) {

}

function statRow(r) {
  const pctCls = r.pctLevel === 'low' ? 'pct-low' : r.pctLevel === 'warn' ? 'pct-warn' : '';
  const dots = r.hist.slice(-8).map(x => '<span class="hdot ' + x.sat + '" title="' + esc(fmtShort(x.date) + ': ' + (x.sat ? statusMeta('sat', x.sat).label : 'not marked')) + '"></span>').join('');
  const streak = r.streakAlert ? '<span class="glow-text">' + r.absStreak + ' missed</span>' : r.absStreak ? r.absStreak + ' missed' : (r.inStreak ? r.inStreak + ' came' : '–');
  return '<button class="srow ' + (r.streakAlert ? 'glow' : '') + '" data-member="' + esc(r.m.id) + '" style="--pc:' + patrolColor(r.m.patrol) + '">' +
    '<span class="s-name"><span class="pdot"></span><span>' + esc(r.m.name) + '</span></span>' +
    '<span class="s-col">' + esc(r.m.patrol) + '</span>' +
    '<span class="s-pct ' + pctCls + '">' + pctText(r.pct) + '</span>' +
    '<span class="s-col">' + r.attended + '/' + r.recorded + '</span>' +
    '<span class="s-col">' + streak + '</span>' +
    '<span class="s-col">' + r.late + '</span>' +
    '<span class="s-col">' + r.broken + (r.promised ? ' of ' + r.promised : '') + '</span>' +
    '<span class="s-dots">' + dots + '</span>' +
    '<span class="s-meta"><span>' + esc(r.m.patrol) + '</span><span>' + r.attended + '/' + r.recorded + ' came</span>' +
      (r.absStreak ? '<span class="' + (r.streakAlert ? 'glow-text' : '') + '">' + r.absStreak + ' missed in a row</span>' : '') +
      (r.late ? '<span>' + plural(r.late, 'late') + '</span>' : '') + '</span>' +
    '</button>';
}

function chartHtml(perMeeting, set) {
  const pts = perMeeting.filter(m => m.done);
  if (!pts.length) return '<p class="empty">No Saturday has been recorded yet.</p>';
  const shown = pts.slice(-16);
  const every = shown.length > 10 ? 2 : 1;
  return '<div class="chart" id="chart">' +
    '<div class="chart-plot">' +
      [100, 50, 0].map(g => '<div class="chart-grid" style="bottom:' + g + '%"><span>' + g + '%</span></div>').join('') +
      '<div class="chart-grid ref" style="bottom:' + set.warnPct + '%"><span>' + set.warnPct + '% target</span></div>' +
      shown.map((m, i) => '<button class="bar-col" data-bar="' + i + '" aria-label="' + esc(fmtLong(m.date) + ': ' + (m.present + m.late) + ' of ' + m.done + ' came') + '">' +
        '<div class="bar" style="height:' + m.pct + '%"></div>' +
        (i === shown.length - 1 ? '<span class="bar-val" style="bottom:calc(' + m.pct + '% + 4px)">' + Math.round(m.pct) + '%</span>' : '') + '</button>').join('') +
    '</div>' +
    '<div class="chart-x">' + shown.map((m, i) => '<span>' + ((shown.length - 1 - i) % every === 0 ? esc(fmtShort(m.date)) : '') + '</span>').join('') + '</div>' +
    '<div class="tip hidden" id="chartTip"></div></div>';
}

function wireChart(v, perMeeting) {
  const chart = $('#chart', v);
  if (!chart) return;
  const shown = perMeeting.filter(m => m.done).slice(-16);
  const tip = $('#chartTip', chart);
  const show = (btn) => {
    const m = shown[Number(btn.dataset.bar)];
    $$('.bar-col', chart).forEach(b => b.classList.toggle('on', b === btn));
    tip.innerHTML = '<b>' + esc(fmtMed(m.date)) + '</b>' + (m.present + m.late) + ' of ' + m.done + ' came (' + Math.round(m.pct) + '%)<br>' + m.late + ' late · ' + m.absent + ' absent';
    const cr = chart.getBoundingClientRect();
    const br = btn.getBoundingClientRect();
    const x = Math.min(Math.max(br.left - cr.left + br.width / 2, 90), cr.width - 90);
    tip.style.left = x + 'px';
    tip.style.top = (br.top - cr.top + br.height * (1 - m.pct / 100) - 8) + 'px';
    tip.classList.remove('hidden');
  };
  const hide = () => { tip.classList.add('hidden'); $$('.bar-col', chart).forEach(b => b.classList.remove('on')); };
  $$('.bar-col', chart).forEach(b => {
    b.addEventListener('mouseenter', () => show(b));
    b.addEventListener('focus', () => show(b));
    b.addEventListener('click', () => show(b));
    b.addEventListener('blur', hide);
  });
  chart.addEventListener('mouseleave', hide);
}

function drawMeetingReport(dates) {
  const el = $('#meetingReport');
  const st = S.stats;
  if (!dates.length || !st.meeting) {
    el.innerHTML = '<div class="card-head"><h2>Saturday report</h2></div><p class="empty">Nothing recorded yet.</p>';
    return;
  }
  const d = st.meeting;
  const patrols = st.patrol === 'all' ? S.data.patrols : [st.patrol];
  const members = activeMembers(patrols);
  const cancelled = isCancelled(d);
  const reportersFor = (p) => S.data.reporters.filter(r => r.role !== 'admin' && (!r.patrols.length || r.patrols.indexOf(p) >= 0)).map(r => r.name);
  const cell = (n, total, label) => '<span class="' + (n === total ? '' : 'pct-warn') + '">' + n + '/' + total + '</span>' + (label ? ' <span class="muted">' + label + '</span>' : '');

  let rowsHtml = '';
  patrols.forEach(p => {
    const ms = members.filter(m => m.patrol === p);
    if (!ms.length) return;
    const c = { coming: 0, late: 0, out: 0, noreply: 0, wed: 0, present: 0, slate: 0, absent: 0, sat: 0 };
    ms.forEach(m => {
      const r = rec(d, m.id) || {};
      if (r.wedStatus) { c.wed++; c[r.wedStatus]++; }
      if (r.satStatus) { c.sat++; if (r.satStatus === 'late') c.slate++; else c[r.satStatus]++; }
    });
    rowsHtml += '<tr><td><span class="pdot" style="--pc:' + patrolColor(p) + '"></span> <b>' + esc(p) + '</b><div class="muted small">' + esc(reportersFor(p).join(', ') || '—') + '</div></td>' +
      '<td class="num">' + cell(c.wed, ms.length, 'filled') + '<div class="small">' + c.coming + ' in · ' + c.late + ' late · ' + c.out + ' out · ' + c.noreply + ' no reply</div></td>' +
      '<td class="num">' + cell(c.sat, ms.length, 'filled') + '<div class="small">' + c.present + ' present · ' + c.slate + ' late · ' + c.absent + ' absent</div></td></tr>';
  });

  const listOf = (phase, status) => members.filter(m => (rec(d, m.id) || {})[phase + 'Status'] === status);
  const reasonList = (title, ms, phase) => ms.length ? '<div style="margin-top:14px"><h3>' + esc(title) + ' (' + ms.length + ')</h3><div class="reason-list">' +
    ms.map(m => '<div><span class="pdot" style="--pc:' + patrolColor(m.patrol) + '"></span><b>' + esc(m.name) + '</b><span class="muted">' + esc((rec(d, m.id) || {})[phase + 'Reason'] || 'no reason given') + '</span></div>').join('') + '</div></div>' : '';
  const noShows = members.filter(m => { const r = rec(d, m.id) || {}; return (r.wedStatus === 'coming' || r.wedStatus === 'late') && r.satStatus === 'absent'; });

  el.innerHTML =
    '<div class="card-head"><h2>Saturday report</h2><select class="input" id="mtSel" style="width:auto;margin:0;min-height:38px;padding:6px 10px;font-size:14px">' +
      dates.map(x => '<option value="' + x + '"' + (x === d ? ' selected' : '') + '>' + esc(fmtMed(x)) + (isCancelled(x) ? ' (no meeting)' : '') + '</option>').join('') + '</select></div>' +
    '<div class="card-body">' +
      (cancelled ? '<div class="banner bad">' + icon('calendar') + '<span class="grow">No meeting on this date.</span></div>' :
      '<div class="scroll-x"><table class="ttable"><thead><tr><th>Patrol · reporters</th><th>Wednesday</th><th>Saturday</th></tr></thead><tbody>' + rowsHtml + '</tbody></table></div>' +
      reasonList('Absent', listOf('sat', 'absent'), 'sat') +
      reasonList('Came late', listOf('sat', 'late'), 'sat') +
      reasonList('Said they would come but did not', noShows, 'sat') +
      reasonList('Said not coming (Wednesday)', listOf('wed', 'out'), 'wed') +
      reasonList('No reply on Wednesday', listOf('wed', 'noreply'), 'wed')) +
    '</div>';
  $('#mtSel', el).onchange = (e) => { st.meeting = e.target.value; drawMeetingReport(dates); };
}

    '<div class="scroll-x" style="margin-top:14px"><table class="ttable"><thead><tr><th>Date</th><th>Wednesday</th><th>Saturday</th></tr></thead><tbody>' +
      (rows || '<tr><td colspan="3" class="muted">Nothing recorded yet.</td></tr>') + '</tbody></table></div>' +
    '<div class="modal-actions"><button class="btn" data-close>Close</button></div>', { wide: true });
}

function exportCsv(rows, held) {
  const q = (s) => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
  const head = ['Scout', 'Patrol', 'Birth year', 'Attendance %', 'Came', 'Recorded', 'Missed in a row', 'Late', 'Said yes but absent'].concat(held);
  const lines = [head.map(q).join(',')].concat(rows.map(r => [
    r.m.name, r.m.patrol, r.m.birthYear, r.pct == null ? '' : Math.round(r.pct), r.attended, r.recorded, r.absStreak, r.late, r.broken,
  ].concat(r.hist.map(x => x.sat ? statusMeta('sat', x.sat).label + (x.satReason ? ' (' + x.satReason + ')' : '') : '')).map(q).join(',')));
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'attendance-' + todayIso() + '.csv';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
